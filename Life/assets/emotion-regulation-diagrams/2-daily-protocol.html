<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>糟心事全天应对流程</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#020617; color:#e2e8f0; font-family:'JetBrains Mono',monospace; padding:32px; }
  .header { display:flex; align-items:center; gap:12px; margin-bottom:8px; }
  .dot { width:10px; height:10px; border-radius:50%; background:#34d399; animation:pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:.5;transform:scale(.8);} }
  h1 { font-size:18px; font-weight:600; }
  .subtitle { color:#94a3b8; font-size:12px; margin-bottom:20px; }
  .card { background:#0f172a; border:1px solid #1e293b; border-radius:12px; padding:24px; }
  .cards { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:20px; }
  .info-card { background:#0f172a; border:1px solid #1e293b; border-radius:10px; padding:16px; }
  .info-card h3 { font-size:12px; margin-bottom:10px; display:flex; align-items:center; gap:8px; }
  .card-dot { width:8px; height:8px; border-radius:50%; }
  .cyan{background:#22d3ee;} .emerald{background:#34d399;} .rose{background:#fb7185;}
  .info-card ul { list-style:none; }
  .info-card li { font-size:11px; color:#94a3b8; line-height:1.8; }
  .footer { margin-top:20px; color:#475569; font-size:10px; }
</style>
</head>
<body>
<div class="header"><div class="dot"></div><h1>遇到糟心事的一天：四阶段应对流程</h1></div>
<div class="subtitle">0-10 分钟灭火 → 数小时转移着陆 → 当晚认知重评 → 睡前清空归档（每阶段只做该阶段的事）</div>
<div class="card">
<svg viewBox="0 0 1080 800" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="aw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
    </marker>
  </defs>
  <rect width="1080" height="800" fill="url(#grid)"/>

  <!-- arrows between phases -->
  <path d="M 300 130 L 330 130" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#aw)"/>
  <path d="M 560 130 L 590 130" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#aw)"/>
  <path d="M 820 130 L 850 130" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#aw)"/>
  <path d="M 540 200 L 540 250" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#aw)"/>

  <!-- Phase timeline headers -->
  <rect x="40" y="70" width="260" height="60" rx="6" fill="#0f172a"/>
  <rect x="40" y="70" width="260" height="60" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="2"/>
  <text x="170" y="95" fill="#fb7185" font-size="12" font-weight="600" text-anchor="middle">① 0-10 分钟</text>
  <text x="170" y="113" fill="#94a3b8" font-size="9" text-anchor="middle">生理灭火 · 不做大决定</text>

  <rect x="330" y="70" width="230" height="60" rx="6" fill="#0f172a"/>
  <rect x="330" y="70" width="230" height="60" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="445" y="95" fill="#fbbf24" font-size="12" font-weight="600" text-anchor="middle">② 10 分钟-数小时</text>
  <text x="445" y="113" fill="#94a3b8" font-size="9" text-anchor="middle">转移 + 着陆 · 打断反刍</text>

  <rect x="590" y="70" width="230" height="60" rx="6" fill="#0f172a"/>
  <rect x="590" y="70" width="230" height="60" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="2"/>
  <text x="705" y="95" fill="#34d399" font-size="12" font-weight="600" text-anchor="middle">③ 当晚</text>
  <text x="705" y="113" fill="#94a3b8" font-size="9" text-anchor="middle">认知重评 · 纸笔拆解</text>

  <rect x="850" y="70" width="190" height="60" rx="6" fill="#0f172a"/>
  <rect x="850" y="70" width="190" height="60" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="945" y="95" fill="#a78bfa" font-size="12" font-weight="600" text-anchor="middle">④ 睡前</text>
  <text x="945" y="113" fill="#94a3b8" font-size="9" text-anchor="middle">清空 + 感恩归档</text>

  <!-- Phase 1 detail -->
  <rect x="40" y="150" width="260" height="190" rx="6" fill="#0f172a"/>
  <rect x="40" y="150" width="260" height="190" rx="6" fill="rgba(136,19,55,0.18)" stroke="#fb7185" stroke-width="1.2"/>
  <text x="60" y="176" fill="#fb7185" font-size="10">上头瞬间：</text>
  <text x="60" y="196" fill="#94a3b8" font-size="9">1. 深呼吸 3 秒</text>
  <text x="60" y="212" fill="#94a3b8" font-size="9">2. 离开现场（哪怕去厕所）</text>
  <text x="60" y="228" fill="#94a3b8" font-size="9">3. 冷水洗手/喝口水</text>
  <text x="60" y="244" fill="#94a3b8" font-size="9">4. 4-7-8 呼吸 4 轮</text>
  <text x="60" y="260" fill="#94a3b8" font-size="9">5. 命名："愤怒，7 分"</text>
  <text x="60" y="284" fill="#fb7185" font-size="9" font-weight="600">铁律：不发消息、不做决定</text>
  <text x="60" y="300" fill="#fb7185" font-size="9" font-weight="600">       不回应挑衅</text>
  <text x="60" y="324" fill="#64748b" font-size="8">原理：峰值约 1-2 分钟，撑过即赢</text>

  <!-- Phase 2 detail -->
  <rect x="330" y="150" width="230" height="190" rx="6" fill="#0f172a"/>
  <rect x="330" y="150" width="230" height="190" rx="6" fill="rgba(120,53,15,0.18)" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="350" y="176" fill="#fbbf24" font-size="10">物理动作打断反刍：</text>
  <text x="350" y="196" fill="#94a3b8" font-size="9">1. 散步/运动/做家务</text>
  <text x="350" y="212" fill="#94a3b8" font-size="9">2. 觉察"循环回放"</text>
  <text x="350" y="228" fill="#94a3b8" font-size="9">   = 反刍启动信号</text>
  <text x="350" y="244" fill="#94a3b8" font-size="9">3. 5-4-3-2-1 感官着陆</text>
  <text x="350" y="260" fill="#94a3b8" font-size="9">4. 专注手头一件事</text>
  <text x="350" y="284" fill="#fbbf24" font-size="9" font-weight="600">关键：思考有出口，</text>
  <text x="350" y="300" fill="#fbbf24" font-size="9" font-weight="600">      反刍无出口</text>
  <text x="350" y="324" fill="#64748b" font-size="8">原理：具身感受解除脑内灾难推演</text>

  <!-- Phase 3 detail -->
  <rect x="590" y="150" width="230" height="190" rx="6" fill="#0f172a"/>
  <rect x="590" y="150" width="230" height="190" rx="6" fill="rgba(6,78,59,0.18)" stroke="#34d399" stroke-width="1.2"/>
  <text x="610" y="176" fill="#34d399" font-size="10">纸笔做 ABC 拆解：</text>
  <text x="610" y="196" fill="#94a3b8" font-size="9">1. 情绪日记：事件+感受</text>
  <text x="610" y="212" fill="#94a3b8" font-size="9">2. 三问：</text>
  <text x="610" y="228" fill="#94a3b8" font-size="9">   最坏结果？可控部分？</text>
  <text x="610" y="244" fill="#94a3b8" font-size="9">   朋友遇到怎么劝？</text>
  <text x="610" y="260" fill="#94a3b8" font-size="9">3. 换框：写 3 个不同的 B</text>
  <text x="610" y="276" fill="#94a3b8" font-size="9">4. 若是"人"：选一个策略</text>
  <text x="610" y="292" fill="#94a3b8" font-size="9">   不接招/不纠缠/灰岩/走流程</text>
  <text x="610" y="324" fill="#64748b" font-size="8">原理：写下来才能看见自己的 B</text>

  <!-- Phase 4 detail -->
  <rect x="850" y="150" width="190" height="190" rx="6" fill="#0f172a"/>
  <rect x="850" y="150" width="190" height="190" rx="6" fill="rgba(76,29,149,0.18)" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="870" y="176" fill="#a78bfa" font-size="10">清空大脑：</text>
  <text x="870" y="196" fill="#94a3b8" font-size="9">1. 未解决的事：</text>
  <text x="870" y="212" fill="#94a3b8" font-size="9">   写一句"下一步"</text>
  <text x="870" y="228" fill="#94a3b8" font-size="9">   合上本子=已存档</text>
  <text x="870" y="252" fill="#94a3b8" font-size="9">2. 写 1-3 件</text>
  <text x="870" y="268" fill="#94a3b8" font-size="9">   今天值得感激的事</text>
  <text x="870" y="292" fill="#a78bfa" font-size="9" font-weight="600">训练注意力的正向选择</text>
  <text x="870" y="324" fill="#64748b" font-size="8">原理：给大脑一个完结信号</text>

  <!-- Next day box -->
  <rect x="40" y="360" width="1000" height="130" rx="8" fill="#0f172a"/>
  <rect x="40" y="360" width="1000" height="130" rx="8" fill="rgba(8,51,68,0.35)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="60" y="390" fill="#22d3ee" font-size="11" font-weight="600">⑤ 次日及以后：分岔处理</text>
  <text x="60" y="416" fill="#94a3b8" font-size="10">▸ 能行动的糟心事 → 执行昨晚写下的下一步（把焦虑转成行动清单）</text>
  <text x="60" y="436" fill="#94a3b8" font-size="10">▸ 不能行动的（别人的烂事）→ 觉察反刍 → 标注"这是反刍" → 温和地回到手头的事（不批评自己）</text>
  <text x="60" y="456" fill="#94a3b8" font-size="10">▸ 同一触发源反复出现 → 上长期建设清单（睡眠/晨光/运动/自然/接纳），或考虑环境调整</text>
  <text x="60" y="476" fill="#fbbf24" font-size="10" font-weight="600">▸ 低落/焦虑持续 2 周以上自我调节无效 → 寻求专业帮助（这不是脆弱，是负责）</text>

  <!-- long-term foundation -->
  <rect x="40" y="510" width="1000" height="220" rx="8" fill="none" stroke="#34d399" stroke-width="1.2" stroke-dasharray="8,4"/>
  <text x="60" y="538" fill="#34d399" font-size="11" font-weight="600">长期底盘（决定恢复速度）：阴霾走得快不快，取决于平时的"情绪底盘"</text>

  <rect x="60" y="555" width="230" height="60" rx="6" fill="#0f172a"/>
  <rect x="60" y="555" width="230" height="60" rx="6" fill="rgba(6,78,59,0.3)" stroke="#34d399" stroke-width="1.2"/>
  <text x="175" y="578" fill="#34d399" font-size="10" text-anchor="middle">睡眠 7-8h · 23 点前</text>
  <text x="175" y="598" fill="#94a3b8" font-size="8" text-anchor="middle">稳住皮质醇/褪黑素节律</text>

  <rect x="310" y="555" width="230" height="60" rx="6" fill="#0f172a"/>
  <rect x="310" y="555" width="230" height="60" rx="6" fill="rgba(6,78,59,0.3)" stroke="#34d399" stroke-width="1.2"/>
  <text x="425" y="578" fill="#34d399" font-size="10" text-anchor="middle">晨间自然光 20 分钟</text>
  <text x="425" y="598" fill="#94a3b8" font-size="8" text-anchor="middle">血清素 + 夜间深睡眠</text>

  <rect x="560" y="555" width="230" height="60" rx="6" fill="#0f172a"/>
  <rect x="560" y="555" width="230" height="60" rx="6" fill="rgba(6,78,59,0.3)" stroke="#34d399" stroke-width="1.2"/>
  <text x="675" y="578" fill="#34d399" font-size="10" text-anchor="middle">每周 3 次有氧运动</text>
  <text x="675" y="598" fill="#94a3b8" font-size="8" text-anchor="middle">提升心率变异性 HRV</text>

  <rect x="810" y="555" width="210" height="60" rx="6" fill="#0f172a"/>
  <rect x="810" y="555" width="210" height="60" rx="6" fill="rgba(6,78,59,0.3)" stroke="#34d399" stroke-width="1.2"/>
  <text x="915" y="578" fill="#34d399" font-size="10" text-anchor="middle">自然暴露 ≥120 分钟/周</text>
  <text x="915" y="598" fill="#94a3b8" font-size="8" text-anchor="middle">降低皮质醇与肾上腺素</text>

  <rect x="60" y="635" width="230" height="60" rx="6" fill="#0f172a"/>
  <rect x="60" y="635" width="230" height="60" rx="6" fill="rgba(6,78,59,0.3)" stroke="#34d399" stroke-width="1.2"/>
  <text x="175" y="658" fill="#34d399" font-size="10" text-anchor="middle">高质量社交 · 远离烂人</text>
  <text x="175" y="678" fill="#94a3b8" font-size="8" text-anchor="middle">降皮质醇 · 促催产素</text>

  <rect x="310" y="635" width="230" height="60" rx="6" fill="#0f172a"/>
  <rect x="310" y="635" width="230" height="60" rx="6" fill="rgba(6,78,59,0.3)" stroke="#34d399" stroke-width="1.2"/>
  <text x="425" y="658" fill="#34d399" font-size="10" text-anchor="middle">正念冥想 10 分钟/天</text>
  <text x="425" y="678" fill="#94a3b8" font-size="8" text-anchor="middle">杏仁核减敏 · 前额叶增强</text>

  <rect x="560" y="635" width="230" height="60" rx="6" fill="#0f172a"/>
  <rect x="560" y="635" width="230" height="60" rx="6" fill="rgba(6,78,59,0.3)" stroke="#34d399" stroke-width="1.2"/>
  <text x="675" y="658" fill="#34d399" font-size="10" text-anchor="middle">表达性书写 15-20 分钟</text>
  <text x="675" y="678" fill="#94a3b8" font-size="8" text-anchor="middle">削弱杏仁核痛苦信号</text>

  <rect x="810" y="635" width="210" height="60" rx="6" fill="#0f172a"/>
  <rect x="810" y="635" width="210" height="60" rx="6" fill="rgba(6,78,59,0.3)" stroke="#34d399" stroke-width="1.2"/>
  <text x="915" y="658" fill="#34d399" font-size="10" text-anchor="middle">无条件自我接纳</text>
  <text x="915" y="678" fill="#94a3b8" font-size="8" text-anchor="middle">内耗最深的根是不接纳</text>

  <text x="60" y="765" fill="#64748b" font-size="9">心法主线：身体先落地 → 认知再上场 → 行动收尾 → 长期建设。每个阶段只做该阶段的事，顺序不能颠倒。</text>
</svg>
</div>

<div class="cards">
  <div class="info-card">
    <h3><div class="card-dot rose"></div>阶段铁律</h3>
    <ul>
      <li>• 上头 10 分钟：只管身体</li>
      <li>• 不发任何消息、不做决定</li>
      <li>• 认知工作留到当晚纸笔做</li>
    </ul>
  </div>
  <div class="info-card">
    <h3><div class="card-dot emerald"></div>反刍识别</h3>
    <ul>
      <li>• 思考有出口（得出下一步）</li>
      <li>• 反刍无出口（循环回放）</li>
      <li>• 觉察即打断，不批评自己</li>
    </ul>
  </div>
  <div class="info-card">
    <h3><div class="card-dot cyan"></div>睡前归档</h3>
    <ul>
      <li>• 写"下一步"给大脑完结信号</li>
      <li>• 感恩清单训练正向注意力</li>
      <li>• 2 周无缓解 → 专业帮助</li>
    </ul>
  </div>
</div>
<div class="footer">情绪修复与心态调整指南 · 图2 · 2026-08-21</div>
</body>
</html>
