<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>图3 · 三层架构与病理</title>
<style>
html,body{margin:0;padding:0;background:#0d1117}
svg{display:block;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
</style></head><body>
<svg viewBox="0 0 1200 820" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1200" height="820" fill="#0d1117"/>
  <text x="60" y="56" fill="#e6edf3" font-size="24" font-weight="700">图 3 · Agent 三层分工与已知病理</text>
  <text x="60" y="86" fill="#8b949e" font-size="13">Jev 决策层 + LLM 生成层 + 确定性代码执行层；右侧为必须知晓的失效模式</text>

  <!-- 请求入口 -->
  <rect x="60" y="120" width="620" height="40" rx="20" fill="#161b22" stroke="#30363d"/>
  <text x="370" y="146" fill="#8b949e" font-size="13" text-anchor="middle">请求 / 状态进入</text>

  <!-- Jev 层 -->
  <rect x="60" y="180" width="620" height="110" rx="12" fill="#161b22" stroke="#3fb950"/>
  <circle cx="92" cy="212" r="12" fill="#3fb950"/>
  <text x="92" y="217" fill="#0d1117" font-size="13" font-weight="700" text-anchor="middle">1</text>
  <text x="120" y="217" fill="#3fb950" font-size="16" font-weight="700">Jev 决策层（System 1）</text>
  <text x="90" y="247" fill="#8b949e" font-size="12">意图分类 · 工具/模型路由 · 危险操作拦截 · 循环终止判断</text>
  <text x="90" y="271" fill="#8b949e" font-size="12">毫秒级反射弧，输出校准概率，不生成文本</text>

  <!-- LLM 层 -->
  <rect x="60" y="320" width="620" height="110" rx="12" fill="#161b22" stroke="#d29922"/>
  <circle cx="92" cy="352" r="12" fill="#d29922"/>
  <text x="92" y="357" fill="#0d1117" font-size="13" font-weight="700" text-anchor="middle">2</text>
  <text x="120" y="357" fill="#d29922" font-size="16" font-weight="700">LLM 生成层（System 2）</text>
  <text x="90" y="387" fill="#8b949e" font-size="12">复杂推理 · 规划 · 起草回复 · 生成字段内容</text>
  <text x="90" y="411" fill="#8b949e" font-size="12">仅在 Jev 判定为复杂 / 低置信兜底时出场</text>

  <!-- 代码层 -->
  <rect x="60" y="460" width="620" height="110" rx="12" fill="#161b22" stroke="#58a6ff"/>
  <circle cx="92" cy="492" r="12" fill="#58a6ff"/>
  <text x="92" y="497" fill="#0d1117" font-size="13" font-weight="700" text-anchor="middle">3</text>
  <text x="120" y="497" fill="#58a6ff" font-size="16" font-weight="700">代码执行层（确定性）</text>
  <text x="90" y="527" fill="#8b949e" font-size="12">工具副作用 · 状态与算术 · 策略阈值 · 权限与审计</text>
  <text x="90" y="551" fill="#8b949e" font-size="12">何时执行 / 降级 / 交人由代码说了算</text>

  <!-- 层间箭头 -->
  <path d="M 200 290 L 200 316" stroke="#d29922" stroke-width="2" fill="none"/>
  <path d="M 194 316 L 200 326 L 206 316 Z" fill="#d29922"/>
  <text x="216" y="310" fill="#8b949e" font-size="12">复杂任务</text>

  <path d="M 470 290 L 470 456" stroke="#58a6ff" stroke-width="2" fill="none"/>
  <path d="M 464 456 L 470 466 L 476 456 Z" fill="#58a6ff"/>
  <text x="486" y="380" fill="#8b949e" font-size="12">简单任务直接执行</text>

  <path d="M 200 430 L 200 456" stroke="#58a6ff" stroke-width="2" fill="none"/>
  <path d="M 194 456 L 200 466 L 206 456 Z" fill="#58a6ff"/>

  <!-- 反馈回路：执行结果回到 Jev -->
  <path d="M 60 515 L 36 515 L 36 235 L 56 235" stroke="#8b949e" stroke-width="1.4" stroke-dasharray="6 5" fill="none"/>
  <path d="M 56 229 L 66 235 L 56 241 Z" fill="#8b949e"/>
  <text x="14" y="380" fill="#6e7681" font-size="11" transform="rotate(-90 14 380)">结果反馈：继续 / 终止</text>

  <!-- 右侧病理面板 -->
  <rect x="730" y="120" width="450" height="450" rx="12" fill="#161b22" stroke="#f85149"/>
  <text x="756" y="156" fill="#f85149" font-size="16" font-weight="700">已知病理 / 失效模式</text>

  <text x="756" y="196" fill="#e6edf3" font-size="13" font-weight="600">① 无信号硬选</text>
  <text x="756" y="220" fill="#8b949e" font-size="12">无真实差异对照组表现掉回随机水平；</text>
  <text x="756" y="240" fill="#8b949e" font-size="12">须内置 other / skip 显式拒答出口</text>

  <line x1="756" y1="262" x2="1154" y2="262" stroke="#30363d"/>

  <text x="756" y="292" fill="#e6edf3" font-size="13" font-weight="600">② 误差高置信传导</text>
  <text x="756" y="316" fill="#8b949e" font-size="12">上游 OCR / 抽取错一个字符，判别器</text>
  <text x="756" y="336" fill="#8b949e" font-size="12">会高置信选中错值，且无纠错能力</text>

  <line x1="756" y1="358" x2="1154" y2="358" stroke="#30363d"/>

  <text x="756" y="388" fill="#e6edf3" font-size="13" font-weight="600">③ 校准不覆盖单次与长尾</text>
  <text x="756" y="412" fill="#8b949e" font-size="12">0.97 是群体统计性质，不保证这一次；</text>
  <text x="756" y="432" fill="#8b949e" font-size="12">OOD / 长尾校准无公开独立证据</text>

  <line x1="756" y1="454" x2="1154" y2="454" stroke="#30363d"/>

  <text x="756" y="484" fill="#e6edf3" font-size="13" font-weight="600">④ 无解释不可审计</text>
  <text x="756" y="508" fill="#8b949e" font-size="12">只给选项与概率，金融医疗需保留</text>
  <text x="756" y="528" fill="#8b949e" font-size="12">复核、日志与归因链路</text>

  <text x="756" y="558" fill="#6e7681" font-size="11">来源：知乎实测转述，引用前请二次核对</text>

  <!-- 三张 info card -->
  <g>
    <rect x="60" y="610" width="346" height="100" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="80" y="640" fill="#58a6ff" font-size="13" font-weight="600">集成形态</text>
    <text x="80" y="664" fill="#e6edf3" font-size="12">LangChain：分类器 / 路由 / 安全门禁</text>
    <text x="80" y="686" fill="#8b949e" font-size="12">Vercel：Gateway + AI SDK evaluate</text>
  </g>
  <g>
    <rect x="427" y="610" width="346" height="100" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="447" y="640" fill="#58a6ff" font-size="13" font-weight="600">开源边界</text>
    <text x="447" y="664" fill="#e6edf3" font-size="12">复刻结构化输出 ≠ 复刻 RLCD 校准</text>
    <text x="447" y="686" fill="#8b949e" font-size="12">门槛在数据合成与硬负例设计</text>
  </g>
  <g>
    <rect x="794" y="610" width="346" height="100" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="814" y="640" fill="#58a6ff" font-size="13" font-weight="600">落地节奏</text>
    <text x="814" y="664" fill="#e6edf3" font-size="12">先高频可逆节点，灰度 + 兜底</text>
    <text x="814" y="686" fill="#8b949e" font-size="12">监控分桶准确率与分布漂移</text>
  </g>

  <text x="60" y="752" fill="#6e7681" font-size="12">产品状态：小范围内测；定价 $0.042/1M 输入、输出免费；无具名客户与收入披露</text>
</svg>
</body></html>
