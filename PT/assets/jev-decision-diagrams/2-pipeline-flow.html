<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>图2 · 决策流水线</title>
<style>
html,body{margin:0;padding:0;background:#0d1117}
svg{display:block;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
</style></head><body>
<svg viewBox="0 0 1200 820" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1200" height="820" fill="#0d1117"/>
  <text x="60" y="56" fill="#e6edf3" font-size="24" font-weight="700">图 2 · Jev 决策流水线：单次前向 + 策略级联</text>
  <text x="60" y="86" fill="#8b949e" font-size="13">非自回归：一次请求并行回答全部子问题；策略阈值留在代码中，低置信走兜底回路</text>

  <!-- 步骤 1 -->
  <rect x="60" y="150" width="200" height="150" rx="12" fill="#161b22" stroke="#30363d"/>
  <circle cx="92" cy="182" r="15" fill="#58a6ff"/>
  <text x="92" y="187" fill="#0d1117" font-size="14" font-weight="700" text-anchor="middle">1</text>
  <text x="120" y="187" fill="#e6edf3" font-size="15" font-weight="600">状态输入</text>
  <text x="80" y="222" fill="#8b949e" font-size="12">非结构化 state：</text>
  <text x="80" y="244" fill="#8b949e" font-size="12">邮件 / 对话 / 页面</text>
  <text x="80" y="266" fill="#8b949e" font-size="12">/ 程序运行状态</text>

  <!-- 步骤 2 -->
  <rect x="290" y="150" width="200" height="150" rx="12" fill="#161b22" stroke="#30363d"/>
  <circle cx="322" cy="182" r="15" fill="#58a6ff"/>
  <text x="322" y="187" fill="#0d1117" font-size="14" font-weight="700" text-anchor="middle">2</text>
  <text x="350" y="187" fill="#e6edf3" font-size="15" font-weight="600">声明任务</text>
  <text x="310" y="222" fill="#8b949e" font-size="12">运行时现场写 schema：</text>
  <text x="310" y="244" fill="#8b949e" font-size="12">Choice ≤255 候选</text>
  <text x="310" y="266" fill="#8b949e" font-size="12">Boolean / Score</text>

  <!-- 步骤 3 -->
  <rect x="520" y="150" width="200" height="150" rx="12" fill="#161b22" stroke="#30363d"/>
  <circle cx="552" cy="182" r="15" fill="#58a6ff"/>
  <text x="552" y="187" fill="#0d1117" font-size="14" font-weight="700" text-anchor="middle">3</text>
  <text x="580" y="187" fill="#e6edf3" font-size="15" font-weight="600">单次前向</text>
  <text x="540" y="222" fill="#3fb950" font-size="12">无自回归循环</text>
  <text x="540" y="244" fill="#8b949e" font-size="12">共享骨干并行打分</text>
  <text x="540" y="266" fill="#8b949e" font-size="12">70–500ms 返回</text>

  <!-- 步骤 4 -->
  <rect x="750" y="150" width="200" height="150" rx="12" fill="#161b22" stroke="#30363d"/>
  <circle cx="782" cy="182" r="15" fill="#58a6ff"/>
  <text x="782" y="187" fill="#0d1117" font-size="14" font-weight="700" text-anchor="middle">4</text>
  <text x="810" y="187" fill="#e6edf3" font-size="15" font-weight="600">概率输出</text>
  <text x="770" y="222" fill="#8b949e" font-size="12">强类型概率分布：</text>
  <text x="770" y="244" fill="#8b949e" font-size="12">P(候选) / P(true)</text>
  <text x="770" y="266" fill="#8b949e" font-size="12">/ Score 期望</text>

  <!-- 步骤 5 -->
  <rect x="980" y="150" width="200" height="150" rx="12" fill="#161b22" stroke="#30363d"/>
  <circle cx="1012" cy="182" r="15" fill="#58a6ff"/>
  <text x="1012" y="187" fill="#0d1117" font-size="14" font-weight="700" text-anchor="middle">5</text>
  <text x="1040" y="187" fill="#e6edf3" font-size="15" font-weight="600">代码路由</text>
  <text x="1000" y="222" fill="#8b949e" font-size="12">阈值策略不交给模型：</text>
  <text x="1000" y="244" fill="#8b949e" font-size="12">按置信度分流</text>
  <text x="1000" y="266" fill="#8b949e" font-size="12">执行 / 复核 / 人工</text>

  <!-- 箭头 -->
  <g stroke="#58a6ff" stroke-width="2" fill="none">
    <path d="M 260 225 L 286 225"/>
    <path d="M 490 225 L 516 225"/>
    <path d="M 720 225 L 746 225"/>
    <path d="M 950 225 L 976 225"/>
  </g>
  <g fill="#58a6ff">
    <path d="M 286 220 L 296 225 L 286 230 Z"/>
    <path d="M 516 220 L 526 225 L 516 230 Z"/>
    <path d="M 746 220 L 756 225 L 746 230 Z"/>
    <path d="M 976 220 L 986 225 L 976 230 Z"/>
  </g>

  <!-- 三条兜底分支 -->
  <path d="M 1080 300 L 1080 372" stroke="#30363d" stroke-width="1.5" fill="none"/>
  <path d="M 1080 372 L 1000 372 L 1000 402" stroke="#30363d" stroke-width="1.5" fill="none"/>
  <path d="M 1080 372 L 620 372 L 620 402" stroke="#30363d" stroke-width="1.5" fill="none"/>
  <path d="M 1080 372 L 200 372 L 200 402" stroke="#30363d" stroke-width="1.5" fill="none"/>

  <rect x="100" y="402" width="200" height="86" rx="10" fill="#161b22" stroke="#3fb950"/>
  <text x="200" y="434" fill="#3fb950" font-size="14" font-weight="600" text-anchor="middle">高置信 p ≥ 0.9</text>
  <text x="200" y="460" fill="#e6edf3" font-size="13" text-anchor="middle">自动执行</text>
  <text x="200" y="480" fill="#8b949e" font-size="12" text-anchor="middle">可逆低风险节点优先</text>

  <rect x="520" y="402" width="200" height="86" rx="10" fill="#161b22" stroke="#d29922"/>
  <text x="620" y="434" fill="#d29922" font-size="14" font-weight="600" text-anchor="middle">中置信 0.7–0.9</text>
  <text x="620" y="460" fill="#e6edf3" font-size="13" text-anchor="middle">二次校验</text>
  <text x="620" y="480" fill="#8b949e" font-size="12" text-anchor="middle">换旗舰大模型复核</text>

  <rect x="900" y="402" width="200" height="86" rx="10" fill="#161b22" stroke="#f85149"/>
  <text x="1000" y="434" fill="#f85149" font-size="14" font-weight="600" text-anchor="middle">低置信 p &lt; 0.7</text>
  <text x="1000" y="460" fill="#e6edf3" font-size="13" text-anchor="middle">转人工处理</text>
  <text x="1000" y="480" fill="#8b949e" font-size="12" text-anchor="middle">需可审计高风险场景</text>

  <!-- 级联回路：二次校验回到概率输出左侧 -->
  <path d="M 520 445 L 470 445 L 470 330 L 748 330 L 748 300" fill="none" stroke="#d29922" stroke-width="1.3" stroke-dasharray="5 5"/>
  <path d="M 748 300 L 744 312 L 752 312 Z" fill="#d29922"/>

  <!-- 三张 info card -->
  <g>
    <rect x="60" y="560" width="346" height="100" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="80" y="590" fill="#58a6ff" font-size="13" font-weight="600">并行性</text>
    <text x="80" y="614" fill="#e6edf3" font-size="12">多子问题同查询并行回答</text>
    <text x="80" y="636" fill="#8b949e" font-size="12">高基数：Score 粗筛 + Choice 精选</text>
  </g>
  <g>
    <rect x="427" y="560" width="346" height="100" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="447" y="590" fill="#58a6ff" font-size="13" font-weight="600">RLCD 校准</text>
    <text x="447" y="614" fill="#e6edf3" font-size="12">概率对照真实结果优化</text>
    <text x="447" y="636" fill="#8b949e" font-size="12">群体统计性质，不保证单次正确</text>
  </g>
  <g>
    <rect x="794" y="560" width="346" height="100" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="814" y="590" fill="#58a6ff" font-size="13" font-weight="600">工程原则</text>
    <text x="814" y="614" fill="#e6edf3" font-size="12">AI 不拥有政策，只做感知判断</text>
    <text x="814" y="636" fill="#8b949e" font-size="12">阈值 / 权限 / 兜底留在代码中</text>
  </g>

  <text x="60" y="712" fill="#6e7681" font-size="12">实测参考：Every 777 个判断 &lt; 0.7s；硅星人中文客服 50 题每题 0.73–0.75s、总成本约 $0.002</text>
  <text x="60" y="736" fill="#6e7681" font-size="12">数据来源：知乎转述与 TypeSafe 官方博客，引用前请二次核对</text>
</svg>
</body></html>
