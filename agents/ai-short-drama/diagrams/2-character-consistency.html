<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>图2 · 角色一致性四代方案</title>
<style>
html,body{margin:0;padding:0;background:#0d1117}
svg{display:block;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
</style></head><body>
<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#0d1117"/>
  <text x="60" y="48" fill="#e6edf3" font-size="24" font-weight="700">图 2 · 头号难题角色一致性：四代方案演进与组合工艺</text>
  <text x="60" y="76" fill="#8b949e" font-size="13">一致性不是靠提示词写出来的，是靠流程与资产锁出来的；2026-10 汇总</text>

  <!-- why: three mechanisms -->
  <text x="60" y="112" fill="#e6edf3" font-size="14" font-weight="700">为什么"变脸"几乎必然：</text>
  <rect x="40" y="126" width="360" height="74" rx="9" fill="rgba(136,19,55,0.25)" stroke="#fb7185" stroke-width="1.3"/>
  <text x="58" y="152" fill="#fb7185" font-size="12.5" font-weight="700">无状态生成</text>
  <text x="58" y="176" fill="#c9d1d9" font-size="11">每镜独立运算，模型不记得上一镜角色；</text>
  <text x="58" y="194" fill="#8b949e" font-size="11">prompt 一字不差，结果仍不同</text>
  <rect x="420" y="126" width="360" height="74" rx="9" fill="rgba(136,19,55,0.25)" stroke="#fb7185" stroke-width="1.3"/>
  <text x="438" y="152" fill="#fb7185" font-size="12.5" font-weight="700">潜空间采样随机性</text>
  <text x="438" y="176" fill="#c9d1d9" font-size="11">扩散去噪从随机噪声起步，五官特征抖动；</text>
  <text x="438" y="194" fill="#8b949e" font-size="11">跨镜连起来就是"换人"</text>
  <rect x="800" y="126" width="360" height="74" rx="9" fill="rgba(136,19,55,0.25)" stroke="#fb7185" stroke-width="1.3"/>
  <text x="818" y="152" fill="#fb7185" font-size="12.5" font-weight="700">文字 ≠ 具体身份</text>
  <text x="818" y="176" fill="#c9d1d9" font-size="11">"短发鹅蛋脸"是语义标签，指向一类人</text>
  <text x="818" y="194" fill="#8b949e" font-size="11">而非某一个具体的人</text>

  <!-- generation arrow -->
  <line x1="60" y1="240" x2="1140" y2="240" stroke="#30363d" stroke-width="2"/>
  <path d="M1140,240 l-12,-6 l0,12 z" fill="#30363d"/>
  <text x="60" y="232" fill="#8b949e" font-size="11">成本/门槛 →</text>
  <text x="1140" y="232" fill="#8b949e" font-size="11" text-anchor="end">一致性 →</text>

  <!-- four generations -->
  <g>
    <rect x="40" y="266" width="266" height="300" rx="10" fill="#161b22" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="40" y="266" width="266" height="40" rx="10" fill="#94a3b8" opacity="0.14"/>
    <text x="173" y="292" fill="#cbd5e1" font-size="14" font-weight="700" text-anchor="middle">第一代 · 文字锁定</text>
    <text x="58" y="332" fill="#c9d1d9" font-size="11.5">· 固定完整外观段：年龄/脸型/</text>
    <text x="58" y="352" fill="#c9d1d9" font-size="11.5">  五官/发型/服装/配饰/气质</text>
    <text x="58" y="376" fill="#c9d1d9" font-size="11.5">· 逐字复制进每个镜头 prompt</text>
    <text x="58" y="400" fill="#c9d1d9" font-size="11.5">· 身份固定区 + 镜头可变区</text>
    <line x1="58" y1="424" x2="288" y2="424" stroke="#30363d"/>
    <text x="58" y="452" fill="#fbbf24" font-size="12" font-weight="700">一致性 50–70%</text>
    <text x="58" y="484" fill="#3fb950" font-size="11">零成本 · 所有方案的底座</text>
    <text x="58" y="528" fill="#8b949e" font-size="10.5">问题：换角度/光线即漂移</text>

    <rect x="322" y="266" width="266" height="300" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <rect x="322" y="266" width="266" height="40" rx="10" fill="#58a6ff" opacity="0.14"/>
    <text x="455" y="292" fill="#58a6ff" font-size="14" font-weight="700" text-anchor="middle">第二代 · 参考图锚定</text>
    <text x="340" y="332" fill="#c9d1d9" font-size="11.5">· 定妆照：正视/3-4侧/纯侧/</text>
    <text x="340" y="352" fill="#c9d1d9" font-size="11.5">  全身 + 表情包（三视图）</text>
    <text x="340" y="376" fill="#c9d1d9" font-size="11.5">· I2V 首帧 / cref / IP-Adapter</text>
    <text x="340" y="400" fill="#c9d1d9" font-size="11.5">· InstantID / PuLID 专做人脸</text>
    <line x1="340" y1="424" x2="570" y2="424" stroke="#30363d"/>
    <text x="340" y="452" fill="#fbbf24" font-size="12" font-weight="700">一致性 80–90%</text>
    <text x="340" y="484" fill="#3fb950" font-size="11">免训练 · 短剧主力工艺</text>
    <text x="340" y="528" fill="#8b949e" font-size="10.5">问题：极端特写角度仍会偏</text>

    <rect x="604" y="266" width="266" height="300" rx="10" fill="#161b22" stroke="#34d399" stroke-width="1.5"/>
    <rect x="604" y="266" width="266" height="40" rx="10" fill="#34d399" opacity="0.14"/>
    <text x="737" y="292" fill="#34d399" font-size="14" font-weight="700" text-anchor="middle">第三代 · 首尾帧链</text>
    <text x="622" y="332" fill="#c9d1d9" font-size="11.5">· 上镜尾帧作下镜首帧</text>
    <text x="622" y="352" fill="#c9d1d9" font-size="11.5">· 帧间插值/过渡生成"焊接"</text>
    <text x="622" y="376" fill="#c9d1d9" font-size="11.5">· 或从成片截帧反向锚定</text>
    <text x="622" y="400" fill="#c9d1d9" font-size="11.5">· 相邻镜头近乎连续</text>
    <line x1="622" y1="424" x2="852" y2="424" stroke="#30363d"/>
    <text x="622" y="452" fill="#fbbf24" font-size="12" font-weight="700">一致性高</text>
    <text x="622" y="484" fill="#3fb950" font-size="11">适合关键转场/回忆段</text>
    <text x="622" y="528" fill="#8b949e" font-size="10.5">问题：工艺繁琐、不适合全片</text>

    <rect x="886" y="266" width="274" height="300" rx="10" fill="#161b22" stroke="#a78bfa" stroke-width="1.5"/>
    <rect x="886" y="266" width="274" height="40" rx="10" fill="#a78bfa" opacity="0.14"/>
    <text x="1023" y="292" fill="#a78bfa" font-size="14" font-weight="700" text-anchor="middle">第四代 · 专属训练/内置</text>
    <text x="904" y="332" fill="#c9d1d9" font-size="11.5">· 角色 LoRA：15–30 张多角度</text>
    <text x="904" y="352" fill="#c9d1d9" font-size="11.5">  图，1500–3000 步，名做触发词</text>
    <text x="904" y="376" fill="#c9d1d9" font-size="11.5">· 平台内置"角色"功能/多参考图</text>
    <text x="904" y="400" fill="#c9d1d9" font-size="11.5">· 角色成为模型固有认知</text>
    <line x1="904" y1="424" x2="1142" y2="424" stroke="#30363d"/>
    <text x="904" y="452" fill="#fbbf24" font-size="12" font-weight="700">一致性可达 95%+</text>
    <text x="904" y="484" fill="#3fb950" font-size="11">适合长期量产同一 IP</text>
    <text x="904" y="528" fill="#8b949e" font-size="10.5">问题：LoRA 需训练并匹配版本</text>
  </g>

  <!-- combos -->
  <rect x="40" y="596" width="1120" height="62" rx="10" fill="rgba(251,146,60,0.12)" stroke="#fb923c" stroke-width="1.4"/>
  <text x="60" y="622" fill="#fb923c" font-size="13" font-weight="700">组合技（实战推荐）</text>
  <text x="60" y="646" fill="#c9d1d9" font-size="11.5">身份文字锁定（地基） + 定妆参考图 I2V（主力） + 关键转场首尾帧链 + 主角 LoRA（量产）；cref 锁脸 + LoRA 锁细节</text>

  <!-- bottom cards -->
  <g>
    <rect x="40" y="684" width="360" height="86" rx="9" fill="#161b22" stroke="#30363d"/>
    <text x="58" y="710" fill="#34d399" font-size="12.5" font-weight="700">2026 新进展</text>
    <text x="58" y="734" fill="#c9d1d9" font-size="11">Custom Forcing 免训练：参考图进入</text>
    <text x="58" y="754" fill="#8b949e" font-size="11">长期记忆，2 分钟不换脸、仅慢 11%</text>
    <rect x="420" y="684" width="360" height="86" rx="9" fill="#161b22" stroke="#30363d"/>
    <text x="438" y="710" fill="#fbbf24" font-size="12.5" font-weight="700">纪律</text>
    <text x="438" y="734" fill="#c9d1d9" font-size="11">全程只用同一组定妆图、不重复手写</text>
    <text x="438" y="754" fill="#8b949e" font-size="11">外貌；同场景共享首帧</text>
    <rect x="800" y="684" width="360" height="86" rx="9" fill="#161b22" stroke="#30363d"/>
    <text x="818" y="710" fill="#fb7185" font-size="12.5" font-weight="700">锁不住的边界</text>
    <text x="818" y="734" fill="#c9d1d9" font-size="11">资产锁"长什么样"，锁不住"怎么动"：</text>
    <text x="818" y="754" fill="#8b949e" font-size="11">手部/打斗/多人亲密交互仍需人工</text>
  </g>
</svg>
</body></html>
