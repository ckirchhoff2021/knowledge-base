<style>

<svg viewBox="0 0 1200 820" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="820" fill="#0d1117"/>

  <text x="60" y="74" fill="#8b949e" font-size="13">把"人点七个工具"变为"导演 Agent 编排一条有状态流水线"；学术系统 + 商业平台同构</text>

  <text x="600" y="121" fill="#e6edf3" font-size="14" font-weight="700" text-anchor="middle">用户输入：一句话创意 / 小说原文 / 剧本（≤1 万字）</text>
  <text x="600" y="141" fill="#8b949e" font-size="11" text-anchor="middle">题材 · 风格 · 集数 · 比例 · 角色约束</text>

  <text x="600" y="240" fill="#c9d1d9" font-size="11.5" text-anchor="middle">CoT 规划：故事线→场景→镜头→资产→生成→合成</text>
  <text x="600" y="258" fill="#8b949e" font-size="11" text-anchor="middle">任务拆解为 DAG · 调度重试 · 质检选点</text>
  <path d="M600,152 L600,186" stroke="#34d399" stroke-width="1.8"/>

  <text x="985" y="256" fill="#8b949e" font-size="11" text-anchor="middle">原子落盘 · 断点续跑 · 单镜重做</text>
  <path d="M780,226 L830,226" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="5 4"/>

  <path d="M420,226 L370,226" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="5 4"/>

    <rect x="970" y="306" width="172" height="72" rx="10" fill="rgba(6,78,59,0.3)" stroke="#34d399" stroke-width="1.4"/>
    <text x="1056" y="334" fill="#34d399" font-size="12.5" font-weight="700">剪辑 Agent</text>
    <text x="1056" y="356" fill="#8b949e" font-size="10.5">拼接/字幕/成片</text>
  </g>
  <g stroke="#444c56" stroke-width="1.3">
    <path d="M520,266 L126,306"/><path d="M545,266 L312,306"/>
    <path d="M575,266 L498,306"/><path d="M625,266 L684,306"/>
    <path d="M660,266 L870,306"/><path d="M690,266 L1056,306"/>

  <text x="60" y="420" fill="#e6edf3" font-size="14" font-weight="700">工具模型层（Agent 通过 API / MCP 调用）：</text>
  <rect x="40" y="434" width="1120" height="106" rx="12" fill="#161b22" stroke="#30363d"/>

    <rect x="58"  y="452" width="160" height="34" rx="8" fill="rgba(6,78,59,0.35)" stroke="#34d399"/>

    <rect x="232" y="452" width="160" height="34" rx="8" fill="rgba(120,53,15,0.25)" stroke="#fbbf24"/>

    <rect x="406" y="452" width="160" height="34" rx="8" fill="rgba(6,78,59,0.35)" stroke="#34d399"/>

    <rect x="580" y="452" width="160" height="34" rx="8" fill="rgba(76,29,149,0.3)" stroke="#a78bfa"/>

    <rect x="754" y="452" width="160" height="34" rx="8" fill="rgba(76,29,149,0.3)" stroke="#a78bfa"/>

    <rect x="928" y="452" width="214" height="34" rx="8" fill="rgba(30,41,59,0.6)" stroke="#94a3b8"/>

  <g font-size="10.5" fill="#8b949e" text-anchor="middle">

    <text x="312" y="512">即梦·Flux·Midjourney</text>
    <text x="486" y="512">可灵·Seedance·Veo·Wan</text>
    <text x="660" y="512">CosyVoice·ElevenLabs</text>
    <text x="834" y="512">MMAudio·Suno</text>
    <text x="1035" y="512">剪映·FFmpeg·Video-as-Code</text>
  </g>
  <g stroke="#444c56" stroke-width="1.2" stroke-dasharray="4 3">
    <line x1="126" y1="378" x2="138" y2="452"/><line x1="312" y1="378" x2="312" y2="452"/>
    <line x1="498" y1="378" x2="486" y2="452"/><line x1="684" y1="378" x2="486" y2="452"/>
    <line x1="870" y1="378" x2="660" y2="452"/><line x1="1056" y1="378" x2="1035" y2="452"/>
  </g>

  <!-- output -->
  <rect x="380" y="560" width="440" height="48" rx="10" fill="rgba(6,78,59,0.3)" stroke="#34d399" stroke-width="1.5"/>
  <text x="600" y="590" fill="#34d399" font-size="13.5" font-weight="700" text-anchor="middle">成片 → 发行：抖音 / 红果 / TikTok / 海外短剧 APP</text>

    <rect x="40" y="636" width="360" height="150" rx="10" fill="#161b22" stroke="#30363d"/>

    <text x="58" y="690" fill="#c9d1d9" font-size="11">MovieDreamer 2407.16655 分层 AR+扩散</text>

    <text x="818" y="712" fill="#c9d1d9" font-size="11">CosyVoice + MMAudio</text>
