<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>图2 · RL算法演进谱系</title>
<style>
html,body{margin:0;padding:0;background:#0d1117}
svg{display:block;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
</style></head><body>
<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1200" height="900" fill="#0d1117"/>
  <text x="60" y="52" fill="#e6edf3" font-size="24" font-weight="700">图 2 · 大模型 RL 算法演进谱系</text>
  <text x="60" y="80" fill="#8b949e" font-size="13">共同祖先是「策略梯度 + baseline」：一条路用学习的 Critic（PPO），一条路用采样统计当基线（Critic-Free），后者汇入 GRPO 并继续改良</text>

  <!-- 祖先 -->
  <rect x="440" y="110" width="320" height="60" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="600" y="136" fill="#e6edf3" font-size="14" font-weight="700" text-anchor="middle">策略梯度定理（Policy Gradient）</text>
  <text x="600" y="156" fill="#8b949e" font-size="11" text-anchor="middle">∇J = E[ R · ∇log π ]，需 baseline 降方差</text>

  <!-- 分支标题 -->
  <text x="280" y="212" fill="#bc8cff" font-size="13" font-weight="700" text-anchor="middle">Actor-Critic 路线</text>
  <text x="860" y="212" fill="#3fb950" font-size="13" font-weight="700" text-anchor="middle">Critic-Free 路线</text>

  <!-- PPO 链 -->
  <rect x="150" y="230" width="260" height="60" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="280" y="256" fill="#e6edf3" font-size="13" text-anchor="middle">REINFORCE（蒙特卡洛）</text>
  <text x="280" y="276" fill="#8b949e" font-size="11" text-anchor="middle">方差大，后引入价值函数</text>

  <rect x="150" y="330" width="260" height="76" rx="8" fill="#161b22" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="280" y="358" fill="#bc8cff" font-size="14" font-weight="700" text-anchor="middle">PPO（2017）</text>
  <text x="280" y="380" fill="#8b949e" font-size="11" text-anchor="middle">clip 信任域 + GAE + Critic</text>
  <text x="280" y="398" fill="#8b949e" font-size="11" text-anchor="middle">InstructGPT RLHF 标准</text>

  <!-- Critic-Free 链 -->
  <rect x="700" y="230" width="320" height="60" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="860" y="252" fill="#e6edf3" font-size="12" text-anchor="middle">RLOO（2024）：留一均值基线</text>
  <text x="860" y="274" fill="#8b949e" font-size="11" text-anchor="middle">Back to Basics：简单方法不输 PPO</text>

  <rect x="700" y="310" width="320" height="50" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="860" y="340" fill="#e6edf3" font-size="12" text-anchor="middle">ReMax（2023）：贪心回答奖励当基线</text>

  <rect x="700" y="380" width="320" height="60" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="860" y="404" fill="#e6edf3" font-size="12" text-anchor="middle">REINFORCE++（2025）</text>
  <text x="860" y="426" fill="#8b949e" font-size="11" text-anchor="middle">PPO 技巧 + 全局归一化，无 Critic</text>

  <!-- GRPO 汇合 -->
  <rect x="380" y="500" width="440" height="80" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="600" y="532" fill="#3fb950" font-size="17" font-weight="700" text-anchor="middle">GRPO（2024，DeepSeekMath）</text>
  <text x="600" y="558" fill="#8b949e" font-size="12" text-anchor="middle">每 prompt 采样 G 条 · 组内均值/标准化优势 · KL 入损失 · 无 Critic</text>

  <!-- 变体层 -->
  <rect x="60" y="640" width="330" height="110" rx="10" fill="#161b22" stroke="#f85149"/>
  <text x="225" y="670" fill="#f85149" font-size="14" font-weight="700" text-anchor="middle">DAPO（字节，2025）</text>
  <text x="80" y="696" fill="#8b949e" font-size="11">clip-higher · 动态采样</text>
  <text x="80" y="716" fill="#8b949e" font-size="11">token-level loss · 超长软奖励</text>
  <text x="80" y="736" fill="#d29922" font-size="11">32B 基座，AIME24 50 分</text>

  <rect x="435" y="640" width="330" height="110" rx="10" fill="#161b22" stroke="#f85149"/>
  <text x="600" y="670" fill="#f85149" font-size="14" font-weight="700" text-anchor="middle">Dr.GRPO（2025）</text>
  <text x="455" y="696" fill="#8b949e" font-size="11">发现 GRPO 长度膨胀偏置</text>
  <text x="455" y="716" fill="#8b949e" font-size="11">去除偏置的无精简配方</text>
  <text x="455" y="736" fill="#d29922" font-size="11">7B，AIME24 43.3%</text>

  <rect x="810" y="640" width="330" height="110" rx="10" fill="#161b22" stroke="#f85149"/>
  <text x="975" y="670" fill="#f85149" font-size="14" font-weight="700" text-anchor="middle">GSPO（阿里 Qwen，2025）</text>
  <text x="830" y="696" fill="#8b949e" font-size="11">序列级 ratio / clip / 优化</text>
  <text x="830" y="716" fill="#8b949e" font-size="11">稳定 MoE 的 RL 训练</text>
  <text x="830" y="736" fill="#d29922" font-size="11">已用于 Qwen3</text>

  <!-- 连线 -->
  <path d="M520 172 L300 205 L300 228" fill="none" stroke="#8b949e" stroke-width="1.5"/>
  <path d="M680 172 L860 205 L860 228" fill="none" stroke="#8b949e" stroke-width="1.5"/>
  <line x1="280" y1="292" x2="280" y2="328" stroke="#8b949e" stroke-width="1.5"/>
  <line x1="860" y1="292" x2="860" y2="308" stroke="#8b949e" stroke-width="1.5"/>
  <line x1="860" y1="362" x2="860" y2="378" stroke="#8b949e" stroke-width="1.5"/>
  <path d="M280 408 L280 460 L450 500" fill="none" stroke="#bc8cff" stroke-width="1.3" stroke-dasharray="5 4"/>
  <path d="M860 442 L860 460 L750 500" fill="none" stroke="#3fb950" stroke-width="1.5"/>
  <path d="M500 582 L240 638" stroke="#8b949e" stroke-width="1.3"/>
  <line x1="600" y1="582" x2="600" y2="638" stroke="#8b949e" stroke-width="1.3"/>
  <path d="M700 582 L960 638" stroke="#8b949e" stroke-width="1.3"/>

  <!-- info cards -->
  <g>
    <rect x="60" y="800" width="346" height="76" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="80" y="826" fill="#58a6ff" font-size="13" font-weight="600">分野核心</text>
    <text x="80" y="850" fill="#e6edf3" font-size="12">baseline 从哪来：学 or 采样</text>
  </g>
  <g>
    <rect x="427" y="800" width="346" height="76" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="447" y="826" fill="#58a6ff" font-size="13" font-weight="600">演进方向</text>
    <text x="447" y="850" fill="#e6edf3" font-size="12">去 Critic · 更稳 · 更少显存</text>
  </g>
  <g>
    <rect x="794" y="800" width="346" height="76" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="814" y="826" fill="#58a6ff" font-size="13" font-weight="600">2025 焦点</text>
    <text x="814" y="850" fill="#e6edf3" font-size="12">修复 GRPO 四类病理</text>
  </g>
</svg>
</body></html>
