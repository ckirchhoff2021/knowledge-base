<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>图4 · 混合推理形态</title><style>html,body{margin:0;background:#0d1117}svg{display:block;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}</style></head><body><svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg"><rect width="1200" height="700" fill="#0d1117"/><text x="50" y="40" font-size="21" fill="#e6edf3" font-weight="700" text-anchor="start">图 4 · 混合推理（Hybrid Reasoning）：文本模式 ⇄ 潜模式 在一次生成内动态切换</text><text x="50" y="65" font-size="12.5" fill="#8b949e" font-weight="normal" text-anchor="start">潜空间快速思考；工具调用 / 观测 / 最终答案与审计节点回到文本；KV 工作记忆跨轮无损保持</text><rect x="40" y="100" width="1120" height="150" rx="14" fill="#161b22" stroke="#8b949e" stroke-width="1.4"/><text x="60" y="128" font-size="13" fill="#8b949e" font-weight="700" text-anchor="start">一条共享 KV 轨迹（工作记忆）：文本段与潜状态共存、跨轮复用</text><rect x="70" y="150" width="150" height="70" rx="9" fill="#0d2238" stroke="#58a6ff" stroke-width="1.5"/><text x="145.0" y="190" font-size="12" fill="#e6edf3" font-weight="700" text-anchor="middle">文本：用户问题</text><rect x="235" y="150" width="120" height="70" rx="9" fill="#241b33" stroke="#bc8cff" stroke-width="1.5"/><text x="295.0" y="190" font-size="13" fill="#bc8cff" font-weight="700" text-anchor="middle">潜 c₁</text><text x="295.0" y="208" font-size="9.5" fill="#8b949e" font-weight="normal" text-anchor="middle">隐状态直接回灌</text><rect x="370" y="150" width="120" height="70" rx="9" fill="#241b33" stroke="#bc8cff" stroke-width="1.5"/><text x="430.0" y="190" font-size="13" fill="#bc8cff" font-weight="700" text-anchor="middle">潜 c₂</text><text x="430.0" y="208" font-size="9.5" fill="#8b949e" font-weight="normal" text-anchor="middle">隐状态直接回灌</text><rect x="505" y="150" width="150" height="70" rx="9" fill="#0d2d1c" stroke="#3fb950" stroke-width="1.5"/><text x="580.0" y="190" font-size="12" fill="#e6edf3" font-weight="700" text-anchor="middle">文本：工具调用</text><rect x="670" y="150" width="150" height="70" rx="9" fill="#3d2410" stroke="#d29922" stroke-width="1.5"/><text x="745.0" y="190" font-size="12" fill="#e6edf3" font-weight="700" text-anchor="middle">文本：观测结果</text><rect x="835" y="150" width="120" height="70" rx="9" fill="#241b33" stroke="#bc8cff" stroke-width="1.5"/><text x="895.0" y="190" font-size="13" fill="#bc8cff" font-weight="700" text-anchor="middle">潜 c₃</text><text x="895.0" y="208" font-size="9.5" fill="#8b949e" font-weight="normal" text-anchor="middle">隐状态直接回灌</text><rect x="970" y="150" width="170" height="70" rx="9" fill="#0d2238" stroke="#58a6ff" stroke-width="1.5"/><text x="1055.0" y="190" font-size="12" fill="#e6edf3" font-weight="700" text-anchor="middle">文本：最终答案</text><line x1="220" y1="185" x2="233" y2="185" stroke="#8b949e" stroke-width="1.6"/><path d="M229,181 L235,185 L229,189 Z" fill="#8b949e"/><line x1="355" y1="185" x2="368" y2="185" stroke="#8b949e" stroke-width="1.6"/><path d="M364,181 L370,185 L364,189 Z" fill="#8b949e"/><line x1="490" y1="185" x2="503" y2="185" stroke="#8b949e" stroke-width="1.6"/><path d="M499,181 L505,185 L499,189 Z" fill="#8b949e"/><line x1="655" y1="185" x2="668" y2="185" stroke="#8b949e" stroke-width="1.6"/><path d="M664,181 L670,185 L664,189 Z" fill="#8b949e"/><line x1="820" y1="185" x2="833" y2="185" stroke="#8b949e" stroke-width="1.6"/><path d="M829,181 L835,185 L829,189 Z" fill="#8b949e"/><line x1="955" y1="185" x2="968" y2="185" stroke="#8b949e" stroke-width="1.6"/><path d="M964,181 L970,185 L964,189 Z" fill="#8b949e"/><text x="300" y="268" font-size="10.5" fill="#bc8cff" font-weight="700" text-anchor="middle">&lt;latent&gt; 进入</text><text x="585" y="268" font-size="10.5" fill="#3fb950" font-weight="700" text-anchor="middle">&lt;/latent&gt; 退出（回文本发工具）</text><text x="900" y="268" font-size="10.5" fill="#bc8cff" font-weight="700" text-anchor="middle">&lt;latent&gt; 再进入</text><rect x="40" y="290" width="348" height="262" rx="12" fill="#161b22" stroke="#bc8cff" stroke-width="1.4"/><rect x="40" y="290" width="348" height="46" rx="12" fill="#241b33" stroke="#bc8cff" stroke-width="1.3"/><text x="56" y="319" font-size="13" fill="#bc8cff" font-weight="700" text-anchor="start">放进潜空间（隐状态循环）</text><text x="58" y="368" font-size="11" fill="#e6edf3" font-weight="normal" text-anchor="start">• 内部规划 / 多分支搜索</text><text x="58" y="404" font-size="11" fill="#e6edf3" font-weight="normal" text-anchor="start">• 连续向量表达叠加态（BFS）</text><text x="58" y="440" font-size="11" fill="#e6edf3" font-weight="normal" text-anchor="start">• 无逐 token 自回归延迟税</text><text x="58" y="476" font-size="11" fill="#e6edf3" font-weight="normal" text-anchor="start">• 思维默认不可读 → 防注入/泄密</text><text x="58" y="512" font-size="11" fill="#e6edf3" font-weight="normal" text-anchor="start">• 代表：Coconut · CODI · SWITCH</text><rect x="426" y="290" width="348" height="262" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="1.4"/><rect x="426" y="290" width="348" height="46" rx="12" fill="#0d2d1c" stroke="#3fb950" stroke-width="1.3"/><text x="442" y="319" font-size="13" fill="#3fb950" font-weight="700" text-anchor="start">保留为文本 token</text><text x="444" y="368" font-size="11" fill="#e6edf3" font-weight="normal" text-anchor="start">• 工具调用须结构化、可校验</text><text x="444" y="404" font-size="11" fill="#e6edf3" font-weight="normal" text-anchor="start">• 工具观测需写入上下文</text><text x="444" y="440" font-size="11" fill="#e6edf3" font-weight="normal" text-anchor="start">• 最终答案要人类可读</text><text x="444" y="476" font-size="11" fill="#e6edf3" font-weight="normal" text-anchor="start">• 关键决策需可验证 / 可追责</text><text x="444" y="512" font-size="11" fill="#e6edf3" font-weight="normal" text-anchor="start">• 代表：TAC-CoT（文本只留工具+答案）</text><rect x="812" y="290" width="348" height="262" rx="12" fill="#161b22" stroke="#d29922" stroke-width="1.4"/><rect x="812" y="290" width="348" height="46" rx="12" fill="#3d2410" stroke="#d29922" stroke-width="1.3"/><text x="828" y="319" font-size="13" fill="#d29922" font-weight="700" text-anchor="start">审计与安全挂钩</text><text x="830" y="368" font-size="11" fill="#e6edf3" font-weight="normal" text-anchor="start">• 边界 token 提供 RL 良定义性</text><text x="830" y="404" font-size="11" fill="#e6edf3" font-weight="normal" text-anchor="start">• 潜段可按需导出（HybridAgent）</text><text x="830" y="440" font-size="11" fill="#e6edf3" font-weight="normal" text-anchor="start">• 合规/高风险节点强制显式化</text><text x="830" y="476" font-size="11" fill="#e6edf3" font-weight="normal" text-anchor="start">• 删链反事实 + do 干预验因果</text><text x="830" y="512" font-size="11" fill="#e6edf3" font-weight="normal" text-anchor="start">• 避免「潜链只是事后装饰」</text><rect x="40" y="575" width="1120" height="90" rx="12" fill="#241b33" stroke="#bc8cff" stroke-width="1.4"/><text x="60" y="607" font-size="11.5" fill="#bc8cff" font-weight="700" text-anchor="start">为什么混合是均衡解：纯潜式在精确执行/长程维持/可验证上有短板；纯文本式延迟与成本沉重；Agent 工作流天然「内部规划 ⇄ 外部交互」分段</text><text x="60" y="637" font-size="11.5" fill="#e6edf3" font-weight="normal" text-anchor="start">预期：reasoning effort 旋钮将从「想多长」升级为「多少放潜空间、多少说出来」——在连续向量里搜索，在离散语言里验证、行动、负责</text></svg></body></html>
