  <text x="60" y="48" fill="#e6edf3" font-size="23" font-weight="700">图 4 · 前沿系统解剖：Block-AR 推理流水线、SD·RL 训练与速度对比</text>
  <text x="60" y="75" fill="#8b949e" font-size="12.5">参照 DiffusionGemma（Google DeepMind，arXiv:2608.00146）；速度数据取自技术报告 Table 3，H100 FP8 batch=1（Mercury 为其 H100 报告值）</text>
  <defs><marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#8b949e"/></marker></defs>

  <text x="60" y="112" fill="#58a6ff" font-size="15.5" font-weight="700">A. 推理：因果编码 + 256-token 画布双向去噪 + KV 回写（因果编码器 / 双向解码器的架构反转）</text>
  <g font-size="12.5" text-anchor="middle">
    <rect x="55" y="128" width="140" height="64" rx="8" fill="#161b22" stroke="#58a6ff"/><text x="125" y="155" fill="#e6edf3">Prompt/历史</text><text x="125" y="175" fill="#8b949e">含多模态嵌入</text>
    <rect x="235" y="128" width="160" height="64" rx="8" fill="#161b22" stroke="#bc8cff"/><text x="315" y="155" fill="#e6edf3">因果编码器</text><text x="315" y="175" fill="#bc8cff">causal attn→KV</text>
    <rect x="435" y="128" width="130" height="64" rx="8" fill="#0a0e14" stroke="#d29922"/><text x="500" y="155" fill="#e6edf3">KV Cache H</text><text x="500" y="175" fill="#d29922">只追加不重算</text>
    <rect x="605" y="120" width="230" height="80" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/><text x="720" y="145" fill="#3fb950" font-weight="700">双向去噪解码器</text><text x="720" y="165" fill="#8b949e">画布双向attn × 对H cross-attn</text><text x="720" y="184" fill="#8b949e">self-conditioning zₜ · MoE θ</text>
    <rect x="875" y="120" width="270" height="80" rx="8" fill="#161b22" stroke="#39c5cf"/><text x="1010" y="144" fill="#e6edf3">画布 xₜ（256 token）</text><text x="1010" y="164" fill="#39c5cf">均匀噪声 → 平均12步精炼</text><text x="1010" y="183" fill="#8b949e">熵排序解蔽 · τ 0.8→0.4 · 自适应停止</text>
  </g>
  <g stroke="#8b949e">
    <line x1="195" y1="160" x2="233" y2="160" marker-end="url(#m)"/><line x1="395" y1="160" x2="433" y2="160" marker-end="url(#m)"/><line x1="565" y1="160" x2="603" y2="160" marker-end="url(#m)"/><line x1="835" y1="160" x2="873" y2="160" marker-end="url(#m)"/>
  </g>
  <path d="M1010 200 L1010 226 L720 226 L720 202" fill="none" stroke="#3fb950" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="880" y="220" fill="#3fb950" font-size="11" text-anchor="middle">循环至 t=0，或熵≤0.005 且连续两步预测一致</text>
  <path d="M720 238 L720 262 L500 262 L500 194" fill="none" stroke="#d29922" stroke-width="1.4"/>
  <text x="620" y="256" fill="#d29922" font-size="11" text-anchor="middle">干净块回写 H，开始下一块（block-AR）</text>

  <text x="60" y="298" fill="#bc8cff" font-size="15.5" font-weight="700">B. 训练：AR 权重热启动 → SFT 双向去噪 → SD·RL 联合「提质量+压步数」（token 预算 &lt; 原 AR 模型 10%）</text>
  <g font-size="12" text-anchor="middle">
    <rect x="55" y="315" width="250" height="78" rx="8" fill="#161b22" stroke="#8b949e"/><text x="180" y="342" fill="#e6edf3" font-weight="700">Gemma 4 26B-A4B MoE</text><text x="180" y="363" fill="#8b949e">25.2B总参/3.85B激活</text><text x="180" y="382" fill="#8b949e">热启动，继承多模态/长文</text>
    <rect x="345" y="315" width="260" height="78" rx="8" fill="#161b22" stroke="#58a6ff"/><text x="475" y="342" fill="#58a6ff" font-weight="700">阶段一 SFT</text><text x="475" y="363" fill="#8b949e">块对角掩码：干净上下文+256噪声块</text><text x="475" y="382" fill="#8b949e">去噪 CE；延长 SFT 长出 thinking</text>
    <rect x="645" y="315" width="290" height="78" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/><text x="790" y="342" fill="#3fb950" font-weight="700">阶段二 SD·RL（在线）</text><text x="790" y="363" fill="#8b949e">在线教师出高质量去噪轨迹</text><text x="790" y="382" fill="#8b949e">奖励最大化 × 采样器蒸馏一次更新</text>
    <rect x="975" y="315" width="170" height="78" rx="8" fill="#0a0e14" stroke="#d29922"/><text x="1060" y="340" fill="#d29922" font-weight="700">隐式课程</text><text x="1060" y="361" fill="#8b949e">熵降→提前停止</text><text x="1060" y="380" fill="#8b949e">→自动转向短轨迹</text>
  </g>
  <g stroke="#8b949e"><line x1="305" y1="354" x2="343" y2="354" marker-end="url(#m)"/><line x1="605" y1="354" x2="643" y2="354" marker-end="url(#m)"/><line x1="935" y1="354" x2="973" y2="354" marker-end="url(#m)"/></g>
  <rect x="55" y="408" width="1090" height="50" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="72" y="430" fill="#3fb950" font-size="11.5">效果：TPF 5→~20（约 4×）；平均 12 步成块；输出近 2× 缩短（更直接，与 AR-RL 越训越长相反）；扩散微调总 token 预算 &lt; 原 AR 训练量 10%</text>
  <text x="72" y="450" fill="#f85149" font-size="11.5">代价：绝对分数低于同源 AR（AIME 69.1 vs 88.3）；少步 regime 偶发口吃/重复环；&gt;32 路并发吞吐反被 AR 超过</text>

  <text x="60" y="498" fill="#d29922" font-size="15.5" font-weight="700">C. 单请求生成速度对比（tokens/sec，越长越快；H100 口径）</text>
  <g font-size="12">
    <text x="300" y="530" fill="#8b949e" text-anchor="end">Gemma 4 26B-A4B（AR）</text>
    <rect x="310" y="516" width="102" height="20" fill="#f85149"/><text x="420" y="531" fill="#e6edf3">204</text>
    <text x="300" y="562" fill="#8b949e" text-anchor="end">Gemma 4 + MTP 投机解码</text>
    <rect x="310" y="548" width="152" height="20" fill="#d29922"/><text x="470" y="563" fill="#e6edf3">303</text>
    <text x="300" y="594" fill="#8b949e" text-anchor="end">LLaDA2.0-Flash 100B（8×B200）</text>
    <rect x="310" y="580" width="188" height="20" fill="#8b949e"/><text x="506" y="595" fill="#e6edf3">375</text>
    <text x="300" y="626" fill="#8b949e" text-anchor="end">Mercury 2（OpenRouter 实测高推理档）</text>
    <rect x="310" y="612" width="300" height="20" fill="#bc8cff"/><text x="618" y="627" fill="#e6edf3">600</text>
    <text x="300" y="658" fill="#8b949e" text-anchor="end">Mercury Coder Small（H100 报告值）</text>
    <rect x="310" y="644" width="369" height="20" fill="#58a6ff"/><text x="687" y="659" fill="#e6edf3">737</text>
    <text x="300" y="690" fill="#8b949e" text-anchor="end">Mercury Coder Mini（H100 报告值）</text>
    <rect x="310" y="676" width="555" height="20" fill="#58a6ff"/><text x="873" y="691" fill="#e6edf3">1,109</text>
    <text x="300" y="722" fill="#3fb950" text-anchor="end" font-weight="700">DiffusionGemma 26B-A4B（H100 FP8）</text>
    <rect x="310" y="708" width="740" height="20" fill="#3fb950"/><text x="1058" y="723" fill="#0d1117" font-weight="700">1,479</text>
  </g>
  <line x1="310" y1="745" x2="1050" y2="745" stroke="#30363d"/>
  <text x="310" y="765" fill="#484f58" font-size="10.5">0</text><text x="675" y="765" fill="#484f58" font-size="10.5">750</text><text x="1040" y="765" fill="#484f58" font-size="10.5">1500 TPS</text>
  <text x="60" y="800" fill="#8b949e" font-size="12">关键洞察：扩散路线在<tspan fill="#3fb950">单请求/低并发</tspan>场景把执行从内存带宽受限移向计算受限，用更少的权重/KV 搬运换更多 FLOPs；</text>
  <text x="60" y="824" fill="#8b949e" font-size="12">但在约 32 路并发以上，批处理摊薄了 AR 的内存瓶颈，扩散每 token 更高的 FLOPs 反而使其总吞吐劣势显现——<tspan fill="#d29922">速度优势是场景相关的，不是无条件碾压</tspan>。</text>
