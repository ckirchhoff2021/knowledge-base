<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>图1 · 自回归 vs 扩散语言模型</title>
<style>
html,body{margin:0;padding:0;background:#0d1117}
svg{display:block;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
</style></head><body>
<svg viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1200" height="760" fill="#0d1117"/>
  <text x="60" y="52" fill="#e6edf3" font-size="24" font-weight="700">图 1 · 两种生成范式：自回归（AR）串行解码 vs 扩散（DLM）并行去噪</text>
  <text x="60" y="80" fill="#8b949e" font-size="13">同样生成 8 个 token：AR 需要 8 次相互依赖的前向传播；扩散模型在整块画布上迭代精炼，每次前向并行更新全部位置</text>

  <!-- ===== AR 侧 ===== -->
  <rect x="60" y="110" width="520" height="470" rx="12" fill="none" stroke="#f85149" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="320" y="142" fill="#f85149" font-size="17" font-weight="700" text-anchor="middle">自回归模型 p(x) = ∏ p(xᵢ | x&lt;ᵢ)</text>

  <!-- 时间步行 -->
  <text x="90" y="180" fill="#8b949e" font-size="12">时间步 t（每步一次完整前向传播）</text>
  <!-- 8 个串行格子 -->
  <g font-size="13" text-anchor="middle">
    <rect x="90" y="200" width="52" height="44" rx="6" fill="#161b22" stroke="#58a6ff"/><text x="116" y="228" fill="#e6edf3">The</text>
    <rect x="152" y="200" width="52" height="44" rx="6" fill="#161b22" stroke="#58a6ff"/><text x="178" y="228" fill="#e6edf3">cat</text>
    <rect x="214" y="200" width="52" height="44" rx="6" fill="#161b22" stroke="#58a6ff"/><text x="240" y="228" fill="#e6edf3">sat</text>
    <rect x="276" y="200" width="52" height="44" rx="6" fill="#161b22" stroke="#58a6ff"/><text x="302" y="228" fill="#e6edf3">on</text>
    <rect x="338" y="200" width="52" height="44" rx="6" fill="#161b22" stroke="#30363d"/><text x="364" y="228" fill="#484f58">the</text>
    <rect x="400" y="200" width="52" height="44" rx="6" fill="#161b22" stroke="#30363d"/><text x="426" y="228" fill="#484f58">warm</text>
    <rect x="462" y="200" width="52" height="44" rx="6" fill="#161b22" stroke="#30363d"/><text x="488" y="228" fill="#484f58">mat</text>
    <rect x="524" y="200" width="30" height="44" rx="6" fill="#161b22" stroke="#30363d"/><text x="539" y="228" fill="#484f58">.</text>
  </g>
  <line x1="142" y1="222" x2="150" y2="222" stroke="#f85149" stroke-width="1.5"/>
  <line x1="204" y1="222" x2="212" y2="222" stroke="#f85149" stroke-width="1.5"/>
  <line x1="266" y1="222" x2="274" y2="222" stroke="#f85149" stroke-width="1.5"/>
  <line x1="328" y1="222" x2="336" y2="222" stroke="#f85149" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="300" y="268" fill="#f85149" font-size="11" text-anchor="middle">严格因果依赖：第 N 个 token 必须等前 N−1 个全部生成</text>

  <!-- 特性 -->
  <g font-size="13">
    <text x="86" y="310" fill="#8b949e">• 注意力：纯因果（causal）单向掩码</text>
    <text x="86" y="340" fill="#8b949e">• 每 token 一次前向：N 个 token = N 次串行传播</text>
    <text x="86" y="370" fill="#8b949e">• 单请求低批处理时严重<tspan fill="#f85149">内存带宽受限</tspan>：权重/KV 搬运远多于计算</text>
    <text x="86" y="400" fill="#8b949e">• token 一旦写出即<tspan fill="#f85149">永久承诺</tspan>，后文发现错误无法回头改</text>
    <text x="86" y="430" fill="#8b949e">• 投机解码（draft-verify）仅做到 ~3–6 TPF，接受率随位置衰减</text>
  </g>
  <rect x="86" y="455" width="468" height="92" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="106" y="483" fill="#e6edf3" font-size="13" font-weight="700">典型速度（H100，batch=1）</text>
  <text x="106" y="510" fill="#8b949e" font-size="12">Gemma 4 26B-A4B：204 TPS　|　+MTP 投机解码：303 TPS</text>
  <text x="106" y="532" fill="#8b949e" font-size="12">GPT-4o-mini / Claude 3.5 Haiku 量级：约 60–70 TPS</text>

  <!-- ===== DLM 侧 ===== -->
  <rect x="620" y="110" width="520" height="470" rx="12" fill="none" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="880" y="142" fill="#3fb950" font-size="17" font-weight="700" text-anchor="middle">扩散模型 p(x₀|xₜ) 迭代去噪</text>

  <!-- 去噪 4 行 -->
  <text x="650" y="180" fill="#8b949e" font-size="12">去噪迭代（每次前向并行更新全部 8 个位置）</text>
  <g font-size="12" text-anchor="middle">
    <!-- t=1 noise -->
    <text x="644" y="216" fill="#8b949e" font-size="10" text-anchor="end">t=1</text>
    <rect x="650" y="196" width="430" height="34" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="865" y="218" fill="#6e7681" font-style="italic">q#z  r?  @k  !x  v2  %p  w8  …（全噪声 / [MASK]）</text>
    <!-- t=0.6 -->
    <text x="644" y="261" fill="#8b949e" font-size="10" text-anchor="end">t=.6</text>
    <rect x="650" y="241" width="430" height="34" rx="6" fill="#161b22" stroke="#d29922"/>
    <text x="865" y="263" fill="#d29922">The  ?at  [M]  on  the  [M]  m?t  .</text>
    <!-- t=0.3 -->
    <text x="644" y="306" fill="#8b949e" font-size="10" text-anchor="end">t=.3</text>
    <rect x="650" y="286" width="430" height="34" rx="6" fill="#161b22" stroke="#58a6ff"/>
    <text x="865" y="308" fill="#9ecbff">The  cat  [M]  on  the  warm  mat  .</text>
    <!-- t=0 clean -->
    <text x="644" y="351" fill="#8b949e" font-size="10" text-anchor="end">t=0</text>
    <rect x="650" y="331" width="430" height="34" rx="6" fill="#161b22" stroke="#3fb950"/>
    <text x="865" y="353" fill="#3fb950">The  cat  sat  on  the  warm  mat  .</text>
  </g>
  <path d="M640 230 L640 331" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <defs><marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#3fb950" stroke-width="1.2"/></marker></defs>
  <text x="880" y="386" fill="#3fb950" font-size="11" text-anchor="middle">块内双向注意力：任意位置可同时看到「过去」与「未来」，早期错误后续可修正</text>

  <g font-size="13">
    <text x="646" y="420" fill="#8b949e">• 注意力：块内<tspan fill="#3fb950">双向</tspan>（+ 块间因果 KV 缓存，即 block-AR）</text>
    <text x="646" y="448" fill="#8b949e">• 每次前向产出整块 token：TPF ≫ 1（DiffusionGemma 平均 ~20）</text>
  </g>
  <rect x="646" y="466" width="468" height="80" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="666" y="494" fill="#e6edf3" font-size="13" font-weight="700">典型速度（H100，batch=1）</text>
  <text x="666" y="521" fill="#8b949e" font-size="12">DiffusionGemma 26B-A4B：~1,479 TPS　Mercury Coder Mini：1,109 TPS</text>
  <text x="666" y="541" fill="#8b949e" font-size="12">同量级 AR 的 5–10×；高并发（~32 路）后优势收窄</text>

  <!-- 底部统一公式 -->
  <rect x="60" y="610" width="1080" height="110" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="80" y="640" fill="#e6edf3" font-size="14" font-weight="700">共同祖先与关键区别</text>
  <text x="80" y="668" fill="#8b949e" font-size="13">两者都用 Transformer 骨干；区别在<tspan fill="#bc8cff">注意力掩码</tspan>（因果 vs 双向）、<tspan fill="#bc8cff">训练目标</tspan>（下一个 token 的 CE vs 任意噪声水平下恢复干净 token 的去噪 CE / ELBO）、<tspan fill="#bc8cff">解码结构</tspan>（位置上的链式分解 vs 噪声时间上的马尔可夫链分解）。</text>
  <text x="80" y="694" fill="#8b949e" font-size="13">扩散把图像领域「先出全局轮廓、再逐步细化」的 coarse-to-fine 范式搬到离散文本：BERT 式双向掩码 → 多步扩散 → 大规模语言扩散模型。</text>
</svg>
</body></html>
