<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>图1 · Muon 更新机制与谱拉平</title>
<style>
html,body{margin:0;padding:0;background:#0d1117}
svg{display:block;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
</style></head><body>
<svg viewBox="0 0 1240 880" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1240" height="880" fill="#0d1117"/>
  <text x="50" y="48" fill="#e6edf3" font-size="24" font-weight="700">图 1 · Muon 的一步更新：把梯度矩阵「正交化」后再更新权重</text>
  <text x="50" y="76" fill="#8b949e" font-size="13">核心区别于 AdamW：不逐元素归一化，而是对整个 2D 矩阵做极分解，把更新的所有奇异值拉平为 1</text>

  <!-- Pipeline boxes -->
  <!-- 1 gradient -->
  <rect x="50" y="120" width="200" height="120" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="70" y="150" fill="#58a6ff" font-size="15" font-weight="700">① 梯度矩阵</text>
  <text x="70" y="182" fill="#e6edf3" font-size="15">∇L(W)</text>
  <text x="70" y="212" fill="#8b949e" font-size="12">仅 2D 矩阵参数</text>
  <text x="70" y="230" fill="#8b949e" font-size="12">Q/K/V/O · MLP · router</text>

  <!-- 2 momentum -->
  <rect x="320" y="120" width="220" height="120" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="340" y="150" fill="#3fb950" font-size="15" font-weight="700">② 动量缓冲</text>
  <text x="340" y="182" fill="#e6edf3" font-size="14">Mₜ = μ·Mₜ₋₁ + ∇L</text>
  <text x="340" y="212" fill="#8b949e" font-size="12">μ ≈ 0.95，Nesterov</text>
  <text x="340" y="230" fill="#d29922" font-size="12">仅 1 个 buffer（AdamW 需 2 个）</text>

  <!-- 3 orthogonalize -->
  <rect x="610" y="110" width="260" height="140" rx="10" fill="#1c1420" stroke="#bc8cff" stroke-width="2"/>
  <text x="630" y="140" fill="#bc8cff" font-size="16" font-weight="700">③ 矩阵正交化（核心）</text>
  <text x="630" y="172" fill="#e6edf3" font-size="14">O = NewtonSchulz(M)</text>
  <text x="630" y="200" fill="#e6edf3" font-size="13">M = UΣVᵀ → O ≈ UVᵀ</text>
  <text x="630" y="228" fill="#8b949e" font-size="12">5 次矩阵乘迭代，无需 SVD</text>

  <!-- 4 update -->
  <rect x="940" y="120" width="250" height="120" rx="10" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
  <text x="960" y="150" fill="#d29922" font-size="15" font-weight="700">④ 更新权重</text>
  <text x="960" y="180" fill="#e6edf3" font-size="12.5">W ← W − η·(0.2·O·√max(A,B)</text>
  <text x="960" y="200" fill="#e6edf3" font-size="12.5">　　　　 + λ·W)</text>
  <text x="960" y="226" fill="#8b949e" font-size="12">consistent RMS + weight decay</text>

  <line x1="250" y1="180" x2="315" y2="180" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="540" y1="180" x2="605" y2="180" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="870" y1="180" x2="935" y2="180" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Spectral flattening visual -->
  <text x="50" y="320" fill="#e6edf3" font-size="18" font-weight="700">正交化做了什么：奇异值谱被「拉平」</text>

  <!-- AdamW spectrum -->
  <text x="80" y="360" fill="#58a6ff" font-size="14" font-weight="700">AdamW / SGD（按元素缩放）</text>
  <g>
    <rect x="80"  y="470" width="46" height="60" fill="#58a6ff" opacity="0.85"/>
    <rect x="135" y="420" width="46" height="110" fill="#58a6ff" opacity="0.75"/>
    <rect x="190" y="380" width="46" height="150" fill="#58a6ff" opacity="0.6"/>
    <rect x="245" y="400" width="46" height="130" fill="#58a6ff" opacity="0.5"/>
    <rect x="300" y="455" width="46" height="75" fill="#58a6ff" opacity="0.4"/>
    <rect x="355" y="490" width="46" height="40" fill="#58a6ff" opacity="0.3"/>
    <rect x="410" y="510" width="46" height="20" fill="#58a6ff" opacity="0.22"/>
  </g>
  <line x1="70" y1="531" x2="470" y2="531" stroke="#8b949e" stroke-width="1"/>
  <text x="80" y="558" fill="#f85149" font-size="12">更新集中在少数大奇异值方向 → 有效秩低，长尾方向学不动</text>

  <!-- arrow -->
  <line x1="500" y1="450" x2="580" y2="450" stroke="#bc8cff" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="500" y="438" fill="#bc8cff" font-size="12">正交化</text>

  <!-- Muon spectrum -->
  <text x="610" y="360" fill="#bc8cff" font-size="14" font-weight="700">Muon（极分解 UVᵀ）</text>
  <g>
    <rect x="610" y="391" width="46" height="140" fill="#bc8cff" opacity="0.9"/>
    <rect x="665" y="391" width="46" height="140" fill="#bc8cff" opacity="0.9"/>
    <rect x="720" y="391" width="46" height="140" fill="#bc8cff" opacity="0.9"/>
    <rect x="775" y="391" width="46" height="140" fill="#bc8cff" opacity="0.9"/>
    <rect x="830" y="391" width="46" height="140" fill="#bc8cff" opacity="0.9"/>
    <rect x="885" y="391" width="46" height="140" fill="#bc8cff" opacity="0.9"/>
    <rect x="940" y="391" width="46" height="140" fill="#bc8cff" opacity="0.9"/>
  </g>
  <line x1="600" y1="531" x2="1000" y2="531" stroke="#8b949e" stroke-width="1"/>
  <text x="610" y="558" fill="#3fb950" font-size="12">所有奇异值 = 1，更新满数值秩 → 每个方向都获得等量学习</text>

  <!-- Newton-Schulz iteration note -->
  <rect x="50" y="600" width="1140" height="120" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <text x="70" y="632" fill="#e6edf3" font-size="15" font-weight="700">Newton–Schulz 迭代（近似极分解，避免昂贵 SVD）</text>
  <text x="70" y="664" fill="#e6edf3" font-size="14">X ← a·X + b·(X Xᵀ) X + c·(X Xᵀ)² X，　a=3.4445，b=−4.7750，c=2.0315，迭代 5 次</text>
  <text x="70" y="694" fill="#8b949e" font-size="12.5">先把 M 归一化到算子范数 ≤1 以保证收敛；输出 O 满足 O Oᵀ ≈ I（近正交）。几何上 = 谱范数（Schatten-∞）约束下的最速下降。</text>

  <text x="50" y="760" fill="#3fb950" font-size="13">结果：权重方向谱更平坦（SVD 熵更高），尤其 MoE 路由器差异最大；数学 / 代码任务收益最明显。</text>
  <text x="50" y="790" fill="#8b949e" font-size="12.5">代价：Newton–Schulz 是 AdamW 没有的额外立方复杂度矩阵运算 —— 单步 wall-clock 更贵（见图 3）。</text>
  <text x="50" y="820" fill="#8b949e" font-size="12.5">非矩阵参数（embedding / LM head / RMSNorm / bias）仍走 AdamW —— Muon 是「混合优化器」。</text>
</svg>
</body></html>
