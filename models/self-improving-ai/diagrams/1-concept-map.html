<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>图1 · WSL / WSP / RSI 概念地图</title>
<style>
html,body{margin:0;padding:0;background:#0d1117}
svg{display:block;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
</style></head><body>
<svg viewBox="0 0 1240 860" xmlns="http://www.w3.org/2005/svg">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1240" height="860" fill="#0d1117"/>
  <text x="50" y="48" fill="#e6edf3" font-size="24" font-weight="700">图 1 · 概念地图：WSL 是底座，WSP 是能力形态，RSI 是系统级闭环</text>
  <text x="50" y="76" fill="#8b949e" font-size="13">三者嵌套而非并列：把「权重」从训练终点变为可被模型阅读、书写、并递归改进的对象</text>

  <!-- RSI top -->
  <rect x="50" y="104" width="1140" height="150" rx="12" fill="#1a1422" stroke="#bc8cff" stroke-width="2"/>
  <text x="74" y="138" fill="#bc8cff" font-size="19" font-weight="700">RSI · 递归自我改进（系统范式）</text>
  <text x="74" y="164" fill="#e6edf3" font-size="13">改进不仅作用于「能力」，还作用于「产生能力的过程」；每一代被接受的系统接管下一轮改进</text>
  <rect x="74" y="180" width="250" height="56" rx="8" fill="#241b30" stroke="#bc8cff" stroke-width="1"/>
  <text x="90" y="203" fill="#e6edf3" font-size="13" font-weight="700">内层 · 更新能力</text>
  <text x="90" y="224" fill="#8b949e" font-size="11.5">策略 / 模型 / 记忆 / 技能</text>
  <rect x="350" y="180" width="250" height="56" rx="8" fill="#241b30" stroke="#bc8cff" stroke-width="1"/>
  <text x="366" y="203" fill="#e6edf3" font-size="13" font-weight="700">外层 · 更新过程</text>
  <text x="366" y="224" fill="#8b949e" font-size="11.5">课程 / 奖励 / 验证器 / harness</text>
  <rect x="626" y="180" width="250" height="56" rx="8" fill="#241b30" stroke="#bc8cff" stroke-width="1"/>
  <text x="642" y="203" fill="#e6edf3" font-size="13" font-weight="700">代际继承</text>
  <text x="642" y="224" fill="#8b949e" font-size="11.5">版本谱系 · 保留门禁 · 可回滚</text>
  <rect x="902" y="180" width="264" height="56" rx="8" fill="#2d1418" stroke="#f85149" stroke-width="1"/>
  <text x="918" y="203" fill="#f85149" font-size="13" font-weight="700">治理层</text>
  <text x="918" y="224" fill="#8b949e" font-size="11.5">独立验证 · 硬门禁 · 人工批准</text>

  <line x1="620" y1="254" x2="620" y2="288" stroke="#bc8cff" stroke-width="2" marker-end="url(#arr)"/>

  <!-- WSP middle -->
  <rect x="120" y="292" width="1000" height="150" rx="12" fill="#0f1a24" stroke="#58a6ff" stroke-width="2"/>
  <text x="144" y="326" fill="#58a6ff" font-size="19" font-weight="700">WSP · 权重空间编程（最激进的能力形态）</text>
  <text x="144" y="352" fill="#e6edf3" font-size="13">前沿 LLM 直接检查 / 修改 / 从规格手工设定网络参数 —— 无需梯度下降，可无数据、无前向传播</text>
  <rect x="144" y="368" width="300" height="56" rx="8" fill="#11202c" stroke="#58a6ff" stroke-width="1"/>
  <text x="160" y="391" fill="#e6edf3" font-size="13" font-weight="700">读 Read</text>
  <text x="160" y="412" fill="#8b949e" font-size="11.5">由权重推断功能 / 数据 / 缺陷</text>
  <rect x="470" y="368" width="300" height="56" rx="8" fill="#11202c" stroke="#58a6ff" stroke-width="1"/>
  <text x="486" y="391" fill="#e6edf3" font-size="13" font-weight="700">写 Edit</text>
  <text x="486" y="412" fill="#8b949e" font-size="11.5">局部有界编辑（常仅动数十~千个参数）</text>
  <rect x="796" y="368" width="300" height="56" rx="8" fill="#11202c" stroke="#58a6ff" stroke-width="1"/>
  <text x="812" y="391" fill="#e6edf3" font-size="13" font-weight="700">从零书写 Program</text>
  <text x="812" y="412" fill="#8b949e" font-size="11.5">凭规格手工设定网络全部权重</text>

  <line x1="620" y1="442" x2="620" y2="476" stroke="#58a6ff" stroke-width="2" marker-end="url(#arr)"/>

  <!-- WSL bottom -->
  <rect x="190" y="480" width="860" height="200" rx="12" fill="#101f18" stroke="#3fb950" stroke-width="2"/>
  <text x="214" y="514" fill="#3fb950" font-size="19" font-weight="700">WSL · 权重空间学习（最宽的学术范畴）</text>
  <text x="214" y="540" fill="#e6edf3" font-size="13">把权重的全体可能取值视为有结构、含对称性、可嵌入 / 比较 / 生成的领域来建模</text>
  <rect x="214" y="558" width="260" height="96" rx="8" fill="#12241b" stroke="#3fb950" stroke-width="1"/>
  <text x="230" y="582" fill="#e6edf3" font-size="13" font-weight="700">WSU 理解</text>
  <text x="230" y="604" fill="#8b949e" font-size="11.5">权重几何与对称性</text>
  <text x="230" y="624" fill="#8b949e" font-size="11.5">模型动物园 / 相似性</text>
  <rect x="490" y="558" width="260" height="96" rx="8" fill="#12241b" stroke="#3fb950" stroke-width="1"/>
  <text x="506" y="582" fill="#e6edf3" font-size="13" font-weight="700">WSR 表征</text>
  <text x="506" y="604" fill="#8b949e" font-size="11.5">网络权重的嵌入</text>
  <text x="506" y="624" fill="#8b949e" font-size="11.5">图元网络 / 等变编码</text>
  <rect x="766" y="558" width="260" height="96" rx="8" fill="#12241b" stroke="#3fb950" stroke-width="1"/>
  <text x="782" y="582" fill="#e6edf3" font-size="13" font-weight="700">WSG 生成</text>
  <text x="782" y="604" fill="#8b949e" font-size="11.5">超网络 / 流匹配生成权重</text>
  <text x="782" y="624" fill="#8b949e" font-size="11.5">少样本迁移 / 无数据重构</text>

  <!-- side legend -->
  <rect x="50" y="710" width="1140" height="110" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="72" y="738" fill="#e6edf3" font-size="14" font-weight="700">贯穿判断</text>
  <text x="72" y="764" fill="#3fb950" font-size="12.5">「写」的局部修复能力 ＞ 「读」的整体理解能力（读权重被 2026-11 审计质疑为「局部算术＋数据集记忆」）</text>
  <text x="72" y="788" fill="#d29922" font-size="12.5">可靠证据集中在小网络 / 高度局部化缺陷；大模型上纯文本读权重尚无可靠证据；RSI 跨代增益仍易丢失</text>
  <text x="72" y="810" fill="#bc8cff" font-size="12.5">收敛形态：受治理的自我改进 —— 干预阶梯 + 独立冻结验证 + 权限守恒 + 人工发布批准</text>
</svg>
</body></html>
