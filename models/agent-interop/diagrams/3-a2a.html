<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>图3 · A2A 发现与 Task 生命周期</title>
<style>
html,body{margin:0;padding:0;background:#0d1117}
svg{display:block;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
</style></head><body>
<svg viewBox="0 0 1200 880" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1200" height="880" fill="#0d1117"/>
  <text x="60" y="48" fill="#e6edf3" font-size="24" font-weight="700">图 3 · A2A：Agent Card 能力发现 + 不透明智能体 + 有状态 Task 七态生命周期</text>
  <text x="60" y="76" fill="#8b949e" font-size="13">横向协作建立在最小外部契约上：先发现「能做什么」，再以 Task 协调；协作双方互不暴露内部状态、记忆与工具</text>

  <!-- LEFT: client agent -->
  <rect x="60" y="110" width="320" height="290" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="1.8"/>
  <rect x="60" y="110" width="320" height="38" rx="14" fill="#58a6ff" opacity="0.12"/>
  <text x="80" y="136" fill="#9ecbff" font-size="15" font-weight="700">客户端智能体（编排方）</text>
  <!-- opaque black box interior -->
  <rect x="84" y="166" width="272" height="150" rx="10" fill="#0a0e14" stroke="#30363d" stroke-dasharray="5 4"/>
  <text x="220" y="230" fill="#6e7681" font-size="13" text-anchor="middle">内部实现不透明</text>
  <text x="220" y="254" fill="#6e7681" font-size="11" text-anchor="middle">（模型 / 记忆 / 工具 / 提示 均隐藏）</text>
  <text x="84" y="345" fill="#8b949e" font-size="11.5">创建 Task（message/send · message/stream）</text>
  <text x="84" y="370" fill="#8b949e" font-size="11.5">持有 sessionId，可多轮追加修改</text>

  <!-- RIGHT: remote specialist -->
  <rect x="820" y="110" width="320" height="290" rx="14" fill="#161b22" stroke="#bc8cff" stroke-width="1.8"/>
  <rect x="820" y="110" width="320" height="38" rx="14" fill="#bc8cff" opacity="0.13"/>
  <text x="840" y="136" fill="#d2a8ff" font-size="15" font-weight="700">远端专家智能体（服务器）</text>
  <rect x="844" y="166" width="272" height="150" rx="10" fill="#0a0e14" stroke="#30363d" stroke-dasharray="5 4"/>
  <text x="980" y="230" fill="#6e7681" font-size="13" text-anchor="middle">内部实现不透明</text>
  <text x="980" y="254" fill="#6e7681" font-size="11" text-anchor="middle">Salesforce / ServiceNow / 自研…</text>
  <text x="844" y="345" fill="#8b949e" font-size="11.5">判定并维护 Task 状态</text>
  <text x="844" y="370" fill="#8b949e" font-size="11.5">可拒绝 / 协商 / 请求补充 / 再委派</text>

  <!-- CENTER: discovery + channel -->
  <!-- Agent Card -->
  <rect x="450" y="120" width="300" height="120" rx="10" fill="#12261a" stroke="#3fb950" stroke-width="1.8"/>
  <text x="600" y="148" fill="#7ee787" font-size="14" font-weight="700" text-anchor="middle">Agent Card</text>
  <text x="600" y="172" fill="#8b949e" font-size="11" text-anchor="middle">GET /.well-known/agent.json</text>
  <text x="470" y="198" fill="#e6edf3" font-size="11">· 身份 / 端点 / 认证要求</text>
  <text x="470" y="218" fill="#e6edf3" font-size="11">· skills[] 技能 + tags + 示例</text>
  <text x="470" y="236" fill="#e6edf3" font-size="11">· 能力：流式 / 推送 / 模态</text>

  <!-- discovery arrow left -->
  <path d="M450,180 L380,180" stroke="#3fb950" stroke-width="2" marker-end="url(#arG)"/>
  <text x="415" y="168" fill="#7ee787" font-size="10.5" text-anchor="middle">发现</text>

  <!-- channel arrows -->
  <path d="M380,300 L820,300" stroke="#bc8cff" stroke-width="2.2" marker-end="url(#arP)"/>
  <path d="M820,330 L380,330" stroke="#58a6ff" stroke-width="2.2" marker-end="url(#arB)"/>
  <text x="600" y="288" fill="#d2a8ff" font-size="11.5" text-anchor="middle">请求：Message（role + Part[]） · JSON-RPC 2.0 over HTTP(S)</text>
  <text x="600" y="352" fill="#9ecbff" font-size="11.5" text-anchor="middle">响应：TaskStatusUpdateEvent / TaskArtifactUpdateEvent（SSE 流式）</text>
  <text x="600" y="380" fill="#8b949e" font-size="10.5" text-anchor="middle">同步 send ｜ 流式 stream（SSE）｜ 长任务异步 + 推送通知</text>

  <defs>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#3fb950"/></marker>
    <marker id="arP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#bc8cff"/></marker>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#58a6ff"/></marker>
    <marker id="arA" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#d29922"/></marker>
  </defs>

  <!-- BOTTOM: Task state machine -->
  <rect x="60" y="430" width="1080" height="420" rx="14" fill="#161b22" stroke="#d29922" stroke-width="1.6"/>
  <rect x="60" y="430" width="1080" height="38" rx="14" fill="#d29922" opacity="0.12"/>
  <text x="82" y="456" fill="#e3b341" font-size="16" font-weight="700">Task 生命周期状态机（状态由远端智能体维护；多个 Task 可共享 sessionId）</text>

  <!-- states -->
  <!-- submitted -->
  <rect x="100" y="520" width="150" height="60" rx="30" fill="#1d2b45" stroke="#58a6ff" stroke-width="1.8"/>
  <text x="175" y="548" fill="#9ecbff" font-size="14" font-weight="700" text-anchor="middle">submitted</text>
  <text x="175" y="568" fill="#8b949e" font-size="10.5" text-anchor="middle">已提交</text>

  <!-- working -->
  <rect x="360" y="520" width="150" height="60" rx="30" fill="#12261a" stroke="#3fb950" stroke-width="2"/>
  <text x="435" y="548" fill="#7ee787" font-size="14" font-weight="700" text-anchor="middle">working</text>
  <text x="435" y="568" fill="#8b949e" font-size="10.5" text-anchor="middle">执行中（可流式产出）</text>

  <!-- input-required -->
  <rect x="620" y="520" width="180" height="60" rx="30" fill="#3a2e15" stroke="#d29922" stroke-width="1.8"/>
  <text x="710" y="548" fill="#e3b341" font-size="13.5" font-weight="700" text-anchor="middle">input-required</text>
  <text x="710" y="568" fill="#8b949e" font-size="10.5" text-anchor="middle">需要客户端补充</text>

  <!-- completed -->
  <rect x="900" y="520" width="170" height="60" rx="30" fill="#0f2e1c" stroke="#3fb950" stroke-width="2.4"/>
  <text x="985" y="548" fill="#56d364" font-size="14" font-weight="700" text-anchor="middle">completed</text>
  <text x="985" y="568" fill="#8b949e" font-size="10.5" text-anchor="middle">成功（产出 Artifact）</text>

  <!-- edges row 1 -->
  <path d="M250,550 L358,550" stroke="#8b949e" stroke-width="2" marker-end="url(#arA)"/>
  <path d="M510,550 L618,550" stroke="#d29922" stroke-width="2" marker-end="url(#arA)"/>
  <path d="M620,540 C560,470 520,470 452,520" fill="none" stroke="#d29922" stroke-width="1.8" marker-end="url(#arA)"/>
  <text x="556" y="492" fill="#e3b341" font-size="10.5" text-anchor="middle">补充后继续</text>
  <path d="M800,550 L898,550" stroke="#3fb950" stroke-width="2" marker-end="url(#arG)"/>

  <!-- terminal bad states -->
  <rect x="360" y="660" width="150" height="58" rx="29" fill="#3a1d24" stroke="#f85149" stroke-width="1.8"/>
  <text x="435" y="687" fill="#ffa198" font-size="14" font-weight="700" text-anchor="middle">failed</text>
  <text x="435" y="706" fill="#8b949e" font-size="10.5" text-anchor="middle">执行失败</text>

  <rect x="620" y="660" width="180" height="58" rx="29" fill="#2d2431" stroke="#bc8cff" stroke-width="1.8"/>
  <text x="710" y="687" fill="#d2a8ff" font-size="14" font-weight="700" text-anchor="middle">canceled</text>
  <text x="710" y="706" fill="#8b949e" font-size="10.5" text-anchor="middle">被取消</text>

  <rect x="900" y="660" width="170" height="58" rx="29" fill="#0a0e14" stroke="#6e7681" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="985" y="687" fill="#8b949e" font-size="14" font-weight="700" text-anchor="middle">unknown</text>
  <text x="985" y="706" fill="#6e7681" font-size="10.5" text-anchor="middle">状态未知（容错）</text>

  <!-- edges to terminal -->
  <path d="M430,582 L430,658" stroke="#f85149" stroke-width="2" marker-end="url(#arA)"/>
  <path d="M690,582 C690,620 700,630 706,658" fill="none" stroke="#bc8cff" stroke-width="2" marker-end="url(#arA)"/>

  <!-- legend / data objects -->
  <line x1="100" y1="760" x2="1080" y2="760" stroke="#30363d"/>
  <text x="100" y="790" fill="#e6edf3" font-size="12.5" font-weight="700">交换的数据对象：</text>
  <text x="100" y="815" fill="#9ecbff" font-size="11.5">Message = role + Part[]（文本/文件/数据多模态分片）</text>
  <text x="100" y="838" fill="#7ee787" font-size="11.5">Artifact = 任务工作成果（文档/图片/代码/报表），可增量更新，与交互消息分离</text>
  <text x="700" y="815" fill="#8b949e" font-size="11.5">final=true 标志事件流结束；断线可重新订阅/推送唤回</text>
  <text x="700" y="838" fill="#8b949e" font-size="11.5">Google 2025-04-09 发布 · 2025-06-23 捐赠 Linux 基金会 · 已吸收 IBM ACP</text>
</svg>
</body></html>
