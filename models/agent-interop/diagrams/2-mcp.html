<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>图2 · MCP 架构</title>
<style>
html,body{margin:0;padding:0;background:#0d1117}
svg{display:block;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
</style></head><body>
<svg viewBox="0 0 1200 880" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1200" height="880" fill="#0d1117"/>
  <text x="60" y="48" fill="#e6edf3" font-size="24" font-weight="700">图 2 · MCP 客户端—服务器架构：一个 Host 内多 Client，分别 1:1 连接多 Server</text>
  <text x="60" y="76" fill="#8b949e" font-size="13">会话状态与权限边界隔离在单条连接内；服务器自描述 Tools / Resources / Prompts，模型决定调用、宿主执行安全策略</text>

  <!-- HOST -->
  <rect x="60" y="100" width="1080" height="250" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="1.8"/>
  <rect x="60" y="100" width="1080" height="40" rx="14" fill="#58a6ff" opacity="0.12"/>
  <text x="84" y="127" fill="#9ecbff" font-size="17" font-weight="700">Host 宿主（AI 应用：Claude Desktop · VS Code · Cursor · 自研 Agent 运行时）</text>

  <!-- LLM brain -->
  <rect x="90" y="160" width="200" height="78" rx="10" fill="#21304a" stroke="#58a6ff" stroke-width="1.6"/>
  <text x="190" y="192" fill="#e6edf3" font-size="14" font-weight="700" text-anchor="middle">LLM 推理 / 决策</text>
  <text x="190" y="216" fill="#8b949e" font-size="11.5" text-anchor="middle">读意图 + 工具描述</text>
  <text x="190" y="233" fill="#8b949e" font-size="11.5" text-anchor="middle">决定调用哪个工具</text>

  <!-- security policy -->
  <rect x="90" y="252" width="200" height="72" rx="10" fill="#3a2e15" stroke="#d29922" stroke-width="1.6"/>
  <text x="190" y="280" fill="#e3b341" font-size="13" font-weight="700" text-anchor="middle">安全策略</text>
  <text x="190" y="302" fill="#8b949e" font-size="11" text-anchor="middle">副作用前人类确认</text>
  <text x="190" y="319" fill="#8b949e" font-size="11" text-anchor="middle">权限隔离 · 审计日志</text>

  <!-- three clients -->
  <g>
    <rect x="360" y="170" width="220" height="60" rx="9" fill="#12261a" stroke="#3fb950" stroke-width="1.6"/>
    <text x="470" y="197" fill="#7ee787" font-size="13" font-weight="700" text-anchor="middle">MCP Client ①</text>
    <text x="470" y="218" fill="#8b949e" font-size="11" text-anchor="middle">1:1 专用会话</text>

    <rect x="610" y="170" width="220" height="60" rx="9" fill="#12261a" stroke="#3fb950" stroke-width="1.6"/>
    <text x="720" y="197" fill="#7ee787" font-size="13" font-weight="700" text-anchor="middle">MCP Client ②</text>
    <text x="720" y="218" fill="#8b949e" font-size="11" text-anchor="middle">1:1 专用会话</text>

    <rect x="860" y="170" width="250" height="60" rx="9" fill="#12261a" stroke="#3fb950" stroke-width="1.6"/>
    <text x="985" y="197" fill="#7ee787" font-size="13" font-weight="700" text-anchor="middle">MCP Client ③</text>
    <text x="985" y="218" fill="#8b949e" font-size="11" text-anchor="middle">1:1 专用会话</text>
  </g>
  <text x="720" y="270" fill="#8b949e" font-size="12" text-anchor="middle">宿主连 N 个服务器 = 实例化 N 个 Client；连接之间隔离，防单点失陷全面污染</text>
  <text x="720" y="300" fill="#9ecbff" font-size="12" text-anchor="middle">握手 initialize → 能力 tools/list → 调用 tools/call（JSON-RPC 2.0）</text>
  <text x="720" y="326" fill="#8b949e" font-size="11.5" text-anchor="middle">另支持 Sampling（服务器反向请求模型补全）与 Roots（声明可操作根范围）</text>

  <!-- connection lines from clients down -->
  <g stroke-width="2" fill="none">
    <path d="M470,230 L470,400" stroke="#3fb950"/>
    <path d="M720,230 L720,400" stroke="#3fb950"/>
    <path d="M985,230 L985,400" stroke="#3fb950"/>
  </g>

  <!-- SERVERS -->
  <!-- Server 1: stdio local -->
  <rect x="330" y="400" width="280" height="250" rx="12" fill="#161b22" stroke="#bc8cff" stroke-width="1.7"/>
  <rect x="330" y="400" width="280" height="36" rx="12" fill="#bc8cff" opacity="0.13"/>
  <text x="470" y="424" fill="#d2a8ff" font-size="14" font-weight="700" text-anchor="middle">MCP Server · 文件/Git</text>
  <g font-size="11.5">
    <rect x="350" y="450" width="240" height="52" rx="7" fill="#1d2b45" stroke="#58a6ff"/>
    <text x="366" y="472" fill="#9ecbff" font-weight="700">Tools（动词）</text>
    <text x="366" y="492" fill="#8b949e" font-size="10.5">模型控制 · 有副作用 · tools/call</text>
    <rect x="350" y="510" width="240" height="52" rx="7" fill="#12261a" stroke="#3fb950"/>
    <text x="366" y="532" fill="#7ee787" font-weight="700">Resources（名词）</text>
    <text x="366" y="552" fill="#8b949e" font-size="10.5">URI 只读 · 文本/二进制 · 防注入</text>
    <rect x="350" y="570" width="240" height="52" rx="7" fill="#2a1d3d" stroke="#bc8cff"/>
    <text x="366" y="592" fill="#d2a8ff" font-weight="700">Prompts（句式）</text>
    <text x="366" y="612" fill="#8b949e" font-size="10.5">用户触发 · 可复用模板</text>
  </g>
  <rect x="350" y="628" width="240" height="0" />

  <!-- Server 2 -->
  <rect x="580" y="400" width="280" height="250" rx="12" fill="#161b22" stroke="#bc8cff" stroke-width="1.7"/>
  <rect x="580" y="400" width="280" height="36" rx="12" fill="#bc8cff" opacity="0.13"/>
  <text x="720" y="424" fill="#d2a8ff" font-size="14" font-weight="700" text-anchor="middle">MCP Server · 数据库</text>
  <g font-size="11.5">
    <rect x="600" y="450" width="240" height="52" rx="7" fill="#1d2b45" stroke="#58a6ff"/>
    <text x="616" y="472" fill="#9ecbff" font-weight="700">Tools</text>
    <text x="616" y="492" fill="#8b949e" font-size="10.5">query_sql · execute</text>
    <rect x="600" y="510" width="240" height="52" rx="7" fill="#12261a" stroke="#3fb950"/>
    <text x="616" y="532" fill="#7ee787" font-weight="700">Resources</text>
    <text x="616" y="552" fill="#8b949e" font-size="10.5">db://table/{id} 记录</text>
    <rect x="600" y="570" width="240" height="52" rx="7" fill="#2a1d3d" stroke="#bc8cff"/>
    <text x="616" y="592" fill="#d2a8ff" font-weight="700">Prompts</text>
    <text x="616" y="612" fill="#8b949e" font-size="10.5">分析模板</text>
  </g>

  <!-- Server 3: remote -->
  <rect x="850" y="400" width="290" height="250" rx="12" fill="#161b22" stroke="#bc8cff" stroke-width="1.7"/>
  <rect x="850" y="400" width="290" height="36" rx="12" fill="#bc8cff" opacity="0.13"/>
  <text x="995" y="424" fill="#d2a8ff" font-size="14" font-weight="700" text-anchor="middle">MCP Server · SaaS（远程）</text>
  <g font-size="11.5">
    <rect x="870" y="450" width="250" height="52" rx="7" fill="#1d2b45" stroke="#58a6ff"/>
    <text x="886" y="472" fill="#9ecbff" font-weight="700">Tools</text>
    <text x="886" y="492" fill="#8b949e" font-size="10.5">send_message · 下单</text>
    <rect x="870" y="510" width="250" height="52" rx="7" fill="#12261a" stroke="#3fb950"/>
    <text x="886" y="532" fill="#7ee787" font-weight="700">Resources</text>
    <text x="886" y="552" fill="#8b949e" font-size="10.5">mail://current 邮件正文</text>
    <rect x="870" y="570" width="250" height="52" rx="7" fill="#2a1d3d" stroke="#bc8cff"/>
    <text x="886" y="592" fill="#d2a8ff" font-weight="700">Prompts</text>
    <text x="886" y="612" fill="#8b949e" font-size="10.5">工作流斜杠命令</text>
  </g>

  <!-- BOTTOM transport + auth -->
  <rect x="60" y="685" width="520" height="160" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="1.6"/>
  <text x="84" y="715" fill="#7ee787" font-size="15" font-weight="700">传输层（同一套 JSON-RPC 语义）</text>
  <text x="84" y="745" fill="#e6edf3" font-size="12.5">· stdio：本地子进程，零网络开销（约 86% 活动在本机，第三方）</text>
  <text x="84" y="772" fill="#e6edf3" font-size="12.5">· Streamable HTTP：单端点 POST + 可选 SSE，适合远程多租户</text>
  <text x="84" y="802" fill="#f85149" font-size="11.5">旧 HTTP+SSE 双端点已弃用；后续放松强制会话以支持无状态扩展</text>
  <text x="84" y="828" fill="#8b949e" font-size="11">2024-11-25 首发 · 2025-06/11 版持续演进</text>

  <rect x="600" y="685" width="540" height="160" rx="12" fill="#161b22" stroke="#d29922" stroke-width="1.6"/>
  <text x="624" y="715" fill="#e3b341" font-size="15" font-weight="700">授权层（远程）</text>
  <text x="624" y="745" fill="#e6edf3" font-size="12.5">推荐 OAuth 2.1 + PKCE：短期、最小权限、scope 细分令牌</text>
  <text x="624" y="772" fill="#e6edf3" font-size="12.5">资源服务器与授权服务器分离；校验 redirect URI 防 rebinding</text>
  <text x="624" y="802" fill="#f85149" font-size="11.5">现实滞后（Astrix 审计 5200+ 服务器）：仅约 8.5% 用 OAuth</text>
  <text x="624" y="828" fill="#f85149" font-size="11.5">53% 仍用静态 API Key · 79% 经环境变量传密钥</text>
</svg>
</body></html>
