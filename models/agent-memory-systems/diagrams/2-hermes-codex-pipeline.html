<svg viewBox="0 0 1100 920" xmlns="http://www.w3.org/2000/svg">

  <text x="60" y="46" fill="#e6edf3" font-size="24" font-weight="700">图 2 · Hermes 冻结快照式记忆 vs Codex 两阶段抽取-巩固流水线</text>
  <text x="60" y="74" fill="#8b949e" font-size="13">据 Hermes 本地源码/文档与 github.com/openai/codex 的 codex-rs/memories 实测整理，2026-10-26</text>

<!-- ============ Hermes lane ============ -->
  <rect x="60" y="96" width="980" height="276" rx="12" fill="#0d1520" stroke="#1c3a52"/>
  <text x="80" y="124" fill="#39c5cf" font-size="16" font-weight="700">Hermes · 同步、极简：模型亲手写，下一轮生效</text>

  <rect x="80" y="142" width="150" height="92" rx="9" fill="#161b22" stroke="#39c5cf" stroke-width="1.5"/>

  <text x="371" y="194" fill="#e6edf3" font-size="12" text-anchor="middle">MEMORY.md ≤ 2200 chars</text>
  <text x="371" y="214" fill="#e6edf3" font-size="12" text-anchor="middle">USER.md ≤ 1375 chars</text>

  <rect x="512" y="142" width="220" height="92" rx="9" fill="#161b22" stroke="#bc8cff" stroke-width="1.5"/>

  <text x="622" y="190" fill="#e6edf3" font-size="11.5" text-anchor="middle">memory 工具 add/replace/remove</text>
  <text x="622" y="210" fill="#8b949e" font-size="11" text-anchor="middle">唯一子串匹配 · 去重 · 安全扫描</text>

  <rect x="768" y="142" width="252" height="92" rx="9" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>

  <text x="894" y="194" fill="#e6edf3" font-size="11.5" text-anchor="middle">~/.hermes/memories/</text>
  <text x="894" y="214" fill="#8b949e" font-size="11" text-anchor="middle">容量满 → Agent 自行合并后重试</text>

  <rect x="566" y="288" width="454" height="70" rx="9" fill="#0a0e14" stroke="#30363d"/>

  <text x="584" y="351" fill="#8b949e" font-size="11">RetainDB · ByteRover · Supermemory · on_pre_compress v2 fail-closed</text>

<!-- ============ Codex lane ============ -->

  <!-- Phase 1 -->
  <text x="80" y="498" fill="#d29922" font-size="14" font-weight="700">Phase 1 · Rollout Extraction（per-thread，并发有界）</text>

  <text x="170" y="582" fill="#8b949e" font-size="11" text-anchor="middle">空闲足够 · 有扫描上限</text>

  <rect x="292" y="510" width="180" height="92" rx="9" fill="#161b22" stroke="#d29922" stroke-width="1.4"/>

  <text x="382" y="582" fill="#8b949e" font-size="11" text-anchor="middle">失败退避，不空转</text>

  <rect x="504" y="510" width="232" height="92" rx="9" fill="#161b22" stroke="#bc8cff" stroke-width="1.4"/>

  <text x="620" y="560" fill="#e6edf3" font-size="11" text-anchor="middle">raw_memory · rollout_summary</text>
  <text x="620" y="580" fill="#f85149" font-size="11" text-anchor="middle">secrets redaction 密钥脱敏</text>

  <rect x="768" y="510" width="252" height="92" rx="9" fill="#161b22" stroke="#3fb950" stroke-width="1.4"/>

  <text x="894" y="562" fill="#8b949e" font-size="11" text-anchor="middle">写回 state DB</text>
  <text x="894" y="582" fill="#8b949e" font-size="11" text-anchor="middle">succeeded / no_output / failed</text>

  <rect x="262" y="650" width="180" height="112" rx="9" fill="#161b22" stroke="#58a6ff" stroke-width="1.4"/>

  <text x="352" y="720" fill="#e6edf3" font-size="10.5" text-anchor="middle">rollout_summaries/</text>

  <text x="564" y="722" fill="#e6edf3" font-size="10.5" text-anchor="middle">phase2_workspace_diff.md</text>

  <text x="80" y="854" fill="#8b949e" font-size="11.5">个人 Agent：冻结快照性价比最高</text>

  <text x="414" y="876" fill="#8b949e" font-size="11.5">heartbeat 租约 + 失败退避</text>
