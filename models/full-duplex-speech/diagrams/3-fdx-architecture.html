<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>图3 · 全双工模型内部架构</title>
<style>
html,body{margin:0;padding:0;background:#0d1117}
svg{display:block;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
</style></head><body>
<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
<rect width="1200" height="700" fill="#0d1117"/>
<defs>
<marker id="a3" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#58a6ff"/></marker>
<marker id="a3g" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#d29922"/></marker>
</defs>
<text x="50" y="40" fill="#e6edf3" font-size="21" font-weight="700">图 3 · 原生全双工模型内部架构：双流音频 + 内心独白 + 帧级解码</text>
<text x="50" y="66" fill="#8b949e" font-size="13">以 Moshi 类架构为原型；每个 80ms 音频帧，模型同时消费用户帧并产出助手帧与文本</text>

<!-- 用户输入链路 -->
<text x="50" y="110" fill="#7ee787" font-size="13" font-weight="700">用户侧（听）</text>
<rect x="50" y="124" width="150" height="56" rx="8" fill="#12261a" stroke="#3fb950" stroke-width="1.3"/>
<text x="125" y="147" fill="#e6edf3" font-size="12" text-anchor="middle">麦克风 24kHz</text>
<text x="125" y="165" fill="#3fb950" font-size="10.5" text-anchor="middle">含回声/背景人声</text>
<line x1="200" y1="152" x2="232" y2="152" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#a3)"/>
<rect x="234" y="124" width="170" height="56" rx="8" fill="#12263a" stroke="#58a6ff" stroke-width="1.3"/>
<text x="319" y="146" fill="#e6edf3" font-size="12" text-anchor="middle">流式音频编码器</text>
<text x="319" y="164" fill="#58a6ff" font-size="10" text-anchor="middle">Mimi 8码本 · 12.5Hz</text>
<text x="319" y="178" fill="#8b949e" font-size="9.5" text-anchor="middle">帧长 80ms · 1.1kbps</text>
<line x1="404" y1="152" x2="450" y2="200" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#a3)"/>

<!-- 助手输出链路 -->
<text x="50" y="262" fill="#f0883e" font-size="13" font-weight="700">助手侧（说）</text>
<rect x="234" y="276" width="170" height="56" rx="8" fill="#12263a" stroke="#58a6ff" stroke-width="1.3"/>
<text x="319" y="298" fill="#e6edf3" font-size="12" text-anchor="middle">流式语音解码器</text>
<text x="319" y="316" fill="#58a6ff" font-size="10" text-anchor="middle">codec / flow-matching</text>
<text x="319" y="330" fill="#8b949e" font-size="9.5" text-anchor="middle">24kHz 波形输出</text>
<line x1="234" y1="304" x2="200" y2="304" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#a3)"/>
<rect x="50" y="276" width="150" height="56" rx="8" fill="#2e1a12" stroke="#f0883e" stroke-width="1.3"/>
<text x="125" y="299" fill="#e6edf3" font-size="12" text-anchor="middle">扬声器</text>
<text x="125" y="317" fill="#f0883e" font-size="10.5" text-anchor="middle">可被用户随时打断</text>
<line x1="450" y1="260" x2="420" y2="276" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#a3)"/>

<!-- 中央 LLM -->
<rect x="452" y="188" width="300" height="92" rx="12" fill="#1c1a12" stroke="#d29922" stroke-width="2"/>
<text x="602" y="216" fill="#e6edf3" font-size="15" font-weight="700" text-anchor="middle">全双工 LLM 骨干</text>
<text x="602" y="238" fill="#d29922" font-size="11" text-anchor="middle">Temporal Transformer 7B</text>
<text x="602" y="256" fill="#8b949e" font-size="10.5" text-anchor="middle">+ Depth Transformer（帧内码本）</text>
<text x="602" y="272" fill="#8b949e" font-size="10" text-anchor="middle">统一预测：用户/助手音频 + 文本</text>

<!-- 内心独白 -->
<line x1="752" y1="214" x2="800" y2="160" stroke="#d29922" stroke-width="1.5" marker-end="url(#a3g)"/>
<rect x="802" y="124" width="210" height="64" rx="8" fill="#26220f" stroke="#d29922" stroke-width="1.4"/>
<text x="907" y="147" fill="#e6edf3" font-size="12.5" font-weight="700" text-anchor="middle">内心独白 Inner Monologue</text>
<text x="907" y="166" fill="#d29922" font-size="10.5" text-anchor="middle">预测自身语音对应文本</text>
<text x="907" y="182" fill="#8b949e" font-size="10" text-anchor="middle">显著提升语言质量/知识调用</text>

<!-- 工具/RAG -->
<line x1="752" y1="256" x2="800" y2="300" stroke="#58a6ff" stroke-width="1.4" marker-end="url(#a3)"/>
<rect x="802" y="282" width="210" height="52" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.3"/>
<text x="907" y="303" fill="#e6edf3" font-size="12" font-weight="700" text-anchor="middle">异步工具 / RAG</text>
<text x="907" y="321" fill="#58a6ff" font-size="10" text-anchor="middle">MoshiRAG · 不阻塞音频流</text>

<!-- 决策：听/说/停 -->
<line x1="602" y1="280" x2="602" y2="360" stroke="#d29922" stroke-width="1.5" marker-end="url(#a3g)"/>
<rect x="492" y="362" width="220" height="44" rx="8" fill="#26220f" stroke="#d29922" stroke-width="1.4"/>
<text x="602" y="382" fill="#e6edf3" font-size="12" font-weight="700" text-anchor="middle">行为仲裁（每帧决策）</text>
<text x="602" y="399" fill="#d29922" font-size="10.5" text-anchor="middle">继续说 / 让出发言权 / 附和 / 沉默</text>

<!-- ===== 帧级时间线 ===== -->
<text x="50" y="458" fill="#e6edf3" font-size="14" font-weight="700">帧级 token 时间线（每格 = 80ms）：</text>

<!-- 用户轨道 -->
<text x="50" y="492" fill="#3fb950" font-size="11.5">用户音频</text>
<g>
<!-- alternating frames -->
</g>
<rect x="140" y="478" width="120" height="22" rx="4" fill="#3fb950" opacity="0.55"/>
<text x="200" y="494" fill="#0d1117" font-size="10" text-anchor="middle" font-weight="700">说话中…</text>
<rect x="264" y="478" width="48" height="22" rx="4" fill="#30363d"/>
<rect x="316" y="478" width="200" height="22" rx="4" fill="#3fb950" opacity="0.55"/>
<text x="416" y="494" fill="#0d1117" font-size="10" text-anchor="middle" font-weight="700">说话中…（此时助手也在说=重叠）</text>

<!-- 助手轨道 -->
<text x="50" y="536" fill="#f0883e" font-size="11.5">助手音频</text>
<rect x="264" y="522" width="220" height="22" rx="4" fill="#f0883e" opacity="0.6"/>
<text x="374" y="538" fill="#0d1117" font-size="10" text-anchor="middle" font-weight="700">正在回答…</text>
<rect x="488" y="522" width="40" height="22" rx="4" fill="#f85149" opacity="0.75"/>
<text x="508" y="538" fill="#0d1117" font-size="9.5" text-anchor="middle" font-weight="700">停</text>
<rect x="532" y="522" width="60" height="22" rx="4" fill="#30363d"/>
<rect x="596" y="522" width="180" height="22" rx="4" fill="#f0883e" opacity="0.6"/>
<text x="686" y="538" fill="#0d1117" font-size="10" text-anchor="middle" font-weight="700">倾听后重新组织回答</text>

<!-- 打断标注 -->
<line x1="488" y1="500" x2="488" y2="520" stroke="#f85149" stroke-width="1.6"/>
<text x="488" y="470" fill="#f85149" font-size="10.5" text-anchor="middle" font-weight="700">检测到 barge-in</text>
<text x="488" y="558" fill="#8b949e" font-size="10" text-anchor="middle">SALM-Duplex 报告 barge-in 成功率 94.5%、响应 0.69s（Moshi 55.1% / 0.81s）</text>

<!-- 延迟构成 -->
<text x="50" y="600" fill="#e6edf3" font-size="13" font-weight="700">端到端延迟构成（首包）：</text>
<rect x="50" y="614" width="110" height="26" rx="5" fill="#12263a" stroke="#58a6ff" stroke-width="1.1"/>
<text x="105" y="631" fill="#e6edf3" font-size="10.5" text-anchor="middle">编码 80ms</text>
<rect x="166" y="614" width="150" height="26" rx="5" fill="#1c1a12" stroke="#d29922" stroke-width="1.1"/>
<text x="241" y="631" fill="#e6edf3" font-size="10.5" text-anchor="middle">模型首 token ~80–150ms</text>
<rect x="322" y="614" width="110" height="26" rx="5" fill="#12263a" stroke="#58a6ff" stroke-width="1.1"/>
<text x="377" y="631" fill="#e6edf3" font-size="10.5" text-anchor="middle">解码 80ms</text>
<rect x="438" y="614" width="120" height="26" rx="5" fill="#161b22" stroke="#8b949e" stroke-width="1.1"/>
<text x="498" y="631" fill="#e6edf3" font-size="10.5" text-anchor="middle">网络/播放缓冲</text>
<text x="580" y="632" fill="#8b949e" font-size="11">理论 ≈160–230ms；真实网络环境通常 500ms–1.2s（Qwen3-Omni 冷启动音频首包 234ms）</text>

<text x="50" y="676" fill="#8b949e" font-size="11">设计要点：全双工的关键不是「更快的 TTS」，而是把「轮次决策」内化进逐帧生成的模型；回声消除与长时上下文是两大工程瓶颈</text>
</svg>
</body></html>
