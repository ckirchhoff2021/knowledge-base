<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>图1 · VLA 范式总览</title>
<style>
html,body{margin:0;padding:0;background:#0d1117}
svg{display:block;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
</style></head><body>
<svg viewBox="0 0 1120 860" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1120" height="860" fill="#0d1117"/>
  <text x="56" y="46" fill="#e6edf3" font-size="24" font-weight="700">图 1 · 从「感知—规划—控制」模块化流水线到端到端 VLA</text>
  <text x="56" y="74" fill="#8b949e" font-size="13">视觉-语言-动作模型（Vision-Language-Action）把互联网级语义知识直接接入连续机器人动作</text>

  <!-- 上半：传统模块化 -->
  <text x="56" y="112" fill="#8b949e" font-size="15" font-weight="700">传统范式：模块化流水线（误差逐级累积、泛化受限）</text>
  <g font-size="13" fill="#e6edf3">
    <rect x="56" y="126" width="150" height="56" rx="9" fill="#161b22" stroke="#30363d"/>
    <text x="131" y="150" text-anchor="middle">感知</text><text x="131" y="170" text-anchor="middle" fill="#8b949e" font-size="11.5">检测/分割/位姿</text>
    <rect x="246" y="126" width="150" height="56" rx="9" fill="#161b22" stroke="#30363d"/>
    <text x="321" y="150" text-anchor="middle">状态估计</text><text x="321" y="170" text-anchor="middle" fill="#8b949e" font-size="11.5">SLAM / 建模</text>
    <rect x="436" y="126" width="150" height="56" rx="9" fill="#161b22" stroke="#30363d"/>
    <text x="511" y="150" text-anchor="middle">任务规划</text><text x="511" y="170" text-anchor="middle" fill="#8b949e" font-size="11.5">符号 / LLM 规划</text>
    <rect x="626" y="126" width="150" height="56" rx="9" fill="#161b22" stroke="#30363d"/>
    <text x="701" y="150" text-anchor="middle">运动规划</text><text x="701" y="170" text-anchor="middle" fill="#8b949e" font-size="11.5">轨迹优化</text>
    <rect x="816" y="126" width="150" height="56" rx="9" fill="#161b22" stroke="#30363d"/>
    <text x="891" y="150" text-anchor="middle">控制</text><text x="891" y="170" text-anchor="middle" fill="#8b949e" font-size="11.5">PID / MPC</text>
  </g>
  <g stroke="#8b949e" stroke-width="1.6" marker-end="url(#ar)">
    <line x1="206" y1="154" x2="242" y2="154"/><line x1="396" y1="154" x2="432" y2="154"/>
    <line x1="586" y1="154" x2="622" y2="154"/><line x1="776" y1="154" x2="812" y2="154"/>
  </g>
  <line x1="966" y1="154" x2="1042" y2="154" stroke="#f85149" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="1052" y="150" fill="#f85149" font-size="12">关节</text><text x="1052" y="166" fill="#f85149" font-size="12">指令</text>

  <!-- 分隔 -->
  <line x1="56" y1="212" x2="1064" y2="212" stroke="#21262d" stroke-dasharray="5 6"/>

  <!-- 下半：端到端 VLA -->
  <text x="56" y="246" fill="#58a6ff" font-size="15" font-weight="700">VLA 范式：一个神经网络端到端映射 多模态观测 + 语言指令 → 连续动作</text>

  <!-- 输入 -->
  <g>
    <rect x="56" y="276" width="172" height="74" rx="10" fill="#0a0e14" stroke="#39c5cf" stroke-width="1.4"/>
    <text x="142" y="304" text-anchor="middle" fill="#39c5cf" font-size="14" font-weight="700">视觉 o_vis</text>
    <text x="142" y="326" text-anchor="middle" fill="#8b949e" font-size="11.5">单/多视角 RGB(+深度)</text>
    <rect x="56" y="366" width="172" height="74" rx="10" fill="#0a0e14" stroke="#bc8cff" stroke-width="1.4"/>
    <text x="142" y="394" text-anchor="middle" fill="#bc8cff" font-size="14" font-weight="700">语言 l</text>
    <text x="142" y="416" text-anchor="middle" fill="#8b949e" font-size="11.5">开放词表指令</text>
    <rect x="56" y="456" width="172" height="74" rx="10" fill="#0a0e14" stroke="#d29922" stroke-width="1.4"/>
    <text x="142" y="484" text-anchor="middle" fill="#d29922" font-size="14" font-weight="700">本体状态 q</text>
    <text x="142" y="506" text-anchor="middle" fill="#8b949e" font-size="11.5">关节角 / 末端位姿</text>
  </g>
  <line x1="228" y1="403" x2="282" y2="403" stroke="#58a6ff" stroke-width="2" marker-end="url(#arb)"/>

  <!-- VLM backbone -->
  <rect x="286" y="300" width="300" height="206" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="1.8"/>
  <text x="436" y="332" text-anchor="middle" fill="#58a6ff" font-size="16" font-weight="700">预训练 VLM 骨干</text>
  <text x="436" y="354" text-anchor="middle" fill="#8b949e" font-size="11.5">继承互联网级语义 / 视觉先验</text>
  <g font-size="12.5" fill="#e6edf3">
    <rect x="306" y="368" width="260" height="34" rx="7" fill="#0a0e14" stroke="#30363d"/>
    <text x="436" y="390" text-anchor="middle">视觉编码器：DINOv2 / SigLIP</text>
    <rect x="306" y="410" width="260" height="34" rx="7" fill="#0a0e14" stroke="#30363d"/>
    <text x="436" y="432" text-anchor="middle">LLM：PaliGemma / Llama / Qwen-VL</text>
    <rect x="306" y="452" width="260" height="34" rx="7" fill="#0a0e14" stroke="#30363d"/>
    <text x="436" y="474" text-anchor="middle">投影 / Token 融合</text>
  </g>
  <line x1="586" y1="403" x2="640" y2="403" stroke="#58a6ff" stroke-width="2" marker-end="url(#arb)"/>

  <!-- action head -->
  <rect x="644" y="286" width="238" height="234" rx="12" fill="#0a0e14" stroke="#3fb950" stroke-width="1.8"/>
  <text x="763" y="316" text-anchor="middle" fill="#3fb950" font-size="16" font-weight="700">动作头 / 专家</text>
  <text x="763" y="337" text-anchor="middle" fill="#8b949e" font-size="11.5">三种主流生成路线（见图 3）</text>
  <g font-size="12" fill="#e6edf3">
    <rect x="662" y="350" width="202" height="46" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="763" y="370" text-anchor="middle" fill="#39c5cf">自回归离散 token</text>
    <text x="763" y="388" text-anchor="middle" fill="#8b949e" font-size="10.5">RT-2 · OpenVLA · FAST</text>
    <rect x="662" y="402" width="202" height="46" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="763" y="422" text-anchor="middle" fill="#bc8cff">扩散 / DiT</text>
    <text x="763" y="440" text-anchor="middle" fill="#8b949e" font-size="10.5">Diffusion Policy · RDT · GR00T</text>
    <rect x="662" y="454" width="202" height="46" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="763" y="474" text-anchor="middle" fill="#d29922">流匹配 Flow Matching</text>
    <text x="763" y="492" text-anchor="middle" fill="#8b949e" font-size="10.5">π0 / π0.5 · Gemini Robotics</text>
  </g>
  <line x1="882" y1="403" x2="936" y2="403" stroke="#3fb950" stroke-width="2" marker-end="url(#arg)"/>

  <!-- 输出 -->
  <rect x="940" y="330" width="124" height="146" rx="10" fill="#161b22" stroke="#f85149" stroke-width="1.6"/>
  <text x="1002" y="360" text-anchor="middle" fill="#f85149" font-size="14" font-weight="700">动作块</text>
  <text x="1002" y="384" text-anchor="middle" fill="#e6edf3" font-size="11.5">a_{t:t+H}</text>
  <text x="1002" y="408" text-anchor="middle" fill="#8b949e" font-size="11">末端位姿 / 关节</text>
  <text x="1002" y="426" text-anchor="middle" fill="#8b949e" font-size="11">Action Chunking</text>
  <text x="1002" y="452" text-anchor="middle" fill="#3fb950" font-size="11">高频闭环执行</text>

  <!-- 底部三个关键能力 -->
  <text x="56" y="570" fill="#e6edf3" font-size="15" font-weight="700">VLA 相对传统机器人学习的三大跃迁</text>
  <g font-size="12.5">
    <rect x="56" y="586" width="328" height="120" rx="10" fill="#0a0e14" stroke="#30363d"/>
    <rect x="56" y="586" width="6" height="120" rx="3" fill="#58a6ff"/>
    <text x="80" y="616" fill="#58a6ff" font-size="14" font-weight="700">语义泛化</text>
    <text x="80" y="642" fill="#e6edf3">网络知识迁移到控制：能理解未见过</text>
    <text x="80" y="662" fill="#e6edf3">的物体、指令与场景（RT-2 首次验证）</text>
    <text x="80" y="690" fill="#8b949e" font-size="11">emergent skills：推理/识别/人类识别</text>

    <rect x="404" y="586" width="328" height="120" rx="10" fill="#0a0e14" stroke="#30363d"/>
    <rect x="404" y="586" width="6" height="120" rx="3" fill="#3fb950"/>
    <text x="428" y="616" fill="#3fb950" font-size="14" font-weight="700">数据缩放</text>
    <text x="428" y="642" fill="#e6edf3">跨本体、跨机构数据共训（Open X-</text>
    <text x="428" y="662" fill="#e6edf3">Embodiment 100万+ 轨迹）出现缩放律</text>
    <text x="428" y="690" fill="#8b949e" font-size="11">演示 + 人类视频 + 仿真合成三燃料</text>

    <rect x="752" y="586" width="312" height="120" rx="10" fill="#0a0e14" stroke="#30363d"/>
    <rect x="752" y="586" width="6" height="120" rx="3" fill="#d29922"/>
    <text x="776" y="616" fill="#d29922" font-size="14" font-weight="700">动作灵巧性</text>
    <text x="776" y="642" fill="#e6edf3">连续高维动作生成 + Action Chunking，</text>
    <text x="776" y="662" fill="#e6edf3">支撑叠衣、打包等长程精细操作</text>
    <text x="776" y="690" fill="#8b949e" font-size="11">π0.5：首次端到端清扫整间厨房/卧室</text>
  </g>

  <text x="56" y="748" fill="#8b949e" font-size="12.5">形式化：πθ(a | o_vis, l, q)，θ 由「互联网 VLM 预训练 + 跨本体机器人示教后训练」得到；动作空间多为末端执行器 7-DoF 位姿增量</text>
  <text x="56" y="772" fill="#8b949e" font-size="12.5">关键工程取舍：离散 token（好复用 LLM）vs 连续表示（精度高、延迟低）；单步预测 vs 动作块（时序一致、抗抖动）</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8b949e"/></marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#f85149"/></marker>
    <marker id="arb" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#58a6ff"/></marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3fb950"/></marker>
  </defs>
</svg>
</body></html>
