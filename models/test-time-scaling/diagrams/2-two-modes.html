</style></head><body>
<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
<rect width="1200" height="700" fill="#0d1117"/>
<defs>
<marker id="a2b" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#58a6ff"/></marker>
<marker id="a2g" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#3fb950"/></marker>
<marker id="a2o" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#d29922"/></marker>
</defs>
<text x="50" y="42" fill="#e6edf3" font-size="22" font-weight="700">图 2 · TTS 的两大计算模式：顺序修订（深度）× 并行采样（广度），与搜索结构谱</text>
<text x="50" y="68" fill="#8b949e" font-size="13">蓝色＝顺序路径；绿色＝并行分支与验证；金色＝关键瓶颈（验证器质量）</text>

<!-- ===== 左：顺序修订 ===== -->
<rect x="40" y="95" width="540" height="330" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
<text x="60" y="126" fill="#58a6ff" font-size="17" font-weight="700">① 顺序修订 Sequential Revision —— 把一条链做深</text>
<text x="60" y="148" fill="#8b949e" font-size="12">CoT / Self-Refine / Reflexion / 长思维链推理模型（o1、R1）</text>

<rect x="70" y="175" width="90" height="46" rx="8" fill="#0d2238" stroke="#58a6ff" stroke-width="1.3"/>
<text x="115" y="203" fill="#e6edf3" font-size="13" text-anchor="middle">问题 x</text>
<rect x="200" y="175" width="90" height="46" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.3"/>
<text x="245" y="196" fill="#e6edf3" font-size="12" text-anchor="middle">思考 t₁</text>
<text x="245" y="213" fill="#8b949e" font-size="10" text-anchor="middle">…tₖ（可达数万 token）</text>
<rect x="330" y="175" width="90" height="46" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.3"/>
<text x="375" y="203" fill="#e6edf3" font-size="13" text-anchor="middle">反思 / 验证</text>
<rect x="460" y="175" width="90" height="46" rx="8" fill="#0d2d1c" stroke="#3fb950" stroke-width="1.3"/>
<text x="505" y="203" fill="#e6edf3" font-size="13" text-anchor="middle">答案 ŷ</text>
<line x1="160" y1="198" x2="196" y2="198" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#a2b)"/>
<line x1="290" y1="198" x2="326" y2="198" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#a2b)"/>
<line x1="420" y1="198" x2="456" y2="198" stroke="#3fb950" stroke-width="1.5" marker-end="url(#a2g)"/>
<!-- 回环 -->
<path d="M375,221 C375,265 245,265 245,225" fill="none" stroke="#d29922" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#a2o)"/>
<text x="310" y="258" fill="#d29922" font-size="11" text-anchor="middle">发现错误 → 回溯重想（R1 的「aha moment」）</text>

<text x="60" y="300" fill="#e6edf3" font-size="12.5" font-weight="700">特点</text>
<text x="60" y="324" fill="#8b949e" font-size="11.5">· 计算沿单一轨迹加深，token 预算 ≈ 思考长度</text>
<text x="60" y="346" fill="#8b949e" font-size="11.5">· 延迟与 token 数线性相关，适合流式输出</text>
<text x="60" y="368" fill="#8b949e" font-size="11.5">· 风险：一步错一路错、重复打转、过度思考（overthinking）</text>
<text x="60" y="400" fill="#d29922" font-size="11.5">治理：budget forcing（s1）· 自适应触发（AdaCoT）· 早停（E-process/CALM）</text>

<!-- ===== 右：并行采样 ===== -->
<rect x="620" y="95" width="540" height="330" rx="14" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
<text x="640" y="126" fill="#3fb950" font-size="17" font-weight="700">② 并行采样 Parallel Sampling —— 把多条链做广</text>
<text x="640" y="148" fill="#8b949e" font-size="12">Self-Consistency / Best-of-N / Monkeys / 可验证奖励的选择</text>

<rect x="650" y="172" width="80" height="42" rx="8" fill="#0d2238" stroke="#58a6ff" stroke-width="1.3"/>
<text x="690" y="198" fill="#e6edf3" font-size="12.5" text-anchor="middle">问题 x</text>
<!-- N 条分支 -->
<g stroke="#3fb950" stroke-width="1.3" fill="none">
<path d="M730,193 C770,193 770,170 812,170" marker-end="url(#a2g)"/>
<path d="M730,193 L812,193" marker-end="url(#a2g)"/>
<path d="M730,193 C770,193 770,216 812,216" marker-end="url(#a2g)"/>
<path d="M730,193 C780,193 780,244 812,244" marker-end="url(#a2g)"/>
</g>
<rect x="815" y="156" width="120" height="26" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.1"/>
<text x="875" y="173" fill="#e6edf3" font-size="11" text-anchor="middle">轨迹 1 → ŷ₁</text>
<rect x="815" y="182" width="120" height="26" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.1"/>
<text x="875" y="199" fill="#e6edf3" font-size="11" text-anchor="middle">轨迹 2 → ŷ₂</text>
<rect x="815" y="208" width="120" height="26" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.1"/>
<text x="875" y="225" fill="#e6edf3" font-size="11" text-anchor="middle">轨迹 3 → ŷ₃</text>
<rect x="815" y="234" width="120" height="26" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.1"/>
<text x="875" y="251" fill="#8b949e" font-size="10.5" text-anchor="middle">… 轨迹 N → ŷₙ</text>
<!-- 验证器 -->
<path d="M935,193 L985,193" stroke="#d29922" stroke-width="1.5" marker-end="url(#a2o)"/>
<rect x="990" y="160" width="140" height="66" rx="8" fill="#2b2410" stroke="#d29922" stroke-width="1.6"/>
<text x="1060" y="186" fill="#d29922" font-size="12.5" font-weight="700" text-anchor="middle">验证器 / 选择</text>
<text x="1060" y="206" fill="#8b949e" font-size="10.5" text-anchor="middle">规则·多数投票·ORM/PRM</text>
<line x1="1060" y1="226" x2="1060" y2="252" stroke="#3fb950" stroke-width="1.5" marker-end="url(#a2g)"/>
<rect x="1015" y="256" width="90" height="34" rx="8" fill="#0d2d1c" stroke="#3fb950" stroke-width="1.3"/>
<text x="1060" y="278" fill="#e6edf3" font-size="12" text-anchor="middle">最佳 ŷ*</text>

<text x="640" y="320" fill="#e6edf3" font-size="12.5" font-weight="700">特点</text>
<text x="640" y="344" fill="#8b949e" font-size="11.5">· 覆盖率随 N 呈幂律增长（Monkeys：SWE-bench Lite 15.9%→56%@250）</text>
<text x="640" y="366" fill="#8b949e" font-size="11.5">· 易批量、无延迟惩罚（并行），但 token 成本 ×N、分支间无信息共享</text>
<text x="640" y="388" fill="#d29922" font-size="11.5">瓶颈：验证器质量决定上限（PRM800K / Math-Shepherd / ThinkPRM）</text>

<!-- ===== 下：搜索结构谱 ===== -->
<text x="50" y="470" fill="#e6edf3" font-size="16" font-weight="700">搜索结构谱：计算在分支之间共享/复用的程度递增</text>
<rect x="50" y="488" width="260" height="150" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.3"/>
<text x="180" y="514" fill="#8b949e" font-size="13.5" font-weight="700" text-anchor="middle">Best-of-N / 重复采样</text>
<text x="180" y="536" fill="#8b949e" font-size="11" text-anchor="middle">并行 · 零共享</text>
<text x="180" y="560" fill="#58a6ff" font-size="11" text-anchor="middle">self-consistency · Monkeys</text>
<text x="180" y="590" fill="#8b949e" font-size="10.5" text-anchor="middle">最简单，N 大时冗余</text>
<text x="180" y="614" fill="#8b949e" font-size="10.5" text-anchor="middle">无需步骤价值</text>

<rect x="330" y="488" width="260" height="150" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.3"/>
<text x="460" y="514" fill="#8b949e" font-size="13.5" font-weight="700" text-anchor="middle">束搜索 / 序列修订</text>
<text x="460" y="536" fill="#8b949e" font-size="11" text-anchor="middle">顺序 · 前缀共享</text>
<text x="460" y="560" fill="#58a6ff" font-size="11" text-anchor="middle">CoT · Self-Refine · beam</text>
<text x="460" y="590" fill="#8b949e" font-size="10.5" text-anchor="middle">可证缩放曲线（2609.38672）</text>
<text x="460" y="614" fill="#8b949e" font-size="10.5" text-anchor="middle">不能回溯</text>

<rect x="610" y="488" width="260" height="150" rx="10" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
<text x="740" y="514" fill="#d29922" font-size="13.5" font-weight="700" text-anchor="middle">树搜索（MCTS 系）</text>
<text x="740" y="536" fill="#8b949e" font-size="11" text-anchor="middle">并行+顺序 · 节点共享</text>
<text x="740" y="560" fill="#58a6ff" font-size="11" text-anchor="middle">ToT · ReST-MCTS* · rStar-Math</text>
<text x="740" y="590" fill="#8b949e" font-size="10.5" text-anchor="middle">可回溯、可前瞻</text>
<text x="740" y="614" fill="#d29922" font-size="10.5" text-anchor="middle">需要步骤价值估计</text>

<rect x="890" y="488" width="260" height="150" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
<text x="1020" y="514" fill="#3fb950" font-size="13.5" font-weight="700" text-anchor="middle">投机搜索 / 服务化</text>
<text x="1020" y="536" fill="#8b949e" font-size="11" text-anchor="middle">边服务边搜索 · 早停</text>
<text x="1020" y="560" fill="#58a6ff" font-size="10.5" text-anchor="middle">Speculative Search 2609.39334</text>
<text x="1020" y="582" fill="#8b949e" font-size="10.5" text-anchor="middle">Taming 于在线推理服务</text>
<text x="1020" y="606" fill="#3fb950" font-size="10.5" text-anchor="middle">质量-延迟联合最优</text>
