<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>图3 · 自适应计算决策框架</title>
<style>
html,body{margin:0;padding:0;background:#0d1117}
svg{display:block;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
</style></head><body>
<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
<rect width="1200" height="700" fill="#0d1117"/>
<defs>
<marker id="b3" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#58a6ff"/></marker>
<marker id="g3" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#3fb950"/></marker>
<marker id="o3" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#d29922"/></marker>
<marker id="r3" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#f85149"/></marker>
</defs>
<text x="50" y="42" fill="#e6edf3" font-size="22" font-weight="700">图 3 · 自适应计算决策框架：触发 → 分配 → 监控 → 停机的闭环</text>
<text x="50" y="68" fill="#8b949e" font-size="13">金色＝控制决策点；红色＝回退/继续路径；绿色＝停机输出；目标是在质量-延迟-成本帕累托前沿上运行</text>

<!-- 输入 -->
<rect x="500" y="92" width="200" height="46" rx="10" fill="#0d2238" stroke="#58a6ff" stroke-width="1.5"/>
<text x="600" y="121" fill="#e6edf3" font-size="14" text-anchor="middle">输入问题 x + 资源约束</text>
<line x1="600" y1="138" x2="600" y2="166" stroke="#58a6ff" stroke-width="1.6" marker-end="url(#b3)"/>

<!-- 决策1：触发 -->
<polygon points="600,168 720,222 600,276 480,222" fill="#2b2410" stroke="#d29922" stroke-width="1.8"/>
<text x="600" y="216" fill="#d29922" font-size="13.5" font-weight="700" text-anchor="middle">① 触发决策</text>
<text x="600" y="237" fill="#8b949e" font-size="11" text-anchor="middle">是否需要思考？难度估计</text>

<!-- 简单路径 右 -->
<line x1="720" y1="222" x2="900" y2="222" stroke="#3fb950" stroke-width="1.6" marker-end="url(#g3)"/>
<text x="810" y="212" fill="#3fb950" font-size="11.5" text-anchor="middle">简单 → 直答</text>
<rect x="900" y="196" width="180" height="52" rx="10" fill="#0d2d1c" stroke="#3fb950" stroke-width="1.4"/>
<text x="990" y="218" fill="#e6edf3" font-size="12.5" text-anchor="middle">非思考模式直接输出</text>
<text x="990" y="238" fill="#3fb950" font-size="10.5" text-anchor="middle">AdaCoT：触发率可降至 3.18%</text>

<!-- 困难路径 下 -->
<line x1="600" y1="276" x2="600" y2="304" stroke="#d29922" stroke-width="1.6" marker-end="url(#o3)"/>
<text x="624" y="294" fill="#d29922" font-size="11.5">困难 → 思考</text>

<!-- 决策2：分配 -->
<rect x="430" y="306" width="340" height="78" rx="12" fill="#2b2410" stroke="#d29922" stroke-width="1.8"/>
<text x="600" y="332" fill="#d29922" font-size="13.5" font-weight="700" text-anchor="middle">② 计算分配</text>
<text x="600" y="354" fill="#8b949e" font-size="11" text-anchor="middle">深度（顺序 token 预算）× 广度（并行 N）× 验证强度</text>
<text x="600" y="373" fill="#8b949e" font-size="10.5" text-anchor="middle">Snell：按难度自适应；ATEST：资源感知</text>

<!-- 三个执行分支 -->
<line x1="600" y1="384" x2="600" y2="410" stroke="#d29922" stroke-width="1.6" marker-end="url(#o3)"/>
<rect x="150" y="412" width="250" height="86" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.4"/>
<text x="275" y="438" fill="#58a6ff" font-size="13" font-weight="700" text-anchor="middle">顺序推理</text>
<text x="275" y="460" fill="#8b949e" font-size="11" text-anchor="middle">长 CoT · budget forcing</text>
<text x="275" y="482" fill="#8b949e" font-size="10.5" text-anchor="middle">s1 / o1 / R1 式深度思考</text>

<rect x="475" y="412" width="250" height="86" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.4"/>
<text x="600" y="438" fill="#3fb950" font-size="13" font-weight="700" text-anchor="middle">并行采样</text>
<text x="600" y="460" fill="#8b949e" font-size="11" text-anchor="middle">N 条轨迹 · 覆盖率幂律</text>
<text x="600" y="482" fill="#8b949e" font-size="10.5" text-anchor="middle">Monkeys / self-consistency</text>

<rect x="800" y="412" width="250" height="86" rx="10" fill="#161b22" stroke="#d29922" stroke-width="1.4"/>
<text x="925" y="438" fill="#d29922" font-size="13" font-weight="700" text-anchor="middle">搜索 + 验证</text>
<text x="925" y="460" fill="#8b949e" font-size="11" text-anchor="middle">MCTS · PRM 打分筛选</text>
<text x="925" y="482" fill="#8b949e" font-size="10.5" text-anchor="middle">ToT / ReST-MCTS* / ThinkPRM</text>

<line x1="275" y1="498" x2="275" y2="526" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#b3)"/>
<line x1="600" y1="498" x2="600" y2="526" stroke="#3fb950" stroke-width="1.5" marker-end="url(#g3)"/>
<line x1="925" y1="498" x2="925" y2="526" stroke="#d29922" stroke-width="1.5" marker-end="url(#o3)"/>

<!-- 监控 -->
<rect x="150" y="528" width="900" height="60" rx="12" fill="#161b22" stroke="#f85149" stroke-width="1.6"/>
<text x="600" y="553" fill="#f85149" font-size="13.5" font-weight="700" text-anchor="middle">③ 过程监控：置信度 · 候选一致性 · 答案稳定性 · 预算消耗</text>
<text x="600" y="575" fill="#8b949e" font-size="10.5" text-anchor="middle">CALM 一致性 logit 掩码 · E-process 无校准早停 · 因果归因定位「卡住」的 token</text>

<!-- 决策3：停机 -->
<polygon points="600,600 700,636 600,672 500,636" fill="#2b2410" stroke="#d29922" stroke-width="1.8"/>
<text x="600" y="633" fill="#d29922" font-size="12.5" font-weight="700" text-anchor="middle">④ 停机？</text>
<text x="600" y="651" fill="#8b949e" font-size="10" text-anchor="middle">收敛/预算耗尽</text>
<line x1="150" y1="558" x2="150" y2="636" stroke="#f85149" stroke-width="0" />

<!-- 继续 左回 -->
<line x1="500" y1="636" x2="120" y2="636" stroke="#f85149" stroke-width="1.6" marker-end="url(#r3)"/>
<line x1="120" y1="636" x2="120" y2="345" stroke="#f85149" stroke-width="1.6"/>
<line x1="120" y1="345" x2="426" y2="345" stroke="#f85149" stroke-width="1.6" marker-end="url(#r3)"/>
<text x="180" y="626" fill="#f85149" font-size="11.5">未收敛 → 追加采样 / 重分配 / 重想</text>

<!-- 停止 右 -->
<line x1="700" y1="636" x2="900" y2="636" stroke="#3fb950" stroke-width="1.6" marker-end="url(#g3)"/>
<text x="800" y="626" fill="#3fb950" font-size="11.5" text-anchor="middle">收敛 → 输出</text>
<rect x="900" y="612" width="180" height="48" rx="10" fill="#0d2d1c" stroke="#3fb950" stroke-width="1.4"/>
<text x="990" y="641" fill="#e6edf3" font-size="13" text-anchor="middle">返回答案 ŷ*</text>

</svg>
</body></html>
