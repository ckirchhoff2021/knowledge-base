<text x="50" y="42" fill="#e6edf3" font-size="22" font-weight="700">图 4 · 显式 CoT（语言空间）× 潜空间推理（连续向量）：思考的两种载体</text>
<text x="50" y="68" fill="#8b949e" font-size="13">蓝色路径＝逐 token 语言推理；紫色路径＝连续 latent 状态迭代；同一问题的两种计算展开方式</text>

<!-- ===== 上：显式 CoT ===== -->
<rect x="40" y="92" width="1120" height="230" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
<text x="60" y="122" fill="#58a6ff" font-size="16" font-weight="700">显式 CoT：推理过程是可读的自然语言 token 序列</text>
<text x="60" y="144" fill="#8b949e" font-size="11.5">o1 / R1 / s1 / Qwen3 thinking —— 每个中间步都物化为 token，写进上下文，再被下一步注意力读取</text>

<text x="60" y="252" fill="#8b949e" font-size="11">· 串行：每个 token 依赖前一个 → 延迟高；· 全程可读可审计；· 上下文随思考变长，KV cache 与注意力成本上升；· 会重复打转 / 晚节不保</text>
<text x="60" y="274" fill="#8b949e" font-size="11">· 工程成熟：RLVR、蒸馏、budget forcing、早停都围绕语言 token 设计</text>
<text x="60" y="302" fill="#d29922" font-size="11">忠实性争议：CoT 文本未必反映真实计算（2610.22841 / 2610.23275；2610.28303 显示奖励错配会削弱可监控性）</text>

<text x="60" y="520" fill="#8b949e" font-size="11">· 连续计算可并行/循环展开 → 延迟低、无 token 序列化瓶颈；· 不膨胀上下文；· 信息密度高</text>
<text x="60" y="546" fill="#f85149" font-size="11">· 黑盒：人不可读、难以审计与监控 → 对齐/欺骗风险更高；· 长程迭代会「漂移」（2609.37351 用 Port-Hamiltonian 约束治理漂移悬崖）</text>
<text x="60" y="572" fill="#8b949e" font-size="11">· 训练范式仍新：2026 出现自适应循环 Transformer（2609.35748）、token 解耦 latent TTS（2609.35228）、循环原生注意力残差支撑上万次迭代（2610.11570）</text>
<text x="60" y="606" fill="#bc8cff" font-size="11.5">趋势：两种载体正在融合——语言思考用于可审计环节，latent 思考用于高并行/低延迟环节，由路由器统一调度</text>
