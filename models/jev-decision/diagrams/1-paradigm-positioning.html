<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>图1 · 范式定位</title>
<style>
html,body{margin:0;padding:0;background:#0d1117}
svg{display:block;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
</style></head><body>
<svg viewBox="0 0 1200 820" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1200" height="820" fill="#0d1117"/>
  <text x="60" y="56" fill="#e6edf3" font-size="24" font-weight="700">图 1 · 决策模型范式定位：灵活性 × 效率</text>
  <text x="60" y="86" fill="#8b949e" font-size="13">Jev 试图同时占据「运行时高灵活」与「决策高效率」两个象限</text>

  <!-- 象限底色 -->
  <rect x="120" y="120" width="800" height="500" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <line x1="520" y1="120" x2="520" y2="620" stroke="#30363d" stroke-width="1" stroke-dasharray="6 6"/>
  <line x1="120" y1="370" x2="920" y2="370" stroke="#30363d" stroke-width="1" stroke-dasharray="6 6"/>

  <!-- 轴标签 -->
  <text x="520" y="660" fill="#8b949e" font-size="14" text-anchor="middle">运行时灵活性（标签 / 规则是否可现场定义）→</text>
  <text x="70" y="370" fill="#8b949e" font-size="14" text-anchor="middle" transform="rotate(-90 70 370)">决策效率（速度 / 成本）→</text>
  <text x="130" y="146" fill="#6e7681" font-size="12">高效率 · 低灵活</text>
  <text x="910" y="146" fill="#6e7681" font-size="12" text-anchor="end">高效率 · 高灵活</text>
  <text x="130" y="606" fill="#6e7681" font-size="12">低效率 · 低灵活</text>
  <text x="910" y="606" fill="#6e7681" font-size="12" text-anchor="end">低效率 · 高灵活</text>

  <!-- 节点：BERT -->
  <circle cx="250" cy="220" r="12" fill="#bc8cff"/>
  <text x="250" y="190" fill="#bc8cff" font-size="16" font-weight="600" text-anchor="middle">传统判别模型</text>
  <text x="250" y="252" fill="#8b949e" font-size="12" text-anchor="middle">BERT / DeBERTa</text>
  <text x="250" y="272" fill="#8b949e" font-size="12" text-anchor="middle">快，但标签固定需重训</text>

  <!-- 节点：LLM -->
  <circle cx="790" cy="520" r="12" fill="#d29922"/>
  <text x="790" y="558" fill="#d29922" font-size="16" font-weight="600" text-anchor="middle">生成式大模型</text>
  <text x="790" y="580" fill="#8b949e" font-size="12" text-anchor="middle">GPT / Claude / 千问</text>
  <text x="790" y="600" fill="#8b949e" font-size="12" text-anchor="middle">灵活，但自回归慢且贵</text>

  <!-- 节点：Jev -->
  <circle cx="790" cy="220" r="14" fill="#3fb950"/>
  <circle cx="790" cy="220" r="22" fill="none" stroke="#3fb950" stroke-width="1" opacity="0.45"/>
  <text x="790" y="186" fill="#3fb950" font-size="18" font-weight="700" text-anchor="middle">Jev（System 1）</text>
  <text x="790" y="256" fill="#8b949e" font-size="12" text-anchor="middle">70–500ms · $0.042/1M 输入</text>
  <text x="790" y="276" fill="#8b949e" font-size="12" text-anchor="middle">现场 schema + 校准概率</text>

  <!-- 演进箭头 BERT -> Jev, LLM -> Jev -->
  <path d="M 268 226 Q 500 150 766 212" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <path d="M 776 500 Q 740 360 782 248" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- 三张 info card -->
  <g>
    <rect x="60" y="700" width="346" height="92" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="80" y="728" fill="#58a6ff" font-size="13" font-weight="600">定位</text>
    <text x="80" y="752" fill="#e6edf3" font-size="12">机器对机器的「智能 if 语句」</text>
    <text x="80" y="774" fill="#8b949e" font-size="12">不聊天不解释，只输出有界决策</text>
  </g>
  <g>
    <rect x="427" y="700" width="346" height="92" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="447" y="728" fill="#58a6ff" font-size="13" font-weight="600">能力范围</text>
    <text x="447" y="752" fill="#e6edf3" font-size="12">System 1 只是 System 2 的子集</text>
    <text x="447" y="774" fill="#8b949e" font-size="12">大模型能做判断题，反之不成立</text>
  </g>
  <g>
    <rect x="794" y="700" width="346" height="92" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="814" y="728" fill="#58a6ff" font-size="13" font-weight="600">命名来源</text>
    <text x="814" y="752" fill="#e6edf3" font-size="12">杰文斯悖论：成本降 → 用量涨</text>
    <text x="814" y="774" fill="#8b949e" font-size="12">把模型判断嵌进一切软件环节</text>
  </g>
</svg>
</body></html>
