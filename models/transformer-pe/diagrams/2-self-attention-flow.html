<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>图2 · 自注意力数据流</title>
<style>
html,body{margin:0;padding:0;background:#0d1117}
svg{display:block;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
</style></head><body>
<svg viewBox="0 0 1200 860" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1200" height="860" fill="#0d1117"/>
  <text x="60" y="52" fill="#e6edf3" font-size="24" font-weight="700">图 2 · 缩放点积注意力与多头机制</text>
  <text x="60" y="80" fill="#8b949e" font-size="13">每个 token 投影出 Q/K/V，两两打分后 softmax 归一化，再按权重聚合 V；多头在不同子空间并行</text>

  <!-- X -->
  <rect x="60" y="230" width="120" height="180" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="120" y="315" fill="#e6edf3" font-size="15" font-weight="700" text-anchor="middle">输入 X</text>
  <text x="120" y="340" fill="#8b949e" font-size="11" text-anchor="middle">(n, d_model)</text>

  <!-- W_Q/W_K/W_V -->
  <rect x="250" y="140" width="130" height="56" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="315" y="165" fill="#e6edf3" font-size="13" text-anchor="middle">× W_Q</text>
  <text x="315" y="184" fill="#8b949e" font-size="11" text-anchor="middle">Query 查询</text>

  <rect x="250" y="292" width="130" height="56" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="315" y="317" fill="#e6edf3" font-size="13" text-anchor="middle">× W_K</text>
  <text x="315" y="336" fill="#8b949e" font-size="11" text-anchor="middle">Key 键</text>

  <rect x="250" y="444" width="130" height="56" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="315" y="469" fill="#e6edf3" font-size="13" text-anchor="middle">× W_V</text>
  <text x="315" y="488" fill="#8b949e" font-size="11" text-anchor="middle">Value 值</text>

  <!-- MatMul QK -->
  <rect x="450" y="210" width="150" height="110" rx="8" fill="#161b22" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="525" y="250" fill="#e6edf3" font-size="13" text-anchor="middle">Q · K^T</text>
  <text x="525" y="274" fill="#8b949e" font-size="11" text-anchor="middle">两两相似度矩阵</text>
  <text x="525" y="296" fill="#8b949e" font-size="11" text-anchor="middle">(n × n)</text>

  <!-- Scale -->
  <rect x="660" y="210" width="130" height="50" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
  <text x="725" y="240" fill="#e6edf3" font-size="12" text-anchor="middle">÷ sqrt(d_k)</text>

  <!-- Mask -->
  <rect x="660" y="270" width="130" height="50" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="725" y="292" fill="#e6edf3" font-size="12" text-anchor="middle">+ Mask</text>
  <text x="725" y="309" fill="#8b949e" font-size="10" text-anchor="middle">因果 / 填充</text>

  <!-- Softmax -->
  <rect x="840" y="230" width="130" height="56" rx="8" fill="#161b22" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="905" y="255" fill="#e6edf3" font-size="13" text-anchor="middle">Softmax</text>
  <text x="905" y="274" fill="#8b949e" font-size="11" text-anchor="middle">注意力权重</text>

  <!-- MatMul V -->
  <rect x="1010" y="230" width="140" height="110" rx="8" fill="#161b22" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="1080" y="272" fill="#e6edf3" font-size="13" text-anchor="middle">权重 · V</text>
  <text x="1080" y="298" fill="#8b949e" font-size="11" text-anchor="middle">加权聚合输出</text>

  <!-- 多头说明 -->
  <rect x="450" y="400" width="700" height="150" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="470" y="430" fill="#58a6ff" font-size="14" font-weight="700">多头并行（h=8）→ 拼接 → W_O 融合</text>
  <rect x="470" y="450" width="130" height="40" rx="6" fill="#0d1117" stroke="#bc8cff"/>
  <text x="535" y="475" fill="#bc8cff" font-size="11" text-anchor="middle">head 1（句法）</text>
  <rect x="612" y="450" width="130" height="40" rx="6" fill="#0d1117" stroke="#bc8cff"/>
  <text x="677" y="475" fill="#bc8cff" font-size="11" text-anchor="middle">head 2（指代）</text>
  <rect x="754" y="450" width="130" height="40" rx="6" fill="#0d1117" stroke="#bc8cff"/>
  <text x="819" y="475" fill="#bc8cff" font-size="11" text-anchor="middle">head 3（局部）</text>
  <rect x="896" y="450" width="130" height="40" rx="6" fill="#0d1117" stroke="#bc8cff"/>
  <text x="961" y="475" fill="#bc8cff" font-size="11" text-anchor="middle">head …（其他）</text>
  <text x="470" y="524" fill="#8b949e" font-size="12">不同头在独立的低维子空间（d_k = d_model/h）关注不同类型的关系</text>

  <!-- 公式 -->
  <rect x="250" y="600" width="900" height="90" rx="10" fill="#161b22" stroke="#d29922"/>
  <text x="280" y="638" fill="#e6edf3" font-size="16" font-family="monospace">Attention(Q,K,V) = softmax( Q·K^T / sqrt(d_k) ) · V</text>
  <text x="280" y="668" fill="#8b949e" font-size="12">缩放防止点积过大把 softmax 推入梯度极小的饱和区</text>

  <!-- 连线 -->
  <path d="M180 168 L248 168" stroke="#8b949e" stroke-width="1.5"/>
  <path d="M180 320 L248 320" stroke="#8b949e" stroke-width="1.5"/>
  <path d="M180 472 L248 472" stroke="#8b949e" stroke-width="1.5"/>
  <path d="M380 168 Q430 168 450 240" fill="none" stroke="#8b949e" stroke-width="1.5"/>
  <path d="M380 320 L448 275" stroke="#8b949e" stroke-width="1.5"/>
  <path d="M600 265 L658 240" fill="none" stroke="#8b949e" stroke-width="1.5"/>
  <path d="M725 260 L725 268" stroke="#8b949e" stroke-width="1.5"/>
  <path d="M790 295 L838 265" fill="none" stroke="#8b949e" stroke-width="1.5"/>
  <path d="M970 258 L1008 265" stroke="#8b949e" stroke-width="1.5"/>
  <path d="M380 472 L400 472 L400 575 L1080 575 L1080 336" fill="none" stroke="#8b949e" stroke-width="1.2" stroke-dasharray="4 4"/>

  <!-- info cards -->
  <g>
    <rect x="60" y="770" width="346" height="72" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="80" y="796" fill="#58a6ff" font-size="13" font-weight="600">Q / K / V</text>
    <text x="80" y="820" fill="#e6edf3" font-size="12">找什么 · 提供什么 · 聚合什么</text>
  </g>
  <g>
    <rect x="427" y="770" width="346" height="72" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="447" y="796" fill="#58a6ff" font-size="13" font-weight="600">权重动态计算</text>
    <text x="447" y="820" fill="#e6edf3" font-size="12">softmax 后每行和为 1</text>
  </g>
  <g>
    <rect x="794" y="770" width="346" height="72" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="814" y="796" fill="#58a6ff" font-size="13" font-weight="600">多头 = 多副眼镜</text>
    <text x="814" y="820" fill="#e6edf3" font-size="12">同一层学到多种关系模式</text>
  </g>
</svg>
</body></html>
