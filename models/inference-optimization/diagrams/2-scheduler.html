  <text x="60" y="76" fill="#8b949e" font-size="13">调度粒度细化到每个解码步；KV 以固定块按需分配；共享前缀自动跨请求复用</text>

    <rect x="864" y="505" width="78" height="44" rx="6" fill="#161b22" stroke="#30363d"/><text x="903" y="532" fill="#8b949e" font-size="10" text-anchor="middle">free</text>
