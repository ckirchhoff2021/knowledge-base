<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>diagram</title>
<style>
html,body{margin:0;padding:0;background:#0d1117}
svg{display:block;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
</style></head><body>
<svg viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg">
<rect width="1200" height="720" fill="#0d1117"/>
<defs>
<marker id="ab" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#58a6ff"/></marker>
<marker id="ag" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#3fb950"/></marker>
<marker id="ay" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#d29922"/></marker>
</defs>
<text x="50" y="42" fill="#e6edf3" font-size="22" text-anchor="start" font-weight="700">图 1 · 上下文工程在 Agent 栈中的位置与边界</text>
<text x="50" y="70" fill="#8b949e" font-size="13.5" text-anchor="start">Context Engineering 统管窗口内 token 全生命周期；Prompt Engineering 写指令，Memory 管跨时间持久化，Harness 负责装配与执行</text>

<!-- 中央 Context Window -->
<rect x="330" y="150" width="540" height="400" rx="16" fill="#0f1620" stroke="#58a6ff" stroke-width="2"/>
<text x="600" y="185" fill="#58a6ff" font-size="18" text-anchor="middle" font-weight="700">Context Window · 窗口内 token 全生命周期</text>

<!-- 5 token slots -->
<g font-size="13.5">
<rect x="355" y="205" width="490" height="58" rx="9" fill="#161b22" stroke="#30363d"/>
<text x="375" y="229" fill="#e6edf3" font-weight="700">指令 Instructions</text>
<text x="375" y="251" fill="#8b949e" font-size="12">系统提示 / 强制约束 / 输出契约（钉扎，不总结）</text>

<rect x="355" y="271" width="490" height="58" rx="9" fill="#161b22" stroke="#30363d"/>
<text x="375" y="295" fill="#e6edf3" font-weight="700">实时任务状态 Live State</text>
<text x="375" y="317" fill="#8b949e" font-size="12">案件 ID / 金额 / 上一动作（本步加载）</text>

<rect x="355" y="337" width="490" height="58" rx="9" fill="#161b22" stroke="#30363d"/>
<text x="375" y="361" fill="#e6edf3" font-weight="700">检索证据 Evidence</text>
<text x="375" y="383" fill="#8b949e" font-size="12">政策条款 + 来源 URL（决策时即时取）</text>

<rect x="355" y="403" width="490" height="58" rx="9" fill="#161b22" stroke="#30363d"/>
<text x="375" y="427" fill="#e6edf3" font-weight="700">记忆 Memory</text>
<text x="375" y="449" fill="#8b949e" font-size="12">既往承诺（按用户 / Agent / 线程 / TTL 限定）</text>

<rect x="355" y="469" width="490" height="62" rx="9" fill="#161b22" stroke="#30363d"/>
<text x="375" y="493" fill="#e6edf3" font-weight="700">工具定义 Tools</text>
<text x="375" y="515" fill="#8b949e" font-size="12">仅本步可用工具（按路由加载，非整个目录）</text>
</g>

<!-- 左 Prompt Engineering -->
<rect x="55" y="255" width="220" height="120" rx="14" fill="#1a1710" stroke="#d29922" stroke-width="1.8"/>
<text x="165" y="290" fill="#d29922" font-size="16" text-anchor="middle" font-weight="700">Prompt Engineering</text>
<text x="165" y="318" fill="#8b949e" font-size="12" text-anchor="middle">回答「指令怎么措辞」</text>
<text x="165" y="342" fill="#8b949e" font-size="12" text-anchor="middle">是上下文工程的一个子集</text>
<path d="M278,315 L348,315" stroke="#d29922" stroke-width="3" marker-end="url(#ay)"/>

<!-- 右 Harness -->
<rect x="925" y="255" width="220" height="120" rx="14" fill="#101813" stroke="#3fb950" stroke-width="1.8"/>
<text x="1035" y="290" fill="#3fb950" font-size="16" text-anchor="middle" font-weight="700">Agent Harness</text>
<text x="1035" y="318" fill="#8b949e" font-size="12" text-anchor="middle">装配 / 控制流 / 压缩触发</text>
<text x="1035" y="342" fill="#8b949e" font-size="12" text-anchor="middle">执行上下文工程策略的「壳」</text>
<path d="M872,315 L917,315" stroke="#3fb950" stroke-width="3" marker-end="url(#ag)"/>

<!-- 下 Memory subsystem -->
<rect x="490" y="595" width="220" height="92" rx="14" fill="#151320" stroke="#bc8cff" stroke-width="1.8"/>
<text x="600" y="628" fill="#bc8cff" font-size="16" text-anchor="middle" font-weight="700">Memory 子系统</text>
<text x="600" y="654" fill="#8b949e" font-size="12" text-anchor="middle">跨会话 / 跨压缩的持久化与召回</text>
<text x="600" y="676" fill="#8b949e" font-size="12" text-anchor="middle">上下文工程的下层组件</text>
<path d="M600,588 L600,556" stroke="#bc8cff" stroke-width="3" marker-end="url(#ab)"/>
</svg>
</body></html>
