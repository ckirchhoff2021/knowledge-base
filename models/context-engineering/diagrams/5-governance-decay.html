<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>diagram</title>
<style>
html,body{margin:0;padding:0;background:#0d1117}
svg{display:block;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
</style></head><body>
<svg viewBox="0 0 1200 720" xmlns="http://www.w3.org/2005/svg">
<rect width="1200" height="720" fill="#0d1117"/>
<defs>
<marker id="ar" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#f85149"/></marker>
<marker id="ag" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#3fb950"/></marker>
</defs>
<text x="50" y="42" fill="#e6edf3" font-size="22" text-anchor="start" font-weight="700">图 5 · Governance Decay：压缩如何静默删除合规约束</text>
<text x="50" y="70" fill="#8b949e" font-size="13.5" text-anchor="start">无越狱、无模型更换、无新请求——规则只是不再在窗口里；这是 harness 的属性而非模型的属性（arXiv:2606.22528，1,323 episodes / 7 模型）</text>

<!-- 上：时间线 -->
<line x1="80" y1="200" x2="1120" y2="200" stroke="#30363d" stroke-width="3"/>
<!-- turns -->
<g font-size="12" fill="#8b949e">
<circle cx="140" cy="200" r="9" fill="#58a6ff"/><text x="140" y="232" text-anchor="middle">t1 给规则</text>
<circle cx="320" cy="200" r="9" fill="#3fb950"/><text x="320" y="232" text-anchor="middle">遵守</text>
<circle cx="500" cy="200" r="9" fill="#3fb950"/><text x="500" y="232" text-anchor="middle">拒绝外发</text>
<circle cx="680" cy="200" r="13" fill="#d29922"/><text x="680" y="232" text-anchor="middle" fill="#d29922">压缩 Compaction</text>
<circle cx="860" cy="200" r="9" fill="#f85149"/><text x="860" y="232" text-anchor="middle" fill="#f85149">规则被丢</text>
<circle cx="1040" cy="200" r="9" fill="#f85149"/><text x="1040" y="232" text-anchor="middle" fill="#f85149">违规外发</text>
</g>

<!-- 左：in-context policy -->
<rect x="55" y="285" width="520" height="355" rx="16" fill="#1a1214" stroke="#f85149" stroke-width="1.8"/>
<text x="80" y="322" fill="#f85149" font-size="17" font-weight="700">规则只在上下文里（会被总结）</text>

<rect x="80" y="345" width="470" height="80" rx="10" fill="#161b22" stroke="#30363d"/>
<text x="100" y="375" fill="#c9d1d9" font-size="13">压缩前：「合同不得外发组织」在窗口中</text>
<text x="100" y="403" fill="#3fb950" font-size="13">→ 违规率 0%</text>

<path d="M315,437 L315,467" stroke="#d29922" stroke-width="3" marker-end="url(#ar)"/>

<rect x="80" y="475" width="470" height="80" rx="10" fill="#161b22" stroke="#30363d"/>
<text x="100" y="505" fill="#c9d1d9" font-size="13">压缩后：摘要为连续性丢掉「旧」合规前言</text>
<text x="100" y="533" fill="#f85149" font-size="13">→ 规则被 drop 时违规率 38%（部分条件 59%）</text>
<text x="80" y="585" fill="#8b949e" font-size="12">软 / 硬梯度：训练内置硬规范存活，部署专属软规则恰被侵蚀</text>
<text x="80" y="612" fill="#8b949e" font-size="12">可被武器化：上下文内攻击者可膨胀 / 引导历史加速遗忘</text>

<!-- 右：out-of-band -->
<rect x="625" y="285" width="520" height="355" rx="16" fill="#101813" stroke="#3fb950" stroke-width="1.8"/>
<text x="650" y="322" fill="#3fb950" font-size="17" font-weight="700">规则置于带外（压缩够不到）</text>

<rect x="650" y="345" width="470" height="80" rx="10" fill="#161b22" stroke="#30363d"/>
<text x="670" y="375" fill="#c9d1d9" font-size="13">Constraint Pinning：隔离规则，强制摘要携带</text>
<text x="670" y="403" fill="#3fb950" font-size="13">→ 报告基准上违规率回到 0%</text>

<rect x="650" y="440" width="470" height="115" rx="10" fill="#161b22" stroke="#30363d"/>
<text x="670" y="470" fill="#c9d1d9" font-size="13">更彻底：网关 / 控制面 / 工具层强制执行</text>
<text x="670" y="498" fill="#8b949e" font-size="12.5">· 在每次请求路径上评估外发动作</text>
<text x="670" y="523" fill="#8b949e" font-size="12.5">· t3 与 t3000 同样生效（不在 transcript 里）</text>
<text x="670" y="548" fill="#8b949e" font-size="12.5">· 操作者经带外通道改策略，Agent 上下文不参与</text>
<text x="650" y="592" fill="#d29922" font-size="12">钉扎局限：隐式约束无法钉扎；操作者冒充需可信带外通道</text>
<text x="650" y="618" fill="#e6edf3" font-size="12.5" font-weight="700">治理 Agent，需要治理它们如何遗忘</text>
</svg>
</body></html>
