<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>图2 · Jev 判别架构与候选头数据流</title>
<style>
html,body{margin:0;padding:0;background:#0d1117}
svg{display:block;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
</style></head><body>
<svg viewBox="0 0 1200 880" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1200" height="880" fill="#0d1117"/>
  <text x="60" y="48" fill="#e6edf3" font-size="24" font-weight="700">图 2 · 统一判别架构：因果路径编码 → 置换等变候选头 → 每题 softmax</text>
  <text x="60" y="76" fill="#8b949e" font-size="13">三种原语共用同一个标量打分头，不存在按类型切换的分类头；类型差异仅在候选数、评测指标与校准温度</text>

  <!-- input -->
  <rect x="60" y="110" width="220" height="150" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="170" y="136" fill="#58a6ff" font-size="14" font-weight="700" text-anchor="middle">结构化请求 x=(s,a,C)</text>
  <text x="76" y="164" fill="#c9d1d9" font-size="11.5">s  state：diff/trace/JSON</text>
  <text x="76" y="186" fill="#c9d1d9" font-size="11.5">a  question + 判定标准</text>
  <text x="76" y="208" fill="#c9d1d9" font-size="11.5">C  候选 2–255 个，互异</text>
  <text x="76" y="234" fill="#f85149" font-size="10.5">问题 ID 只用于回填，不进模型</text>
  <text x="76" y="252" fill="#f85149" font-size="10.5">&gt;2048 token 直接拒绝，不截断</text>

  <!-- path encoding -->
  <rect x="330" y="100" width="300" height="180" rx="10" fill="#161b22" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="480" y="126" fill="#bc8cff" font-size="14" font-weight="700" text-anchor="middle">K 条独立因果路径</text>
  <rect x="350" y="142" width="260" height="30" rx="6" fill="#0a0e14" stroke="#30363d"/>
  <text x="480" y="162" fill="#9ecbff" font-size="11.5" text-anchor="middle" font-family="monospace">[STATE] s</text>
  <rect x="350" y="178" width="260" height="30" rx="6" fill="#0a0e14" stroke="#30363d"/>
  <text x="480" y="198" fill="#9ecbff" font-size="11.5" text-anchor="middle" font-family="monospace">[STATE] s [QUESTION] a</text>
  <rect x="350" y="214" width="260" height="52" rx="6" fill="#0a0e14" stroke="#bc8cff" stroke-width="1.3"/>
  <text x="480" y="234" fill="#e6edf3" font-size="11.5" text-anchor="middle" font-family="monospace">[STATE]s [QUESTION]a [CANDIDATE]c_k</text>
  <text x="480" y="255" fill="#8b949e" font-size="10.5" text-anchor="middle">取候选最后一个有效 token 的隐状态 h_k</text>

  <!-- tree variant note -->
  <rect x="330" y="292" width="300" height="56" rx="8" fill="#0a0e14" stroke="#d29922" stroke-dasharray="4 3"/>
  <text x="480" y="314" fill="#d29922" font-size="11" font-weight="700" text-anchor="middle">10 月 TreeEncoder（共享前缀）</text>
  <text x="480" y="334" fill="#8b949e" font-size="10.5" text-anchor="middle">state 只编码一次 · 祖先注意力 · 训练 3.69×</text>

  <!-- backbone -->
  <rect x="680" y="120" width="210" height="120" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="785" y="148" fill="#3fb950" font-size="14" font-weight="700" text-anchor="middle">骨干（去 LM 头）</text>
  <text x="785" y="174" fill="#c9d1d9" font-size="11.5" text-anchor="middle">Qwen3-0.6B（因果）</text>
  <text x="785" y="196" fill="#c9d1d9" font-size="11.5" text-anchor="middle">或 ModernBERT-large（双向）</text>
  <text x="785" y="222" fill="#8b949e" font-size="10.5" text-anchor="middle">隐状态 → 候选向量，不投影词表</text>

  <!-- candidate head -->
  <rect x="940" y="96" width="220" height="240" rx="10" fill="#161b22" stroke="#39c5cf" stroke-width="1.5"/>
  <text x="1050" y="122" fill="#39c5cf" font-size="14" font-weight="700" text-anchor="middle">置换等变候选头</text>
  <text x="1050" y="150" fill="#c9d1d9" font-size="11" text-anchor="middle" font-family="monospace">[K,1024]</text>
  <text x="1050" y="172" fill="#9ecbff" font-size="11" text-anchor="middle">Linear 1024→256</text>
  <text x="1050" y="194" fill="#9ecbff" font-size="11" text-anchor="middle">2 层集合 Transformer</text>
  <text x="1050" y="212" fill="#f85149" font-size="10.5" text-anchor="middle">无位置编码 ⇒ 顺序无关</text>
  <text x="1050" y="234" fill="#9ecbff" font-size="11" text-anchor="middle">Linear 256→1024 + 残差</text>
  <text x="1050" y="256" fill="#9ecbff" font-size="11" text-anchor="middle">RMSNorm→256→SiLU→1</text>
  <text x="1050" y="282" fill="#c9d1d9" font-size="11" text-anchor="middle" font-family="monospace">z_1 … z_K（每候选一标量）</text>
  <text x="1050" y="310" fill="#8b949e" font-size="10.5" text-anchor="middle">无效候选 mask -1e4</text>

  <!-- arrows -->
  <g stroke="#8b949e" stroke-width="1.6" fill="none" marker-end="url(#arr)">
    <path d="M280,185 L328,185"/>
    <path d="M630,185 L678,185"/>
    <path d="M890,185 L938,185"/>
  </g>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- softmax -->
  <rect x="380" y="400" width="440" height="86" rx="10" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
  <text x="600" y="428" fill="#d29922" font-size="14" font-weight="700" text-anchor="middle">每个问题内 softmax（候选间归一化）</text>
  <text x="600" y="452" fill="#c9d1d9" font-size="11.5" text-anchor="middle" font-family="monospace">p_k = exp(z_k / t_type) / Σ_j exp(z_j / t_type)</text>
  <text x="600" y="474" fill="#8b949e" font-size="10.5" text-anchor="middle">t_type：boolean/choice/score 各一个温度，仅在独立校准集拟合</text>
  <g stroke="#8b949e" stroke-width="1.6" fill="none" marker-end="url(#arr)">
    <path d="M1050,336 L1050,378 L600,378 L600,398"/>
  </g>

  <!-- three outputs -->
  <rect x="60" y="540" width="340" height="150" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.4"/>
  <text x="230" y="568" fill="#58a6ff" font-size="13.5" font-weight="700" text-anchor="middle">boolean / noul（K=2）</text>
  <text x="78" y="596" fill="#c9d1d9" font-size="11.5">value = P(true) ≥ 0.5</text>
  <text x="78" y="620" fill="#c9d1d9" font-size="11.5">输出两端概率</text>
  <text x="78" y="648" fill="#3fb950" font-size="11">用途：门禁 / 过滤 / 验证</text>
  <text x="78" y="672" fill="#8b949e" font-size="10.5">v1 实测准确率 88.83%</text>

  <rect x="430" y="540" width="340" height="150" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.4"/>
  <text x="600" y="568" fill="#3fb950" font-size="13.5" font-weight="700" text-anchor="middle">choice（2–255）</text>
  <text x="448" y="596" fill="#c9d1d9" font-size="11.5">value + 全分布</text>
  <text x="448" y="620" fill="#c9d1d9" font-size="11.5">top_probability + margin（次优差）</text>
  <text x="448" y="648" fill="#3fb950" font-size="11">用途：路由 / 工具选择 / 分类</text>
  <text x="448" y="672" fill="#8b949e" font-size="10.5">v1 实测准确率 75.33%</text>

  <rect x="800" y="540" width="340" height="150" rx="10" fill="#161b22" stroke="#bc8cff" stroke-width="1.4"/>
  <text x="970" y="568" fill="#bc8cff" font-size="13.5" font-weight="700" text-anchor="middle">score（2–10 有序级）</text>
  <text x="818" y="596" fill="#c9d1d9" font-size="11.5">level = argmax</text>
  <text x="818" y="620" fill="#c9d1d9" font-size="11.5">score = Σ i·P_i（期望等级）</text>
  <text x="818" y="648" fill="#3fb950" font-size="11">用途：风险分级 / 质量评分</text>
  <text x="818" y="672" fill="#8b949e" font-size="10.5">v1 实测准确率 75.00% · MAE 0.21</text>

  <g stroke="#8b949e" stroke-width="1.4" fill="none" marker-end="url(#arr)">
    <path d="M500,486 L250,538"/><path d="M600,486 L600,538"/><path d="M700,486 L950,538"/>
  </g>

  <!-- info cards -->
  <g>
    <rect x="60" y="720" width="340" height="118" rx="10" fill="#0a0e14" stroke="#30363d"/>
    <text x="78" y="746" fill="#3fb950" font-size="12.5" font-weight="700">零输出 token</text>
    <text x="78" y="770" fill="#c9d1d9" font-size="11">隐状态→标量 logit，无词表投影</text>
    <text x="78" y="792" fill="#c9d1d9" font-size="11">没有 JSON 修复环节，类型 100% 合法</text>
    <text x="78" y="816" fill="#8b949e" font-size="10.5">v1 单前向 ~50ms，生成 token 数为 0</text>
  </g>
  <g>
    <rect x="430" y="720" width="340" height="118" rx="10" fill="#0a0e14" stroke="#30363d"/>
    <text x="448" y="746" fill="#bc8cff" font-size="12.5" font-weight="700">置换等变 + 排列正则</text>
    <text x="448" y="770" fill="#c9d1d9" font-size="11">打乱候选，输出同步打乱</text>
    <text x="448" y="792" fill="#c9d1d9" font-size="11">perm_reg：重跑对齐，两路 KL≈0</text>
    <text x="448" y="816" fill="#8b949e" font-size="10.5">防止选项位置夹带排名信息</text>
  </g>
  <g>
    <rect x="800" y="720" width="340" height="118" rx="10" fill="#0a0e14" stroke="#30363d"/>
    <text x="818" y="746" fill="#d29922" font-size="12.5" font-weight="700">一套头 · 三种题</text>
    <text x="818" y="770" fill="#c9d1d9" font-size="11">不按类型切换分类头</text>
    <text x="818" y="792" fill="#c9d1d9" font-size="11">差异仅在候选数/指标/温度</text>
    <text x="818" y="816" fill="#8b949e" font-size="10.5">温度必须在独立校准集拟合</text>
  </g>
</svg>
</body></html>
