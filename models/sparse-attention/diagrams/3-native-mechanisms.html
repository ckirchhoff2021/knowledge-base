<svg viewBox="0 0 1200 920" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="920" fill="#0d1117"/>
  <text x="60" y="46" fill="#e6edf3" font-size="24" font-weight="700">图 3 · 四大原生稀疏机制：分支结构、选择粒度与关键预算</text>
  <text x="60" y="74" fill="#8b949e" font-size="13">共同点：保留 Softmax、选择可学习/可训练、从预训练起稀疏；差异在「用几条分支、按什么粒度选」</text>

  <!-- ============ NSA ============ -->
  <rect x="40" y="96" width="560" height="380" rx="12" fill="#161b22" stroke="#f85149" stroke-width="1.7"/>
  <rect x="40" y="96" width="560" height="38" rx="12" fill="#f85149" opacity="0.13"/>
  <text x="60" y="122" fill="#f85149" font-size="16" font-weight="700">NSA · DeepSeek（三分支 + 可学习门控）</text>
  <!-- history blocks -->
  <g font-size="10" fill="#9ecbff">
    <rect x="60" y="156" width="40" height="26" rx="4" fill="#21304a" stroke="#58a6ff"/><text x="80" y="173" text-anchor="middle">K₁</text>
    <rect x="104" y="156" width="40" height="26" rx="4" fill="#21304a" stroke="#58a6ff"/><text x="124" y="173" text-anchor="middle">K₂</text>
    <rect x="148" y="156" width="40" height="26" rx="4" fill="#21304a" stroke="#58a6ff"/><text x="168" y="173" text-anchor="middle">K₃</text>
    <text x="205" y="173" fill="#8b949e">···</text>
    <rect x="225" y="156" width="40" height="26" rx="4" fill="#21304a" stroke="#58a6ff"/><text x="245" y="173" text-anchor="middle">Kₘ</text>
    <text x="300" y="173" fill="#8b949e" font-size="11">历史块（l=32 压缩 / l′=64 选择）</text>
  </g>
  <!-- three branches -->
  <rect x="60" y="206" width="160" height="92" rx="8" fill="#2a1a1a" stroke="#f85149"/>
  <text x="140" y="232" fill="#e6edf3" font-size="12.5" font-weight="700" text-anchor="middle">压缩分支</text>
  <text x="140" y="254" fill="#8b949e" font-size="11" text-anchor="middle">块→摘要 token</text>
  <text x="140" y="274" fill="#8b949e" font-size="11" text-anchor="middle">粗看全局大意</text>
  <rect x="234" y="206" width="160" height="92" rx="8" fill="#2a1a1a" stroke="#f85149"/>
  <text x="314" y="232" fill="#e6edf3" font-size="12.5" font-weight="700" text-anchor="middle">选择分支</text>
  <text x="314" y="254" fill="#8b949e" font-size="11" text-anchor="middle">top n=16 块</text>
  <text x="314" y="274" fill="#8b949e" font-size="11" text-anchor="middle">精看重点（含1初始2局部）</text>
  <rect x="408" y="206" width="160" height="92" rx="8" fill="#2a1a1a" stroke="#f85149"/>
  <text x="488" y="232" fill="#e6edf3" font-size="12.5" font-weight="700" text-anchor="middle">滑窗分支</text>
  <text x="488" y="254" fill="#8b949e" font-size="11" text-anchor="middle">w=512，步长 d=16</text>
  <text x="488" y="274" fill="#8b949e" font-size="11" text-anchor="middle">细看近邻</text>
  <path d="M140,300 L300,332 M314,300 L300,332 M488,300 L300,332" stroke="#f85149" stroke-width="1.5"/>
  <rect x="200" y="330" width="200" height="34" rx="8" fill="#3d1d1d" stroke="#f85149" stroke-width="1.5"/>
  <text x="300" y="352" fill="#ffb3ae" font-size="12.5" text-anchor="middle" font-weight="700">可学习门控加权融合</text>
  <text x="60" y="400" fill="#3fb950" font-size="12">• 硬件对齐 Triton 内核，算术强度平衡，GQA 组内并集优化</text>
  <text x="60" y="426" fill="#3fb950" font-size="12">• 27B/260B token 原生预训练，通用+长文+推理持平或超过全注意力</text>
  <text x="60" y="452" fill="#d29922" font-size="12">• 64k：前向 9.0× / 后向 6.0×（论文口径）</text>

  <!-- ============ MoBA ============ -->
  <rect x="620" y="96" width="540" height="380" rx="12" fill="#161b22" stroke="#bc8cff" stroke-width="1.7"/>
  <rect x="620" y="96" width="540" height="38" rx="12" fill="#bc8cff" opacity="0.13"/>
  <text x="640" y="122" fill="#bc8cff" font-size="16" font-weight="700">MoBA · Moonshot（MoE 式无参数块路由）</text>
  <g font-size="10">
    <rect x="640" y="160" width="70" height="30" rx="4" fill="#2a2140" stroke="#bc8cff"/><text x="675" y="179" fill="#d8c4ff" text-anchor="middle">块1</text>
    <rect x="718" y="160" width="70" height="30" rx="4" fill="#163020" stroke="#3fb950" stroke-width="1.6"/><text x="753" y="179" fill="#7ee787" text-anchor="middle">块2 ✓</text>
    <rect x="796" y="160" width="70" height="30" rx="4" fill="#2a2140" stroke="#bc8cff"/><text x="831" y="179" fill="#d8c4ff" text-anchor="middle">块3</text>
    <rect x="874" y="160" width="70" height="30" rx="4" fill="#163020" stroke="#3fb950" stroke-width="1.6"/><text x="909" y="179" fill="#7ee787" text-anchor="middle">块k ✓</text>
    <rect x="952" y="160" width="70" height="30" rx="4" fill="#2a2140" stroke="#bc8cff"/><text x="987" y="179" fill="#d8c4ff" text-anchor="middle">块n</text>
    <rect x="1038" y="160" width="100" height="30" rx="4" fill="#3d2b14" stroke="#d29922"/><text x="1088" y="179" fill="#e3b341" text-anchor="middle">当前块*</text>
  </g>
  <text x="640" y="222" fill="#8b949e" font-size="11.5">query 与每块代表向量算相关（无参数门控）→ top-k；当前块需因果掩码</text>
  <path d="M753,192 L753,232 M909,192 L909,232" stroke="#3fb950" stroke-width="1.6"/>
  <rect x="660" y="232" width="340" height="40" rx="8" fill="#241a38" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="830" y="257" fill="#d8c4ff" font-size="12.5" text-anchor="middle" font-weight="700">仅对选中块做精确 Softmax</text>
  <text x="640" y="306" fill="#3fb950" font-size="12">• 「less structure」：无位置先验，模型自主决定看哪里</text>
  <text x="640" y="332" fill="#3fb950" font-size="12">• 全/稀疏注意力无缝切换（共享权重），已上线支撑 Kimi</text>
  <text x="640" y="358" fill="#d29922" font-size="12">• 1M：块 4096 × top-12 → 稀疏 95.31%；prefill 6.5×（论文口径）</text>
  <text x="640" y="384" fill="#8b949e" font-size="11.5">• 可缩放至 10M（固定 64 块、top-k=3，变块大小）</text>
  <text x="640" y="446" fill="#8b949e" font-size="11">*当前块 mean pooling 会窥见未来，须特殊因果处理</text>

  <!-- ============ MSA ============ -->
  <rect x="40" y="500" width="560" height="380" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="1.7"/>
  <rect x="40" y="500" width="560" height="38" rx="12" fill="#3fb950" opacity="0.13"/>
  <text x="60" y="526" fill="#3fb950" font-size="16" font-weight="700">MSA · MiniMax（双分支，固定 2048 预算）</text>
  <g font-size="10">
    <rect x="60" y="566" width="60" height="28" rx="4" fill="#21304a" stroke="#58a6ff"/><text x="90" y="584" fill="#9ecbff" text-anchor="middle">块128</text>
    <rect x="126" y="566" width="60" height="28" rx="4" fill="#21304a" stroke="#58a6ff"/><text x="156" y="584" fill="#9ecbff" text-anchor="middle">块128</text>
    <text x="210" y="584" fill="#8b949e">···</text>
    <rect x="232" y="566" width="60" height="28" rx="4" fill="#21304a" stroke="#58a6ff"/><text x="262" y="584" fill="#9ecbff" text-anchor="middle">块128</text>
    <text x="330" y="584" fill="#8b949e" font-size="11">未压缩 KV（全精度）</text>
  </g>
  <rect x="60" y="614" width="250" height="70" rx="8" fill="#163020" stroke="#3fb950"/>
  <text x="185" y="640" fill="#7ee787" font-size="13" font-weight="700" text-anchor="middle">索引分支（轻量）</text>
  <text x="185" y="662" fill="#8b949e" font-size="11" text-anchor="middle">每 query 选 top-16 块（KL 对齐训练）</text>
  <rect x="330" y="614" width="250" height="70" rx="8" fill="#12261a" stroke="#3fb950" stroke-width="1.6"/>
  <text x="455" y="640" fill="#7ee787" font-size="13" font-weight="700" text-anchor="middle">主分支（精确）</text>
  <text x="455" y="662" fill="#8b949e" font-size="11" text-anchor="middle">仅在 16 块上跑全精度 Softmax</text>
  <path d="M310,649 L328,649" stroke="#3fb950" stroke-width="2" marker-end="url(#arG)"/>
  <rect x="120" y="706" width="400" height="36" rx="8" fill="#14301f" stroke="#3fb950" stroke-width="1.5"/>
  <text x="320" y="729" fill="#7ee787" font-size="12.5" text-anchor="middle" font-weight="700">注意力预算恒定 = 16 × 128 = 2048 token（10K 与 1M 相同）</text>
  <text x="60" y="776" fill="#3fb950" font-size="12">• 不近似注意力，只在精选子集上精确计算；KV-outer gather 连续访存</text>
  <text x="60" y="802" fill="#3fb950" font-size="12">• 109B/3T token 验证模型追平 GQA；内核比开源方案快约 4×（媒体口径）</text>
  <text x="60" y="828" fill="#d29922" font-size="12">• 1M 注意力计算 −28.4×（厂商口径）；未压缩 KV，检索保真度高于 MLA</text>
  <text x="60" y="858" fill="#8b949e" font-size="11">搭载于 MiniMax M3（428B MoE / 23B 激活 / 1M，2026-06）</text>

  <!-- ============ CSA2 ============ -->
  <rect x="620" y="500" width="540" height="380" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="1.7"/>
  <rect x="620" y="500" width="540" height="38" rx="12" fill="#58a6ff" opacity="0.13"/>
  <text x="640" y="526" fill="#58a6ff" font-size="16" font-weight="700">CSA2 · DeepSeek-V4.1-Flash（稀疏 × 跨层复用 × FP4）</text>
  <!-- CED -->
  <rect x="640" y="558" width="240" height="64" rx="8" fill="#182338" stroke="#58a6ff"/>
  <text x="760" y="584" fill="#9ecbff" font-size="12.5" font-weight="700" text-anchor="middle">CED 非对称架构</text>
  <text x="760" y="606" fill="#8b949e" font-size="11" text-anchor="middle">20 层因果编码器 + 20 层解码器</text>
  <text x="640" y="648" fill="#8b949e" font-size="11.5">decode 激活 16B / prefill 仅激活 8B（552B MoE，1M 上下文）</text>
  <!-- three levers -->
  <rect x="640" y="668" width="160" height="74" rx="8" fill="#163020" stroke="#3fb950"/>
  <text x="720" y="694" fill="#7ee787" font-size="12" font-weight="700" text-anchor="middle">① 稀疏注意力</text>
  <text x="720" y="716" fill="#8b949e" font-size="10.5" text-anchor="middle">压缩稀疏 CSA2</text>
  <text x="720" y="733" fill="#8b949e" font-size="10.5" text-anchor="middle">省算力</text>
  <rect x="810" y="668" width="160" height="74" rx="8" fill="#182338" stroke="#58a6ff"/>
  <text x="890" y="694" fill="#9ecbff" font-size="12" font-weight="700" text-anchor="middle">② 跨层 KV 复用</text>
  <text x="890" y="716" fill="#8b949e" font-size="10.5" text-anchor="middle">相邻层共享 KV</text>
  <text x="890" y="733" fill="#8b949e" font-size="10.5" text-anchor="middle">省显存</text>
  <rect x="980" y="668" width="160" height="74" rx="8" fill="#2a2415" stroke="#d29922"/>
  <text x="1060" y="694" fill="#e3b341" font-size="12" font-weight="700" text-anchor="middle">③ FP4 KV 缓存</text>
  <text x="1060" y="716" fill="#8b949e" font-size="10.5" text-anchor="middle">低比特 + SWA</text>
  <text x="1060" y="733" fill="#8b949e" font-size="10.5" text-anchor="middle">Bounded Replay</text>
  <line x1="640" y1="766" x2="1140" y2="766" stroke="#30363d"/>
  <text x="640" y="796" fill="#3fb950" font-size="12.5" font-weight="700">全局 KV（常驻 HBM）：890 字节/token ≈ V4-Flash 的 1/4</text>
  <text x="640" y="824" fill="#3fb950" font-size="12.5" font-weight="700">持久 KV（SSD/主机内存）：≈ V4-Flash 的 1/8</text>
  <text x="640" y="856" fill="#8b949e" font-size="11">三笔账一起算：稀疏（算力）+ 复用与 FP4（显存），性能反超基线（厂商口径）</text>
