<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect width="1000" height="640" fill="#0d1117"/>
  <text x="500" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#e6edf3">机制可解释性方法论全景</text>
  <text x="500" y="74" text-anchor="middle" font-size="14" fill="#8b949e">显微镜 × 解剖刀 × 数学公理 → 从行为黑箱到可读计算图</text>

  <!-- 中心：神经网络 -->
  <g filter="url(#rough)">
    <rect x="380" y="270" width="240" height="100" rx="10" fill="#161b22" stroke="#e6edf3" stroke-width="2"/>
  </g>
  <text x="500" y="312" text-anchor="middle" font-size="18" font-weight="700" fill="#e6edf3">Transformer</text>
  <text x="500" y="338" text-anchor="middle" font-size="13" fill="#8b949e">注意力头 · MLP · 残差流</text>
  <text x="500" y="358" text-anchor="middle" font-size="12" fill="#f0b429">特征被「叠加」压缩</text>

  <!-- 三大工具族 -->
  <g filter="url(#rough)">
    <rect x="60" y="130" width="250" height="120" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <rect x="690" y="130" width="250" height="120" rx="10" fill="#161b22" stroke="#7ee787" stroke-width="2"/>
    <rect x="375" y="470" width="250" height="120" rx="10" fill="#161b22" stroke="#ff7b72" stroke-width="2"/>
  </g>

  <text x="185" y="162" text-anchor="middle" font-size="16" font-weight="700" fill="#58a6ff">🔬 显微镜：观测</text>
  <text x="185" y="190" text-anchor="middle" font-size="13" fill="#c9d1d9">稀疏自编码器 SAE / Transcoder</text>
  <text x="185" y="212" text-anchor="middle" font-size="13" fill="#c9d1d9">Logit / Tuned Lens · 线性探针</text>
  <text x="185" y="234" text-anchor="middle" font-size="12" fill="#8b949e">把重叠方向拆成可读特征</text>

  <text x="815" y="162" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee787">🔪 解剖刀：因果干预</text>
  <text x="815" y="190" text-anchor="middle" font-size="13" fill="#c9d1d9">激活修补 / Path Patching</text>
  <text x="815" y="212" text-anchor="middle" font-size="13" fill="#c9d1d9">消融 · ACDC · AtP / AtP*</text>
  <text x="815" y="234" text-anchor="middle" font-size="12" fill="#8b949e">检验「谁在因果上驱动行为」</text>

  <text x="500" y="502" text-anchor="middle" font-size="16" font-weight="700" fill="#ff7b72">📐 数学公理：因果抽象</text>
  <text x="500" y="530" text-anchor="middle" font-size="13" fill="#c9d1d9">Causal Abstraction · DAS</text>
  <text x="500" y="552" text-anchor="middle" font-size="13" fill="#c9d1d9">QK / OV 电路分解</text>
  <text x="500" y="574" text-anchor="middle" font-size="12" fill="#8b949e">为「特征 / 电路」给出形式化定义</text>

  <!-- 连线 -->
  <g stroke="#8b949e" stroke-width="1.6" fill="none" marker-end="url(#arr)">
    <path d="M310,210 C350,230 350,280 378,300"/>
    <path d="M690,210 C650,230 650,280 622,300"/>
    <path d="M500,372 C500,410 500,430 500,468"/>
  </g>

  <!-- 产出 -->
  <g filter="url(#rough)">
    <rect x="60" y="470" width="250" height="120" rx="10" fill="#0f2417" stroke="#7ee787" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="690" y="470" width="250" height="120" rx="10" fill="#0f2417" stroke="#7ee787" stroke-width="2" stroke-dasharray="6 4"/>
  </g>
  <text x="185" y="510" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee787">可读电路 / 计算图</text>
  <text x="185" y="538" text-anchor="middle" font-size="12" fill="#c9d1d9">IOI：26 头 7 类功能</text>
  <text x="185" y="560" text-anchor="middle" font-size="12" fill="#c9d1d9">Circuit Tracing 端到端图</text>

  <text x="815" y="510" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee787">安全监控与干预</text>
  <text x="815" y="538" text-anchor="middle" font-size="12" fill="#c9d1d9">欺骗 / 隐瞒 / 评估意识特征</text>
  <text x="815" y="560" text-anchor="middle" font-size="12" fill="#c9d1d9">激活引导 · 熔断 · 审计取证</text>

  <g stroke="#7ee787" stroke-width="1.4" fill="none" marker-end="url(#arr)" stroke-dasharray="5 4">
    <path d="M420,400 C320,430 260,440 200,468"/>
    <path d="M580,400 C680,430 740,440 800,468"/>
  </g>

  <text x="500" y="620" text-anchor="middle" font-size="11" fill="#6e7681">忠实性 · 完备性 · 最小性 —— 任何「电路声明」的三条验收标准</text>
</svg>
