<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>图3 · 五大路线二维定位</title>
<style>
html,body{margin:0;padding:0;background:#0d1117}
svg{display:block;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
</style></head><body>
<svg viewBox="0 0 1100 760" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1100" height="760" fill="#0d1117"/>
  <text x="60" y="48" fill="#e6edf3" font-size="24" font-weight="700">图 3 · 五大路线在「预测空间 × 交互实时性」坐标系上的定位</text>
  <text x="60" y="76" fill="#8b949e" font-size="13">横轴：在哪个空间做预测（越右越抽象、越接近物理因果）；纵轴：能否实时响应动作并保持长时程一致（越上越可玩、可训练智能体）</text>

  <!-- 绘图区背景 -->
  <rect x="110" y="120" width="900" height="540" fill="#0a0e14" stroke="#30363d"/>
  <!-- 网格 -->
  <g stroke="#161b22" stroke-width="1">
    <line x1="335" y1="120" x2="335" y2="660"/><line x1="560" y1="120" x2="560" y2="660"/>
    <line x1="785" y1="120" x2="785" y2="660"/>
    <line x1="110" y1="300" x2="1010" y2="300"/><line x1="110" y1="480" x2="1010" y2="480"/>
  </g>

  <!-- 坐标轴 -->
  <line x1="110" y1="660" x2="1010" y2="660" stroke="#8b949e" stroke-width="2"/>
  <line x1="110" y1="120" x2="110" y2="660" stroke="#8b949e" stroke-width="2"/>
  <polygon points="1010,660 998,654 998,666" fill="#8b949e"/>
  <polygon points="110,120 104,132 116,132" fill="#8b949e"/>

  <!-- 轴标签 -->
  <text x="560" y="700" fill="#e6edf3" font-size="14" font-weight="700" text-anchor="middle">预测空间抽象度（像素 → 视觉token → 紧凑潜状态 → 抽象嵌入 → 物理状态）</text>
  <text x="40" y="390" fill="#e6edf3" font-size="14" font-weight="700" text-anchor="middle" transform="rotate(-90 40 390)">实时交互 / 可操作性</text>
  <text x="120" y="142" fill="#3fb950" font-size="11">可实时玩 + 可训练智能体</text>
  <text x="120" y="652" fill="#8b949e" font-size="11">离线 / 被动预测</text>

  <!-- 象限淡色提示 -->
  <text x="130" y="180" fill="#3fb950" font-size="11" opacity="0.7">理想区：又抽象又可交互</text>
  <text x="820" y="640" fill="#8b949e" font-size="11" opacity="0.7">抽象但暂不可玩</text>

  <!-- 数据点：x: 像素110-335, token 335-560, 潜状态 560-785, 嵌入 560-785, 物理状态 785-1010 -->
  <!-- Sora：像素、被动（不可交互） -->
  <circle cx="200" cy="600" r="11" fill="#d29922" opacity="0.85"/>
  <text x="200" y="628" fill="#d29922" font-size="12" font-weight="700" text-anchor="middle">Sora / 视频生成</text>
  <text x="200" y="644" fill="#8b949e" font-size="10" text-anchor="middle">像素 · 无动作条件</text>

  <!-- World Models 2018 / Dreamer V1-3：潜状态、离线想象 -->
  <circle cx="620" cy="520" r="11" fill="#3fb950" opacity="0.85"/>
  <text x="620" y="548" fill="#3fb950" font-size="12" font-weight="700" text-anchor="middle">World Models / Dreamer V1–V3</text>
  <text x="620" y="564" fill="#8b949e" font-size="10" text-anchor="middle">紧凑潜状态 · 想象训练（早期非实时）</text>

  <!-- DIAMOND/GameNGen/Oasis：像素/token、实时可玩 -->
  <circle cx="330" cy="250" r="11" fill="#d29922" opacity="0.9"/>
  <text x="330" y="228" fill="#d29922" font-size="12" font-weight="700" text-anchor="middle">GameNGen / Oasis / DIAMOND</text>
  <text x="330" y="212" fill="#8b949e" font-size="10" text-anchor="middle">像素/扩散 · 实时可玩</text>

  <!-- Genie 1/2：token、可交互但短时 -->
  <circle cx="470" cy="300" r="11" fill="#d29922" opacity="0.9"/>
  <text x="470" y="330" fill="#d29922" font-size="12" font-weight="700" text-anchor="middle">Genie 1 / 2</text>
  <text x="470" y="346" fill="#8b949e" font-size="10" text-anchor="middle">视觉token · 10s–1min</text>

  <!-- Genie 3：token、实时分钟级 -->
  <circle cx="500" cy="180" r="14" fill="#f85149" opacity="0.95"/>
  <text x="500" y="156" fill="#f85149" font-size="13" font-weight="700" text-anchor="middle">Genie 3</text>
  <text x="500" y="140" fill="#8b949e" font-size="10" text-anchor="middle">720p/24fps/数分钟</text>

  <!-- Dreamer 4：潜状态、实时+离线RL -->
  <circle cx="660" cy="210" r="14" fill="#3fb950" opacity="0.95"/>
  <text x="660" y="190" fill="#3fb950" font-size="13" font-weight="700" text-anchor="middle">Dreamer 4</text>
  <text x="660" y="240" fill="#8b949e" font-size="10" text-anchor="middle">潜状态 · ≥20fps · 想象RL挖钻</text>

  <!-- JEPA / V-JEPA 2：抽象嵌入、预测+规划（非生成画面） -->
  <circle cx="760" cy="360" r="14" fill="#bc8cff" opacity="0.95"/>
  <text x="760" y="392" fill="#bc8cff" font-size="13" font-weight="700" text-anchor="middle">V-JEPA 2 / JEPA</text>
  <text x="760" y="408" fill="#8b949e" font-size="10" text-anchor="middle">抽象嵌入 · 62h 数据零样本规划</text>

  <!-- World Labs Marble：3D几何、可导航 -->
  <circle cx="560" cy="250" r="11" fill="#39c5cf" opacity="0.9"/>
  <text x="690" y="270" fill="#39c5cf" font-size="12" font-weight="700" text-anchor="middle">Marble / HunyuanWorld</text>
  <text x="690" y="286" fill="#8b949e" font-size="10" text-anchor="middle">显式3D几何 · 可导航/导出</text>

  <!-- Cosmos：平台横跨 -->
  <rect x="700" y="430" width="280" height="56" rx="10" fill="#161b22" stroke="#39c5cf" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="840" y="454" fill="#39c5cf" font-size="12.5" font-weight="700" text-anchor="middle">NVIDIA Cosmos 平台</text>
  <text x="840" y="474" fill="#8b949e" font-size="10.5" text-anchor="middle">Predict/Transfer/Reason + 数据工厂（横跨多区）</text>

  <!-- Physis/Emu3.5：物理状态、长程推理 -->
  <circle cx="900" cy="250" r="14" fill="#f85149" opacity="0.95"/>
  <text x="900" y="226" fill="#f85149" font-size="13" font-weight="700" text-anchor="middle">悟界 Physis / Emu3.5</text>
  <text x="900" y="210" fill="#8b949e" font-size="10" text-anchor="middle">物理状态 NPSP · 50+场景</text>

  <!-- Motus WAM：物理状态+动作 -->
  <circle cx="850" cy="330" r="10" fill="#f85149" opacity="0.8"/>
  <text x="850" y="356" fill="#f85149" font-size="11.5" font-weight="700" text-anchor="middle">Motus（WAM 世界-行动）</text>

  <!-- 演进箭头：Sora -> Genie3/Dreamer4 -> Physis -->
  <path d="M215,585 C 380,430 430,250 490,195" fill="none" stroke="#58a6ff" stroke-width="1.4" stroke-dasharray="4 4" opacity="0.7"/>
  <path d="M670,198 C 760,150 840,180 888,238" fill="none" stroke="#58a6ff" stroke-width="1.4" stroke-dasharray="4 4" opacity="0.7"/>
  <text x="350" y="420" fill="#58a6ff" font-size="11" opacity="0.85" transform="rotate(-34 350 420)">可交互性跃升</text>
  <text x="770" y="150" fill="#58a6ff" font-size="11" opacity="0.85">抽象度跃升 →</text>

  <!-- 底部结论 -->
  <rect x="110" y="675" width="900" height="60" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="130" y="700" fill="#e6edf3" font-size="12.5" font-weight="700">读图要点</text>
  <text x="130" y="722" fill="#8b949e" font-size="11.5">右上角＝「又懂物理因果、又能实时交互训练」的终极目标区，目前仍空缺；Genie 3 / Dreamer 4 解决了「实时可玩」，JEPA / Physis 解决了「抽象物理预测」，<tspan fill="#58a6ff">路线融合是主要趋势</tspan>。</text>
</svg>
</body></html>
