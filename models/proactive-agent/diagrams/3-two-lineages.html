<svg viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg">
<rect width="1200" height="720" fill="#0d1117"/>
<text x="50" y="42" fill="#e6edf3" font-size="22" text-anchor="start" font-weight="700">图 3 · 两条互不相通的思想谱系（1999–2026）</text>
<text x="50" y="70" fill="#8b949e" font-size="13.5" text-anchor="start">主动干预的两半分别握在两个互不引用的社群：左线把「打断成本」形式化却无执行者，右线有执行者却把成本项碎成四片</text>

<rect x="45" y="100" width="540" height="330" rx="16" fill="#0f141b" stroke="#58a6ff" stroke-width="1.8"/>
<text x="68" y="134" fill="#58a6ff" font-size="16.5" font-weight="700">左线 1999–2022 · 成本项被形式化，但没有执行者</text>
<text x="68" y="157" fill="#8b949e" font-size="11.5">HCI / 普适计算社群：研究「打断一个人的成本是多少、该如何权衡」</text>

<!-- key facts left -->
<rect x="68" y="262" width="240" height="72" rx="8" fill="#161b22" stroke="#30363d"/>
<text x="82" y="285" fill="#e6edf3" font-size="11.5" font-weight="700">核心形式化</text>
<text x="82" y="306" fill="#8b949e" font-size="10.5">期望效用门控；沉默是一等动作；</text>
<text x="82" y="324" fill="#8b949e" font-size="10.5">阈值随专注深度升高（三态策略）</text>

<rect x="322" y="262" width="240" height="72" rx="8" fill="#161b22" stroke="#30363d"/>
<text x="336" y="285" fill="#e6edf3" font-size="11.5" font-weight="700">现场实测</text>
<text x="336" y="306" fill="#8b949e" font-size="10.5">一次告警 ≈ 20–25 分钟扰动弧；</text>
<text x="336" y="324" fill="#8b949e" font-size="10.5">27% 被打断窗口 2h 后未恢复</text>

<rect x="68" y="348" width="494" height="62" rx="8" fill="#1a1214" stroke="#f85149"/>
<text x="82" y="372" fill="#f85149" font-size="11.5" font-weight="700">为何沉寂？</text>
<text x="82" y="393" fill="#8b949e" font-size="10.5">完美时机的最大收益不过是「用户稍早读到消息」→ 更好的成本模型无处复利；</text>
<text x="82" y="408" fill="#8b949e" font-size="10.5">深刻形式化为一个「尚不存在的执行者」而建</text>

<text x="603" y="378" fill="#f85149" font-size="12" text-anchor="middle" font-weight="700">引用</text>

<text x="648" y="157" fill="#8b949e" font-size="11.5">LLM 浪潮：能完成任务的执行者出现，决策层却被推倒重做</text>

<line x1="668" y1="196" x2="1120" y2="196" stroke="#30363d" stroke-width="2"/>

  <circle cx="980" cy="196" r="6" fill="#3fb950"/>
  <text x="980" y="182" text-anchor="middle" font-size="11" fill="#e6edf3" font-weight="700">2026</text>
  <text x="980" y="222" text-anchor="middle" font-size="10" fill="#8b949e">Pro²Bench</text>

  <circle cx="1080" cy="196" r="6" fill="#3fb950"/>
  <text x="1080" y="182" text-anchor="middle" font-size="11" fill="#e6edf3" font-weight="700">2026</text>
  <text x="1080" y="222" text-anchor="middle" font-size="10" fill="#8b949e">Q&amp;D 内容轴</text>
</g>

<!-- four fragments -->
<text x="648" y="262" fill="#e6edf3" font-size="11.5" font-weight="700">成本碎成四片（各社群只定价一个组件）：</text>
<rect x="648" y="272" width="120" height="52" rx="7" fill="#161b22" stroke="#58a6ff"/>
<text x="708" y="294" fill="#58a6ff" font-size="10.5" text-anchor="middle" font-weight="700">误报</text>
<text x="708" y="313" fill="#8b949e" font-size="9.5" text-anchor="middle">PRISM 已定价</text>
<rect x="778" y="272" width="120" height="52" rx="7" fill="#161b22" stroke="#d29922"/>
<text x="838" y="294" fill="#d29922" font-size="10.5" text-anchor="middle" font-weight="700">认知负荷</text>
<text x="838" y="313" fill="#8b949e" font-size="9.5" text-anchor="middle">测量未接入</text>
<rect x="908" y="272" width="120" height="52" rx="7" fill="#161b22" stroke="#bc8cff"/>
<text x="968" y="294" fill="#bc8cff" font-size="10.5" text-anchor="middle" font-weight="700">社交冒犯</text>
<text x="968" y="313" fill="#8b949e" font-size="9.5" text-anchor="middle">命名未计费</text>
<rect x="1038" y="272" width="105" height="52" rx="7" fill="#161b22" stroke="#3fb950"/>
<text x="1090" y="294" fill="#3fb950" font-size="10.5" text-anchor="middle" font-weight="700">算力</text>
<text x="1090" y="313" fill="#8b949e" font-size="9.5" text-anchor="middle">唯一定价</text>

<rect x="648" y="338" width="485" height="72" rx="8" fill="#1a1214" stroke="#f85149"/>
<text x="662" y="362" fill="#f85149" font-size="11.5" font-weight="700">两个无主条目 = 1999 已拥有的那两个</text>
<text x="662" y="384" fill="#8b949e" font-size="10.5">注意力状态（attentional state）· 沉默成本（cost of silence）长期无人接手；</text>
<text x="662" y="402" fill="#8b949e" font-size="10.5">右线仅 1 篇引用左线，且最终定价的是算力</text>

<text x="68" y="494" fill="#d29922" font-size="16" font-weight="700">2026 年桥梁正在出现：决策论形式化的回归（似无人察觉自己在重建它）</text>

<rect x="68" y="514" width="250" height="136" rx="10" fill="#161b22" stroke="#30363d"/>

<text x="82" y="562" fill="#8b949e" font-size="10.5">贝叶斯风险最小化重建阈值，</text>
<text x="82" y="580" fill="#8b949e" font-size="10.5">用学习概率替换启发式概率</text>
<text x="82" y="606" fill="#3fb950" font-size="10.5" font-weight="700">误报 50.22%→22.94%</text>
<text x="82" y="626" fill="#3fb950" font-size="10.5" font-weight="700">F1 66.47→86.61</text>

<rect x="338" y="514" width="250" height="136" rx="10" fill="#161b22" stroke="#30363d"/>

<text x="352" y="562" fill="#8b949e" font-size="10.5">决策层或许不需要 LLM：</text>
<text x="352" y="580" fill="#8b949e" font-size="10.5">小图模型先触发，LLM 后行动</text>
<text x="352" y="606" fill="#3fb950" font-size="10.5" font-weight="700">4–7× 加速 · 11.13ms</text>
<text x="352" y="626" fill="#8b949e" font-size="10.5">220 MiB 端侧可跑</text>

<rect x="608" y="514" width="250" height="136" rx="10" fill="#161b22" stroke="#30363d"/>
<text x="622" y="540" fill="#e6edf3" font-size="12.5" font-weight="700">廉价门控 / 昂贵执行器</text>
<text x="622" y="562" fill="#8b949e" font-size="10.5">PRISM · TGL · PRPF 三篇独立</text>
<text x="622" y="580" fill="#8b949e" font-size="10.5">工作收敛到同一架构</text>
<text x="622" y="606" fill="#d29922" font-size="10.5" font-weight="700">但算力门 ≠ 打扰门</text>
<text x="622" y="626" fill="#8b949e" font-size="10.5">注意力状态项仍为空</text>

<rect x="878" y="514" width="255" height="136" rx="10" fill="#16101c" stroke="#bc8cff"/>
