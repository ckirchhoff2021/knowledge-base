<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>图2 · 抗崩溃合成数据工厂</title>
<style>
html,body{margin:0;padding:0;background:#0d1117}
svg{display:block;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
</style></head><body>
<svg viewBox="0 0 1200 820" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
    <marker id="arg" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
  </defs>
  <rect x="0" y="0" width="1200" height="820" fill="#0d1117"/>
  <text x="60" y="50" fill="#e6edf3" font-size="24" font-weight="700">图 2 · 抗崩溃合成数据工厂：五阶段流水线与验证堆栈</text>
  <text x="60" y="78" fill="#8b949e" font-size="13">生成是容易的部分；溯源、验证、多样性监控与累积混合才是区分「持续改进」与「崩溃」的关键</text>

  <!-- Stage 1 -->
  <rect x="50" y="120" width="200" height="150" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="1.7"/>
  <rect x="50" y="120" width="200" height="34" rx="12" fill="#58a6ff" opacity="0.14"/>
  <text x="150" y="143" fill="#58a6ff" font-size="14" font-weight="700" text-anchor="middle">① 种子与锚点</text>
  <text x="64" y="176" fill="#e6edf3" font-size="11.5">· 最高质量真实数据</text>
  <text x="64" y="198" fill="#8b949e" font-size="11">· 清洗 + SemDeDup 去重</text>
  <text x="64" y="220" fill="#8b949e" font-size="11">· 保留 T0/T1 人类锚点</text>
  <text x="64" y="242" fill="#8b949e" font-size="11">· 溯源标签（生成器ID）</text>

  <!-- Stage 2 -->
  <rect x="290" y="120" width="200" height="150" rx="12" fill="#161b22" stroke="#bc8cff" stroke-width="1.7"/>
  <rect x="290" y="120" width="200" height="34" rx="12" fill="#bc8cff" opacity="0.14"/>
  <text x="390" y="143" fill="#bc8cff" font-size="14" font-weight="700" text-anchor="middle">② 多源过量生成</text>
  <text x="304" y="176" fill="#e6edf3" font-size="11.5">· 跨模型家族生成</text>
  <text x="304" y="198" fill="#8b949e" font-size="11">· 温度 / 角色 / 提示调度</text>
  <text x="304" y="220" fill="#8b949e" font-size="11">· 教师 LLM + 模板 + 仿真</text>
  <text x="304" y="242" fill="#d29922" font-size="11">· 过量生成目标量 3–5×</text>

  <!-- Stage 3 -->
  <rect x="530" y="120" width="200" height="150" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="1.7"/>
  <rect x="530" y="120" width="200" height="34" rx="12" fill="#3fb950" opacity="0.14"/>
  <text x="630" y="143" fill="#3fb950" font-size="14" font-weight="700" text-anchor="middle">③ 多层验证</text>
  <text x="544" y="176" fill="#e6edf3" font-size="11.5">· 格式 / schema 校验</text>
  <text x="544" y="198" fill="#8b949e" font-size="11">· 可执行：单测 / 答案 / Lean</text>
  <text x="544" y="220" fill="#8b949e" font-size="11">· 跨模型批评 + 去重</text>
  <text x="544" y="242" fill="#8b949e" font-size="11">· 人工只抽检标记样本</text>

  <!-- Stage 4 -->
  <rect x="770" y="120" width="200" height="150" rx="12" fill="#161b22" stroke="#d29922" stroke-width="1.7"/>
  <rect x="770" y="120" width="200" height="34" rx="12" fill="#d29922" opacity="0.14"/>
  <text x="870" y="143" fill="#d29922" font-size="14" font-weight="700" text-anchor="middle">④ 分级混合</text>
  <text x="784" y="176" fill="#e6edf3" font-size="11.5">· T0 人类 → T3 批量合成</text>
  <text x="784" y="198" fill="#8b949e" font-size="11">· 加权采样 + 动态配比</text>
  <text x="784" y="220" fill="#8b949e" font-size="11">· 合成 token 卡在拐点内</text>
  <text x="784" y="242" fill="#8b949e" font-size="11">· 最大合成比例程序化执行</text>

  <!-- Stage 5 -->
  <rect x="1010" y="120" width="150" height="150" rx="12" fill="#161b22" stroke="#f85149" stroke-width="1.7"/>
  <rect x="1010" y="120" width="150" height="34" rx="12" fill="#f85149" opacity="0.14"/>
  <text x="1085" y="143" fill="#f85149" font-size="14" font-weight="700" text-anchor="middle">⑤ 监控</text>
  <text x="1024" y="176" fill="#e6edf3" font-size="11">· JS散度/MMD</text>
  <text x="1024" y="198" fill="#8b949e" font-size="11">· 潜空间覆盖率</text>
  <text x="1024" y="220" fill="#8b949e" font-size="11">· 真实 holdout 回归</text>
  <text x="1024" y="242" fill="#8b949e" font-size="11">· 漂移自动告警</text>

  <!-- arrows between stages -->
  <line x1="250" y1="195" x2="288" y2="195" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar)"/>
  <line x1="490" y1="195" x2="528" y2="195" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar)"/>
  <line x1="730" y1="195" x2="768" y2="195" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar)"/>
  <line x1="970" y1="195" x2="1008" y2="195" stroke="#8b949e" stroke-width="2.2" marker-end="url(#ar)"/>

  <!-- output to training -->
  <rect x="380" y="320" width="440" height="56" rx="10" fill="#12261a" stroke="#3fb950" stroke-width="1.6"/>
  <text x="600" y="345" fill="#7ee787" font-size="14" font-weight="700" text-anchor="middle">→ 训练消费：预训练 / SFT / RL（分级加权采样）</text>
  <text x="600" y="366" fill="#8b949e" font-size="11.5" text-anchor="middle">真实锚点永不离场：合成数据被「添加」，而非「替换」</text>
  <line x1="600" y1="270" x2="600" y2="318" stroke="#3fb950" stroke-width="2.2" marker-end="url(#arg)"/>

  <!-- feedback loop monitoring -->
  <path d="M1085,270 L1085,410 L150,410 L150,272" fill="none" stroke="#f85149" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#ar)"/>
  <text x="600" y="400" fill="#f85149" font-size="12" text-anchor="middle">监控反馈：holdout 降而合成基准稳 → 崩溃信号 → 降低合成比例 / 更新数据源重新生成</text>

  <!-- BOTTOM: verifier stack detail -->
  <rect x="50" y="450" width="530" height="330" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="1.6"/>
  <rect x="50" y="450" width="530" height="38" rx="12" fill="#3fb950" opacity="0.13"/>
  <text x="72" y="476" fill="#3fb950" font-size="15" font-weight="700">验证堆栈（验证比生成容易）</text>
  <g font-size="12">
    <rect x="72" y="506" width="486" height="40" rx="8" fill="#12261a" stroke="#3fb950"/>
    <text x="88" y="531" fill="#7ee787">格式 / Schema：坏 JSON、缺字段、越界值（廉价、确定性）</text>
    <rect x="72" y="554" width="486" height="40" rx="8" fill="#12261a" stroke="#3fb950"/>
    <text x="88" y="579" fill="#7ee787">可执行预言机：pytest / SymPy / Lean / 物理仿真</text>
    <rect x="72" y="602" width="486" height="40" rx="8" fill="#12261a" stroke="#3fb950"/>
    <text x="88" y="627" fill="#7ee787">跨模型一致性 / 批评模型：拒绝无据内容与幻觉</text>
    <rect x="72" y="650" width="486" height="40" rx="8" fill="#12261a" stroke="#3fb950"/>
    <text x="88" y="675" fill="#7ee787">去重：近重复 + SemDeDup 语义去重；统计异常点</text>
    <rect x="72" y="698" width="486" height="40" rx="8" fill="#12261a" stroke="#3fb950"/>
    <text x="88" y="723" fill="#7ee787">人工：仅抽检被标记样本 + 固定比例随机样本</text>
  </g>

  <!-- BOTTOM RIGHT: quality tiers -->
  <rect x="620" y="450" width="530" height="330" rx="12" fill="#161b22" stroke="#bc8cff" stroke-width="1.6"/>
  <rect x="620" y="450" width="530" height="38" rx="12" fill="#bc8cff" opacity="0.13"/>
  <text x="642" y="476" fill="#bc8cff" font-size="15" font-weight="700">质量分级与溯源（data-card）</text>
  <g font-size="12.5">
    <rect x="642" y="506" width="486" height="44" rx="8" fill="#1d1633" stroke="#bc8cff"/>
    <text x="660" y="533" fill="#dcc8ff">T0 人类专家（高信任锚点）</text>
    <rect x="642" y="558" width="486" height="44" rx="8" fill="#1d1633" stroke="#bc8cff"/>
    <text x="660" y="585" fill="#dcc8ff">T1 人工 + 轻度合成核验</text>
    <rect x="642" y="610" width="486" height="44" rx="8" fill="#1d1633" stroke="#bc8cff"/>
    <text x="660" y="637" fill="#dcc8ff">T2 已验证合成（主力）</text>
    <rect x="642" y="662" width="486" height="44" rx="8" fill="#1d1633" stroke="#bc8cff"/>
    <text x="660" y="689" fill="#dcc8ff">T3 批量合成（过滤后）</text>
  </g>
  <text x="642" y="738" fill="#8b949e" font-size="11.5">每分片记录：生成器模型哈希 · 验证器版本 · 种子哈希 · 分级</text>
  <text x="642" y="760" fill="#8b949e" font-size="11.5">→ 支持配比执行、漂移调试与合规披露（EU AI Act / AB 2013）</text>
</svg>
</body></html>
