<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>图4 · 世界模型合成数据引擎</title>
<style>
html,body{margin:0;padding:0;background:#0d1117}
svg{display:block;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
</style></head><body>
<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
    <marker id="ap" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/></marker>
  </defs>
  <rect x="0" y="0" width="1200" height="800" fill="#0d1117"/>
  <text x="60" y="50" fill="#e6edf3" font-size="24" font-weight="700">图 4 · 世界模型 / 仿真器作为合成数据引擎：从真实世界到 sim2real 闭环</text>
  <text x="60" y="78" fill="#8b949e" font-size="13">用生成式环境批量产出「带真值标签」的视觉/动作/驾驶数据，再训回真实世界；核心风险是 sim2real gap</text>

  <!-- real world -->
  <rect x="50" y="130" width="230" height="150" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="1.7"/>
  <text x="165" y="165" fill="#58a6ff" font-size="15" font-weight="700" text-anchor="middle">真实世界数据</text>
  <text x="66" y="196" fill="#8b949e" font-size="11.5">· 真实驾驶视频 / nuScenes</text>
  <text x="66" y="220" fill="#8b949e" font-size="11.5">· 机器人遥操作演示</text>
  <text x="66" y="244" fill="#8b949e" font-size="11.5">· 网络游戏视频（无标签）</text>
  <text x="66" y="266" fill="#d29922" font-size="11">昂贵、长尾稀缺、标注难</text>

  <!-- world models / simulators -->
  <rect x="360" y="110" width="430" height="300" rx="12" fill="#161b22" stroke="#bc8cff" stroke-width="1.7"/>
  <rect x="360" y="110" width="430" height="38" rx="12" fill="#bc8cff" opacity="0.13"/>
  <text x="575" y="136" fill="#bc8cff" font-size="15" font-weight="700" text-anchor="middle">世界模型 / 生成式仿真器</text>
  <g font-size="11.5">
    <rect x="380" y="164" width="190" height="52" rx="8" fill="#1d1633" stroke="#bc8cff"/>
    <text x="394" y="186" fill="#dcc8ff" font-weight="700">Genie（11B）</text>
    <text x="394" y="206" fill="#8b949e" font-size="10.5">无标签视频→可玩环境</text>
    <rect x="580" y="164" width="190" height="52" rx="8" fill="#1d1633" stroke="#bc8cff"/>
    <text x="594" y="186" fill="#dcc8ff" font-weight="700">GameNGen（DOOM）</text>
    <text x="594" y="206" fill="#8b949e" font-size="10.5">扩散实时引擎 20FPS</text>
    <rect x="380" y="226" width="190" height="52" rx="8" fill="#1d1633" stroke="#bc8cff"/>
    <text x="394" y="248" fill="#dcc8ff" font-weight="700">DriveDreamer / MagicDrive</text>
    <text x="394" y="268" fill="#8b949e" font-size="10.5">真实驱动街景扩散生成</text>
    <rect x="580" y="226" width="190" height="52" rx="8" fill="#1d1633" stroke="#bc8cff"/>
    <text x="594" y="248" fill="#dcc8ff" font-weight="700">GenSim</text>
    <text x="594" y="268" fill="#8b949e" font-size="10.5">LLM 生成机器人仿真任务</text>
    <rect x="380" y="288" width="390" height="52" rx="8" fill="#1d1633" stroke="#bc8cff"/>
    <text x="394" y="310" fill="#dcc8ff" font-weight="700">NVIDIA Cosmos 世界基础模型</text>
    <text x="394" y="330" fill="#8b949e" font-size="10.5">物理感知视频生成，为物理 AI 批量造数（2026 下载破 1000 万，厂商口径）</text>
  </g>

  <!-- synthetic labeled dataset -->
  <rect x="870" y="130" width="280" height="150" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="1.7"/>
  <text x="1010" y="165" fill="#3fb950" font-size="15" font-weight="700" text-anchor="middle">合成标注数据集</text>
  <text x="886" y="196" fill="#8b949e" font-size="11.5">· 自动带动作 / 深度 / 3D框真值</text>
  <text x="886" y="220" fill="#8b949e" font-size="11.5">· 可控生成长尾 / 危险场景</text>
  <text x="886" y="244" fill="#8b949e" font-size="11.5">· 多相机一致、无限规模化</text>
  <text x="886" y="266" fill="#7ee787" font-size="11">边际成本远低于真实采集</text>

  <!-- arrows top row -->
  <line x1="280" y1="205" x2="358" y2="205" stroke="#58a6ff" stroke-width="2.4" marker-end="url(#ab)"/>
  <text x="319" y="192" fill="#9ecbff" font-size="10.5" text-anchor="middle">学习/驱动</text>
  <line x1="790" y1="205" x2="868" y2="205" stroke="#3fb950" stroke-width="2.4" marker-end="url(#ag)"/>
  <text x="829" y="192" fill="#7ee787" font-size="10.5" text-anchor="middle">生成</text>

  <!-- train models -->
  <rect x="360" y="470" width="430" height="90" rx="12" fill="#12261a" stroke="#3fb950" stroke-width="1.7"/>
  <text x="575" y="503" fill="#3fb950" font-size="15" font-weight="700" text-anchor="middle">训练感知 / 规划 / VLA 模型</text>
  <text x="575" y="530" fill="#8b949e" font-size="11.5" text-anchor="middle">真实数据（锚点）＋ 合成数据（增量）混合训练</text>
  <text x="575" y="550" fill="#7ee787" font-size="11" text-anchor="middle">实证：MagicDrive 合成数据使 BEVFusion mAP 32.88→35.40</text>

  <line x1="1010" y1="280" x2="1010" y2="400" stroke="#3fb950" stroke-width="2.2"/>
  <line x1="1010" y1="400" x2="690" y2="400" stroke="#3fb950" stroke-width="2.2"/>
  <line x1="690" y1="400" x2="690" y2="468" stroke="#3fb950" stroke-width="2.2" marker-end="url(#ag)"/>

  <!-- deploy back to real -->
  <rect x="50" y="450" width="230" height="110" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="1.7"/>
  <text x="165" y="485" fill="#58a6ff" font-size="15" font-weight="700" text-anchor="middle">部署回真实世界</text>
  <text x="66" y="514" fill="#8b949e" font-size="11.5">自动驾驶 / 机器人 / 具身智能</text>
  <text x="66" y="538" fill="#d29922" font-size="11">需跨越 sim2real gap</text>

  <line x1="360" y1="515" x2="282" y2="515" stroke="#58a6ff" stroke-width="2.4" marker-end="url(#ab)"/>
  <text x="321" y="503" fill="#9ecbff" font-size="10.5" text-anchor="middle">部署</text>

  <!-- feedback real -> flywheel -->
  <path d="M165,450 L165,340 L165,282" fill="none" stroke="#bc8cff" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#ap)"/>
  <text x="180" y="380" fill="#dcc8ff" font-size="10.5">真实部署数据回流（飞轮锚点）</text>

  <!-- bottom risk box -->
  <rect x="50" y="610" width="1100" height="150" rx="12" fill="#161b22" stroke="#f85149" stroke-width="1.6"/>
  <rect x="50" y="610" width="1100" height="38" rx="12" fill="#f85149" opacity="0.12"/>
  <text x="72" y="636" fill="#f85149" font-size="15" font-weight="700">sim2real 鸿沟与防崩溃要点</text>
  <g font-size="12" fill="#e6edf3">
    <text x="72" y="676">· 物理一致性：扩散世界模型长时程会漂移，GameNGen 连播 5 分钟后人眼仅「略高于随机」可辨，但更长时序仍不稳</text>
    <text x="72" y="704">· 域差：合成街景纹理/光照与真实有差异 → 需真实数据锚点 + 域随机化 + 少量真机微调（GenSim 真机长程任务较基线 +25%）</text>
    <text x="72" y="732">· 同样遵守「累积而非替换」：合成只做增量，真实采集与部署回流数据永不离场，避免在仿真分布上自我收窄</text>
  </g>
</svg>
</body></html>
