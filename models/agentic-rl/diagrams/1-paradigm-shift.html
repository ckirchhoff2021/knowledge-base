<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>图1 · 从单轮RLVR到Agentic RL</title>
<style>
html,body{margin:0;padding:0;background:#0d1117}
svg{display:block;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
</style></head><body>
<svg viewBox="0 0 1200 860" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1200" height="860" fill="#0d1117"/>
  <text x="60" y="52" fill="#e6edf3" font-size="24" font-weight="700">图 1 · 范式转移：从单轮 RLVR 到 Agentic RL</text>
  <text x="60" y="80" fill="#8b949e" font-size="13">从「闭卷答题、交卷出分」到「真实环境中多轮观察–思考–行动」，优化单位从回答变成整条轨迹</text>

  <!-- 单轮 -->
  <rect x="60" y="115" width="510" height="330" rx="12" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="315" y="145" fill="#94a3b8" font-size="17" font-weight="700" text-anchor="middle">单轮 RLVR（GRPO 时代）</text>

  <rect x="110" y="170" width="180" height="56" rx="8" fill="#161b22" stroke="#58a6ff"/>
  <text x="200" y="203" fill="#e6edf3" font-size="13" text-anchor="middle">Prompt</text>
  <rect x="370" y="170" width="160" height="56" rx="8" fill="#161b22" stroke="#bc8cff"/>
  <text x="450" y="195" fill="#e6edf3" font-size="12" text-anchor="middle">思维链 + 答案</text>
  <text x="450" y="213" fill="#8b949e" font-size="10" text-anchor="middle">一次生成</text>
  <line x1="290" y1="198" x2="366" y2="198" stroke="#8b949e" stroke-width="1.5"/>

  <rect x="200" y="270" width="240" height="56" rx="8" fill="#161b22" stroke="#3fb950"/>
  <text x="320" y="295" fill="#3fb950" font-size="13" text-anchor="middle">验证器：对错 0/1</text>
  <text x="320" y="314" fill="#8b949e" font-size="11" text-anchor="middle">纯函数 · 无状态 · 即时</text>
  <line x1="450" y1="228" x2="380" y2="268" stroke="#8b949e" stroke-width="1.5"/>

  <text x="80" y="370" fill="#8b949e" font-size="12">• 一个回合：秒级 rollout，近似 on-policy</text>
  <text x="80" y="396" fill="#8b949e" font-size="12">• 奖励稠密于回合末，但回合短、信号直接</text>
  <text x="80" y="422" fill="#8b949e" font-size="12">• 代表：DeepSeek-R1 数学/代码推理</text>

  <!-- Agentic -->
  <rect x="630" y="115" width="510" height="330" rx="12" fill="none" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="885" y="145" fill="#3fb950" font-size="17" font-weight="700" text-anchor="middle">Agentic RL（2025–2026 主战场）</text>

  <rect x="660" y="175" width="110" height="50" rx="8" fill="#161b22" stroke="#58a6ff"/>
  <text x="715" y="205" fill="#e6edf3" font-size="12" text-anchor="middle">观察 s_t</text>
  <rect x="790" y="175" width="110" height="50" rx="8" fill="#161b22" stroke="#bc8cff"/>
  <text x="845" y="205" fill="#e6edf3" font-size="12" text-anchor="middle">思考</text>
  <rect x="920" y="175" width="110" height="50" rx="8" fill="#161b22" stroke="#d29922"/>
  <text x="975" y="205" fill="#e6edf3" font-size="12" text-anchor="middle">工具动作</text>
  <rect x="1045" y="175" width="80" height="50" rx="8" fill="#161b22" stroke="#f85149"/>
  <text x="1085" y="198" fill="#e6edf3" font-size="11" text-anchor="middle">环境</text>
  <text x="1085" y="214" fill="#8b949e" font-size="10" text-anchor="middle">反馈</text>
  <line x1="770" y1="200" x2="788" y2="200" stroke="#8b949e"/>
  <line x1="900" y1="200" x2="918" y2="200" stroke="#8b949e"/>
  <line x1="1030" y1="200" x2="1043" y2="200" stroke="#8b949e"/>
  <path d="M1085 228 L1085 255 L715 255 L715 227" fill="none" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="900" y="272" fill="#3fb950" font-size="11" text-anchor="middle">多轮循环 × T（数千–数万 token，分钟–小时级）</text>

  <rect x="700" y="290" width="370" height="44" rx="8" fill="#161b22" stroke="#3fb950"/>
  <text x="885" y="318" fill="#3fb950" font-size="12" text-anchor="middle">唯一奖励：任务最终成功/失败（极稀疏）</text>

  <text x="650" y="370" fill="#8b949e" font-size="12">• 有状态、有随机性、部分可观测（POMDP）</text>
  <text x="650" y="396" fill="#8b949e" font-size="12">• 长 rollout 期间策略已更新：天然 stale/off-policy</text>
  <text x="650" y="422" fill="#8b949e" font-size="12">• 代表：Kimi K2、MiniMax Forge、GLM-5</text>

  <!-- 底部差异表 -->
  <rect x="60" y="480" width="1080" height="200" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="80" y="512" fill="#e6edf3" font-size="14" font-weight="700">五个本质差异</text>
  <line x1="80" y1="524" x2="1120" y2="524" stroke="#30363d"/>
  <text x="80" y="552" fill="#58a6ff" font-size="12" font-weight="600">维度</text>
  <text x="330" y="552" fill="#94a3b8" font-size="12" font-weight="600">单轮 RLVR</text>
  <text x="720" y="552" fill="#3fb950" font-size="12" font-weight="600">Agentic RL</text>
  <line x1="80" y1="562" x2="1120" y2="562" stroke="#30363d"/>
  <text x="80" y="586" fill="#8b949e" font-size="12">回合 / 奖励 / 环境 / 长度 / 数据</text>
  <text x="330" y="586" fill="#8b949e" font-size="12">单轮 · 回合末对错 · 无环境</text>
  <text x="720" y="586" fill="#8b949e" font-size="12">多轮 · 极稀疏延迟 · 有状态随机环境</text>
  <text x="330" y="614" fill="#8b949e" font-size="12">秒级 · 近似 on-policy</text>
  <text x="720" y="614" fill="#8b949e" font-size="12">分钟–小时级 · 天然 off-policy/staleness</text>
  <text x="330" y="646" fill="#8b949e" font-size="12">优化单位：一个回答</text>
  <text x="720" y="646" fill="#8b949e" font-size="12">优化单位：整条轨迹 τ</text>

  <!-- info cards -->
  <g>
    <rect x="60" y="720" width="346" height="100" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="80" y="748" fill="#58a6ff" font-size="13" font-weight="600">核心难题转移</text>
    <text x="80" y="774" fill="#e6edf3" font-size="12">「怎么更新参数」→</text>
    <text x="80" y="798" fill="#8b949e" font-size="12">「如何持续制造可用学习信号」</text>
  </g>
  <g>
    <rect x="427" y="720" width="346" height="100" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="447" y="748" fill="#58a6ff" font-size="13" font-weight="600">不是新 GRPO 变体</text>
    <text x="447" y="774" fill="#e6edf3" font-size="12">算法 + 环境 + 奖励 + 数据流</text>
    <text x="447" y="798" fill="#8b949e" font-size="12">+ 基础设施的协同系统</text>
  </g>
  <g>
    <rect x="794" y="720" width="346" height="100" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="814" y="748" fill="#58a6ff" font-size="13" font-weight="600">直觉类比</text>
    <text x="814" y="774" fill="#e6edf3" font-size="12">闭卷考试 → 真实课题研究</text>
    <text x="814" y="798" fill="#8b949e" font-size="11">查资料·做实验·失败重来·管预算</text>
  </g>
</svg>
</body></html>
