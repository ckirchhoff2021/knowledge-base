<text x="50" y="42" fill="#e6edf3" font-size="23" font-weight="700">图 3 · 负载均衡的演进与控制论统一：从辅助损失到 PID 控制器</text>
<text x="50" y="68" fill="#8b949e" font-size="12.5">核心矛盾：负载均衡（系统要）vs 专家专门化（模型要）；2026 年被统一为一个作用在路由偏置上的反馈控制系统</text>

<!-- evolution timeline -->
<rect x="60" y="95" width="250" height="120" rx="9" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
<text x="76" y="121" fill="#f85149" font-size="13.5" font-weight="700">① 辅助损失 aux-loss</text>
<text x="76" y="145" fill="#e6edf3" font-size="11.5">L_bal = α·N·Σ f_i·P_i</text>
<text x="76" y="166" fill="#e6edf3" font-size="11.5">鼓励门控均匀访问各专家</text>
<text x="76" y="187" fill="#f85149" font-size="11.5">副作用：梯度干扰主目标</text>
<text x="76" y="205" fill="#8b949e" font-size="10.5">2017–2023 标配（Mixtral α=0.02）</text>

<rect x="335" y="95" width="250" height="120" rx="9" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
<text x="351" y="121" fill="#d29922" font-size="13.5" font-weight="700">② 无辅助损失 ALF-LB</text>
<text x="351" y="145" fill="#e6edf3" font-size="11.5">每个专家加可学习偏置 b_i</text>
<text x="351" y="166" fill="#e6edf3" font-size="11.5">过载 → 减分；空闲 → 加分</text>
<text x="351" y="187" fill="#3fb950" font-size="11.5">不进梯度、不污染主目标</text>
<text x="351" y="205" fill="#8b949e" font-size="10.5">DeepSeek-V3（2024）首创</text>

<rect x="610" y="95" width="250" height="120" rx="9" fill="#161b22" stroke="#39c5cf" stroke-width="1.5"/>
<text x="626" y="121" fill="#39c5cf" font-size="13.5" font-weight="700">③ 分位均衡（比例控制）</text>
<text x="626" y="145" fill="#e6edf3" font-size="11.5">按负载分位数设阈值调偏置</text>
<text x="626" y="166" fill="#e6edf3" font-size="11.5">响应快、对当前偏差成比例</text>
<text x="626" y="187" fill="#8b949e" font-size="11.5">Kimi K3 等采用</text>
<text x="626" y="205" fill="#8b949e" font-size="10.5">控制论上＝P（比例）项</text>

<rect x="885" y="95" width="265" height="120" rx="9" fill="#0e1d12" stroke="#3fb950" stroke-width="1.8"/>
<text x="901" y="121" fill="#3fb950" font-size="13.5" font-weight="700">④ ID Balancing（积分-微分）</text>
<text x="901" y="145" fill="#e6edf3" font-size="11.5">I 项累积历史偏差（=ALF 本质）</text>
<text x="901" y="166" fill="#e6edf3" font-size="11.5">D 项预测负载变化趋势、提前动作</text>
<text x="901" y="187" fill="#3fb950" font-size="11.5">768 专家 top-3 稳定训练</text>
<text x="901" y="205" fill="#8b949e" font-size="10.5">2026-09，arXiv:2609.39137</text>

<line x1="310" y1="155" x2="333" y2="155" stroke="#58a6ff" stroke-width="1.8" marker-end="url(#b)"/>
<line x1="585" y1="155" x2="608" y2="155" stroke="#58a6ff" stroke-width="1.8" marker-end="url(#b)"/>
<line x1="860" y1="155" x2="883" y2="155" stroke="#58a6ff" stroke-width="1.8" marker-end="url(#b)"/>

<!-- feedback control loop -->
<text x="60" y="265" fill="#e6edf3" font-size="15" font-weight="700">统一视角：MoE 负载均衡 = 一个离散反馈控制系统</text>

<rect x="80" y="295" width="200" height="90" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.6"/>
<text x="180" y="325" fill="#58a6ff" font-size="13" font-weight="700" text-anchor="middle">① 负载统计</text>
<text x="180" y="350" fill="#e6edf3" font-size="11.5" text-anchor="middle">统计每专家分到的</text>
<text x="180" y="369" fill="#e6edf3" font-size="11.5" text-anchor="middle">token 数 f_i（滑动窗口）</text>

<rect x="380" y="295" width="200" height="90" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.6"/>
<text x="480" y="325" fill="#3fb950" font-size="13" font-weight="700" text-anchor="middle">② 控制器（P/I/D）</text>
<text x="480" y="350" fill="#e6edf3" font-size="11.5" text-anchor="middle">比较目标负载，计算</text>
<text x="480" y="369" fill="#e6edf3" font-size="11.5" text-anchor="middle">偏置修正量 Δb_i</text>

<rect x="680" y="295" width="200" height="90" rx="10" fill="#161b22" stroke="#d29922" stroke-width="1.6"/>
<text x="780" y="325" fill="#d29922" font-size="13" font-weight="700" text-anchor="middle">③ 路由偏置</text>
<text x="780" y="350" fill="#e6edf3" font-size="11.5" text-anchor="middle">affinity_i += bias_i</text>
<text x="780" y="369" fill="#e6edf3" font-size="11.5" text-anchor="middle">只改选择、不改权重梯度</text>

<rect x="960" y="295" width="190" height="90" rx="10" fill="#0e1d12" stroke="#3fb950" stroke-width="1.6"/>
<text x="1055" y="325" fill="#3fb950" font-size="13" font-weight="700" text-anchor="middle">④ MoE 层执行</text>
<text x="1055" y="350" fill="#e6edf3" font-size="11.5" text-anchor="middle">top-k 路由 → 新的</text>
<text x="1055" y="369" fill="#e6edf3" font-size="11.5" text-anchor="middle">专家负载分布</text>

<line x1="280" y1="340" x2="378" y2="340" stroke="#58a6ff" stroke-width="1.8" marker-end="url(#b)"/>
<line x1="580" y1="340" x2="678" y2="340" stroke="#58a6ff" stroke-width="1.8" marker-end="url(#b)"/>
<line x1="880" y1="340" x2="958" y2="340" stroke="#58a6ff" stroke-width="1.8" marker-end="url(#b)"/>
<!-- feedback curved -->
<path d="M1055 385 L1055 440 L180 440 L180 387" fill="none" stroke="#3fb950" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#g)"/>
<text x="600" y="432" fill="#3fb950" font-size="11.5" text-anchor="middle">负反馈：新分布回流，持续把过载专家的流量压回去</text>

<!-- theory + caveats -->
<rect x="60" y="470" width="540" height="150" rx="9" fill="#10141a" stroke="#30363d"/>
<text x="80" y="500" fill="#bc8cff" font-size="13.5" font-weight="700">理论保证（2025）</text>
<text x="80" y="526" fill="#e6edf3" font-size="11.5">· ALF-LB 被解释为解「负载分配问题」的原始-对偶（单步常数时间）算法</text>
<text x="80" y="549" fill="#e6edf3" font-size="11.5">· 在线强凸情形下具有 O(log T) 的遗憾界（regret bound）</text>
<text x="80" y="572" fill="#e6edf3" font-size="11.5">· 给出近似均衡保证：偏置法不是启发式 trick，而是有理论依据的优化</text>
<text x="80" y="595" fill="#8b949e" font-size="11">arXiv:2512.03915（2025-12）</text>

<rect x="620" y="470" width="530" height="150" rx="9" fill="#1a1010" stroke="#f85149" stroke-width="1.3"/>
<text x="640" y="500" fill="#f85149" font-size="13.5" font-weight="700">反例：均衡不是越狠越好（2026）</text>
<text x="640" y="526" fill="#e6edf3" font-size="11.5">· 过度分散（近均匀）路由会压平重要性信号、伤害专门化</text>
<text x="640" y="549" fill="#e6edf3" font-size="11.5">· gpt-oss-20B 上最低困惑度配置，数学推理反而最差</text>
<text x="640" y="572" fill="#e6edf3" font-size="11.5">· 激活感知评分在 GPQA 上相差达 18 分 → 需要领域感知剪枝 MESA</text>
<text x="640" y="595" fill="#8b949e" font-size="11">arXiv:2609.04453（2026-09）</text>

<rect x="60" y="645" width="1090" height="110" rx="9" fill="#0e1d12" stroke="#3fb950" stroke-width="1.3"/>
<text x="80" y="675" fill="#3fb950" font-size="13" font-weight="700">训练三阶段（拥塞博弈视角，arXiv:2604.04230）</text>
<text x="80" y="702" fill="#e6edf3" font-size="12">早期：路由近乎均匀（探索） → 中期：专门化最剧烈、拥塞系数 γ 达峰 36–39、最易失稳 → 后期：自发再平衡，γ 回落到约 9</text>
<text x="80" y="728" fill="#d29922" font-size="12">工程含义：均衡强度（控制器增益）应随阶段调度——中期加强干预防 spike，后期放松以保住专门化。</text>
