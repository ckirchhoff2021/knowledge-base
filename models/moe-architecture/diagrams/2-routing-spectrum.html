<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>图2 · 路由机制全谱</title>
<style>
html,body{margin:0;padding:0;background:#0d1117}
svg{display:block;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
</style></head><body>
<svg viewBox="0 0 1200 780" xmlns="http://www.w3.org/2000/svg">
<rect width="1200" height="780" fill="#0d1117"/>
<defs><marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#58a6ff"/></marker></defs>
<text x="50" y="42" fill="#e6edf3" font-size="23" font-weight="700">图 2 · 路由机制全谱：「谁来选择专家」的六种范式</text>
<text x="50" y="68" fill="#8b949e" font-size="12.5">从「token 选专家」到「专家选 token」；蓝=主流硬路由，紫=确定性，绿=反向选择，黄=软分配，青=深度稀疏，红=2026 免训练/控制论</text>

<rect x="60" y="100" width="350" height="185" rx="9" fill="#161b22" stroke="#58a6ff" stroke-width="1.6"/>
<text x="76" y="128" fill="#58a6ff" font-size="14" font-weight="700">① Token-choice 硬路由（主流）</text>
<text x="76" y="154" fill="#e6edf3" font-size="11.5">· 门控 g=softmax(W_g·x)，取 top-k</text>
<text x="76" y="175" fill="#e6edf3" font-size="11.5">· Switch(top-1)/Mixtral(top-2)/V3·Qwen(top-8)</text>
<text x="76" y="196" fill="#e6edf3" font-size="11.5">· 每 token 计算恒定、可并行</text>
<text x="76" y="217" fill="#f85149" font-size="11.5">· 负载不均 → 需容量限制/均衡损失</text>
<text x="76" y="238" fill="#f85149" font-size="11.5">· 风险：专家坍塌、token 溢出丢弃</text>
<text x="76" y="264" fill="#8b949e" font-size="11">Shazeer 2017 奠基，旗舰 LLM 标配</text>

<rect x="430" y="100" width="350" height="185" rx="9" fill="#161b22" stroke="#bc8cff" stroke-width="1.6"/>
<text x="446" y="128" fill="#bc8cff" font-size="14" font-weight="700">② 确定性 / 无参数路由</text>
<text x="446" y="154" fill="#e6edf3" font-size="11.5">· BASE：token↔专家建模为线性分配，最优均衡</text>
<text x="446" y="175" fill="#e6edf3" font-size="11.5">· Hash：hash(token) 决定专家，零路由参数</text>
<text x="446" y="196" fill="#3fb950" font-size="11.5">· 天然均衡、无 aux-loss、无抖动</text>
<text x="446" y="217" fill="#f85149" font-size="11.5">· Hash 牺牲内容相关的专门化</text>
<text x="446" y="238" fill="#f85149" font-size="11.5">· BASE 求解开销大，难在线扩展</text>
<text x="446" y="264" fill="#8b949e" font-size="11">Lewis 2021 / Roller 2021</text>

<rect x="800" y="100" width="350" height="185" rx="9" fill="#161b22" stroke="#3fb950" stroke-width="1.6"/>
<text x="816" y="128" fill="#3fb950" font-size="14" font-weight="700">③ Expert-choice 专家选 token</text>
<text x="816" y="154" fill="#e6edf3" font-size="11.5">· 反转方向：每个专家选 top-k 个 token</text>
<text x="816" y="175" fill="#3fb950" font-size="11.5">· 固定容量桶 → 负载完全均衡，约 2× 加速</text>
<text x="816" y="196" fill="#f85149" font-size="11.5">· token 可被 0 个或多个专家选中</text>
<text x="816" y="217" fill="#f85149" font-size="11.5">· 破坏因果性，不适合自回归生成</text>
<text x="816" y="264" fill="#8b949e" font-size="11">Zhou 2022</text>

<rect x="60" y="310" width="350" height="185" rx="9" fill="#161b22" stroke="#d29922" stroke-width="1.6"/>
<text x="76" y="338" fill="#d29922" font-size="14" font-weight="700">④ Soft MoE 软分配</text>
<text x="76" y="364" fill="#e6edf3" font-size="11.5">· 对全部 token 做完全可微的加权软分配</text>
<text x="76" y="385" fill="#3fb950" font-size="11.5">· 无离散选择 → 不丢 token、梯度连续、训练稳</text>
<text x="76" y="406" fill="#f85149" font-size="11.5">· 推理变稠密计算，失去稀疏省算优势</text>
<text x="76" y="427" fill="#f85149" font-size="11.5">· slot≠专家，语义可解释性弱</text>
<text x="76" y="453" fill="#8b949e" font-size="11">视觉起家，Puigcerver 2023</text>

<rect x="430" y="310" width="350" height="185" rx="9" fill="#161b22" stroke="#39c5cf" stroke-width="1.6"/>
<text x="446" y="338" fill="#39c5cf" font-size="14" font-weight="700">⑤ 深度稀疏 Mixture-of-Depths</text>
<text x="446" y="364" fill="#e6edf3" font-size="11.5">· 不选专家，而选「哪些 token 过这一层」</text>
<text x="446" y="385" fill="#3fb950" font-size="11.5">· 约 80% 算力预算匹配 dense，前向最高约 5× 省</text>
<text x="446" y="406" fill="#e6edf3" font-size="11.5">· 静态计算图，把稀疏从宽度推进到深度/时间</text>
<text x="446" y="453" fill="#8b949e" font-size="11">Raposo 2024（DeepMind）</text>

<rect x="800" y="310" width="350" height="185" rx="9" fill="#161b22" stroke="#f85149" stroke-width="1.6"/>
<text x="816" y="338" fill="#f85149" font-size="14" font-weight="700">⑥ 2026 免训练 / 控制论路由</text>
<text x="816" y="364" fill="#e6edf3" font-size="11.5">· SSMoE：专家权重特征向量做免训练路由</text>
<text x="816" y="385" fill="#e6edf3" font-size="11.5">· ID Balancing：PID 控制器在线修正偏置</text>
<text x="816" y="406" fill="#e6edf3" font-size="11.5">· MirrorMoE：token 自适应抑制冗余专家</text>
<text x="816" y="427" fill="#3fb950" font-size="11.5">· 少学/不学路由，靠结构先验根治坍塌</text>
<text x="816" y="453" fill="#8b949e" font-size="11">768 专家极稀疏成为新基准</text>

<rect x="60" y="540" width="1090" height="180" rx="9" fill="#10141a" stroke="#30363d"/>
<text x="80" y="570" fill="#8b949e" font-size="13" font-weight="700">选择主体光谱</text>
<line x1="120" y1="620" x2="1080" y2="620" stroke="#58a6ff" stroke-width="2" marker-end="url(#b)"/>
<text x="120" y="652" fill="#58a6ff" font-size="12" text-anchor="middle">token 主动选专家</text>
<text x="600" y="652" fill="#d29922" font-size="12" text-anchor="middle">软分配 / 确定性 / 深度稀疏（折中）</text>
<text x="1080" y="652" fill="#3fb950" font-size="12" text-anchor="middle">专家主动选 token</text>
<text x="600" y="690" fill="#e6edf3" font-size="12" text-anchor="middle">工程现实：旗舰 LLM 几乎都用 ① token-choice top-k + 辅助均衡</text>
<text x="600" y="712" fill="#8b949e" font-size="11.5" text-anchor="middle">③④ 主要用于训练效率/视觉；⑤⑥ 是 2024–2026 最活跃的新前沿</text>
</svg>
</body></html>
