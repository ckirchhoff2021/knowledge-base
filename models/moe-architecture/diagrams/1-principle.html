<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>图1 · 第一性原理</title>
<style>
html,body{margin:0;padding:0;background:#0d1117}
svg{display:block;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
</style></head><body>
<svg viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg">
<rect width="1200" height="760" fill="#0d1117"/>
<defs>
<marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#58a6ff"/></marker>
<marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#3fb950"/></marker>
<marker id="y" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#d29922"/></marker>
</defs>
<text x="50" y="42" fill="#e6edf3" font-size="23" font-weight="700">图 1 · 第一性原理：MoE 把「知识容量」与「每 token 计算量」解耦</text>
<text x="50" y="68" fill="#8b949e" font-size="12.5">左：Dense FFN——所有 token 共用同一组权重，容量=计算；右：稀疏 MoE——N 个专家只激活 top-k，容量∝N 而计算∝k</text>

<text x="300" y="110" fill="#d29922" font-size="16" font-weight="700" text-anchor="middle">Dense（稠密）层</text>
<rect x="150" y="130" width="300" height="60" rx="9" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
<text x="300" y="156" fill="#e6edf3" font-size="13" text-anchor="middle">输入 token x</text>
<text x="300" y="177" fill="#8b949e" font-size="11" text-anchor="middle">（每个 token 都走这条路）</text>
<line x1="300" y1="190" x2="300" y2="224" stroke="#d29922" stroke-width="1.8" marker-end="url(#y)"/>
<rect x="120" y="226" width="360" height="150" rx="9" fill="#1a1408" stroke="#d29922" stroke-width="1.6"/>
<text x="300" y="253" fill="#d29922" font-size="14" font-weight="700" text-anchor="middle">唯一的 FFN（W₁, W₂, W₃）</text>
<text x="300" y="280" fill="#e6edf3" font-size="12.5" text-anchor="middle">参数量 = D</text>
<text x="300" y="304" fill="#e6edf3" font-size="12.5" text-anchor="middle">每个 token 激活全部 D 个参数</text>
<text x="300" y="328" fill="#f85149" font-size="12.5" font-weight="700" text-anchor="middle">容量 ↑ 必须计算 ↑（强绑定）</text>
<text x="300" y="353" fill="#8b949e" font-size="11.5" text-anchor="middle">想更聪明 → 模型变大 → 每个 token 都更贵</text>
<line x1="300" y1="376" x2="300" y2="410" stroke="#d29922" stroke-width="1.8" marker-end="url(#y)"/>
<rect x="150" y="412" width="300" height="56" rx="9" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
<text x="300" y="446" fill="#e6edf3" font-size="13" text-anchor="middle">输出</text>
<rect x="120" y="500" width="360" height="120" rx="9" fill="#10141a" stroke="#30363d"/>
<text x="300" y="527" fill="#8b949e" font-size="12.5" text-anchor="middle">缩放方式</text>
<text x="300" y="553" fill="#e6edf3" font-size="13" text-anchor="middle">总参数 = 激活参数</text>
<text x="300" y="579" fill="#f85149" font-size="12.5" text-anchor="middle">计算量随容量线性增长</text>
<text x="300" y="603" fill="#8b949e" font-size="11.5" text-anchor="middle">FLOPs ≈ 常数 × 模型大小</text>

<text x="900" y="110" fill="#3fb950" font-size="16" font-weight="700" text-anchor="middle">稀疏 MoE 层</text>
<rect x="750" y="130" width="300" height="60" rx="9" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
<text x="900" y="156" fill="#e6edf3" font-size="13" text-anchor="middle">输入 token x</text>
<text x="900" y="177" fill="#8b949e" font-size="11" text-anchor="middle">（门控先打分）</text>
<line x1="900" y1="190" x2="900" y2="214" stroke="#3fb950" stroke-width="1.8" marker-end="url(#g)"/>
<rect x="770" y="216" width="260" height="44" rx="9" fill="#0e1d12" stroke="#3fb950" stroke-width="1.6"/>
<text x="900" y="243" fill="#3fb950" font-size="12.5" text-anchor="middle">Router 门控 g = softmax(W_g · x)</text>
<rect x="640" y="300" width="100" height="72" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="690" y="330" fill="#e6edf3" font-size="12.5" text-anchor="middle">专家 E₁</text>
<text x="690" y="352" fill="#8b949e" font-size="11" text-anchor="middle">FFN</text>
<rect x="760" y="300" width="100" height="72" rx="9" fill="#0e1d12" stroke="#3fb950" stroke-width="1.5"/>
<text x="810" y="330" fill="#3fb950" font-size="12.5" text-anchor="middle">专家 E₂</text>
<text x="810" y="352" fill="#8b949e" font-size="11" text-anchor="middle">FFN</text>
<rect x="880" y="300" width="100" height="72" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="930" y="330" fill="#e6edf3" font-size="12.5" text-anchor="middle">…</text>
<text x="930" y="352" fill="#8b949e" font-size="11" text-anchor="middle">FFN</text>
<rect x="1000" y="300" width="100" height="72" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="1050" y="330" fill="#e6edf3" font-size="12.5" text-anchor="middle">专家 E_N</text>
<text x="1050" y="352" fill="#8b949e" font-size="11" text-anchor="middle">FFN</text>
<line x1="830" y1="260" x2="812" y2="298" stroke="#3fb950" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#g)"/>
<line x1="900" y1="260" x2="928" y2="298" stroke="#58a6ff" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#b)"/>
<text x="690" y="288" fill="#3fb950" font-size="11">top-k 选择</text>
<text x="940" y="288" fill="#58a6ff" font-size="11">（k≪N，如 k=8/256）</text>
<line x1="700" y1="372" x2="880" y2="414" stroke="#3fb950" stroke-width="1.6" marker-end="url(#g)"/>
<line x1="920" y1="372" x2="905" y2="414" stroke="#58a6ff" stroke-width="1.6" marker-end="url(#b)"/>
<rect x="750" y="416" width="300" height="52" rx="9" fill="#0e1d12" stroke="#3fb950" stroke-width="1.6"/>
<text x="900" y="447" fill="#3fb950" font-size="12.5" text-anchor="middle">加权求和 y = Σ g_i · E_i(x)</text>
<rect x="640" y="500" width="420" height="120" rx="9" fill="#10141a" stroke="#30363d"/>
<text x="850" y="527" fill="#8b949e" font-size="12.5" text-anchor="middle">缩放方式</text>
<text x="850" y="553" fill="#e6edf3" font-size="12.5" text-anchor="middle">总参数 ∝ N（容量）｜ 激活参数 ∝ k（计算）</text>
<text x="850" y="579" fill="#3fb950" font-size="12.5" font-weight="700" text-anchor="middle">N 可上千、k 保持个位数 → 容量近乎「免费」</text>
<text x="850" y="603" fill="#8b949e" font-size="11.5" text-anchor="middle">DeepSeek-V3：671B 总参 / 仅 37B 激活（5.5%）</text>

<rect x="480" y="150" width="140" height="330" rx="12" fill="#0d1117" stroke="#bc8cff" stroke-width="1.2"/>
<text x="550" y="182" fill="#bc8cff" font-size="13" font-weight="700" text-anchor="middle">核心</text>
<text x="550" y="214" fill="#bc8cff" font-size="12.5" text-anchor="middle">「记住更多知识」</text>
<text x="550" y="240" fill="#8b949e" font-size="12" text-anchor="middle">与</text>
<text x="550" y="268" fill="#bc8cff" font-size="12.5" text-anchor="middle">「算得多快」</text>
<text x="550" y="300" fill="#8b949e" font-size="12" text-anchor="middle">分到两个</text>
<text x="550" y="326" fill="#8b949e" font-size="12" text-anchor="middle">独立旋钮</text>
</svg>
</body></html>
