<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>图1 · 端到端自主科研流水线六层</title>
<style>
html,body{margin:0;padding:0;background:#0d1117}
svg{display:block;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
</style></head><body>
<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1200" height="900" fill="#0d1117"/>
  <text x="60" y="52" fill="#e6edf3" font-size="25" font-weight="700">图 1 · 端到端自主科研智能体的六层流水线与双闭环</text>
  <text x="60" y="80" fill="#8b949e" font-size="13.5">越靠前越依赖品味与范式判断、越无客观验证器；越靠后越易自动化——价值集中在前端，可靠性集中在后端</text>

  <!-- six layers as vertical flow boxes -->
  <g font-size="14">
    <!-- L1 ideation -->
    <rect x="70" y="120" width="760" height="86" rx="10" fill="#2a1a2e" stroke="#bc8cff" stroke-width="1.6"/>
    <text x="92" y="150" fill="#bc8cff" font-size="16" font-weight="700">① 选题与想法生成 Ideation</text>
    <text x="92" y="176" fill="#c9b8e8" font-size="12.5">宽泛主题 → 文献发散 → 候选想法 → 新颖性/可行性筛选（v2 起只需一个 Markdown 主题）</text>
    <text x="92" y="196" fill="#f0a8a0" font-size="12">风险最高：易把已知概念误判为新颖 · 决定科学价值 · 无客观验证器</text>

    <!-- L2 literature -->
    <rect x="70" y="222" width="760" height="78" rx="10" fill="#12233a" stroke="#58a6ff" stroke-width="1.6"/>
    <text x="92" y="251" fill="#58a6ff" font-size="16" font-weight="700">② 文献与知识检索 Literature / RAG</text>
    <text x="92" y="277" fill="#9ecbff" font-size="12.5">检索论文库 · 找基线 · 做综述｜PaperQA2：每题用约 14.5 篇、21.9% 主动「弃权」、precision≈85%</text>

    <!-- L3 implementation -->
    <rect x="70" y="316" width="760" height="78" rx="10" fill="#12233a" stroke="#58a6ff" stroke-width="1.6"/>
    <text x="92" y="345" fill="#58a6ff" font-size="16" font-weight="700">③ 实验设计与代码实现 Implementation</text>
    <text x="92" y="371" fill="#9ecbff" font-size="12.5">LLM 写实验代码 · Experiment Manager 扩展/调试｜复现：每轮仅增约 8% 字符、42% 实验因代码错误失败</text>

    <!-- L4 execution -->
    <rect x="70" y="410" width="760" height="78" rx="10" fill="#0f2a22" stroke="#3fb950" stroke-width="1.6"/>
    <text x="92" y="439" fill="#3fb950" font-size="16" font-weight="700">④ 实验执行 Execution（沙箱 / 云实验室 / 机器人）</text>
    <text x="92" y="465" fill="#8fe0a8" font-size="12.5">跑代码收指标；化学/材料则调度 ECL、Strateos、A-Lab 做湿实验｜结果须可被客观判定</text>

    <!-- L5 analysis -->
    <rect x="70" y="504" width="760" height="78" rx="10" fill="#0f2a22" stroke="#3fb950" stroke-width="1.6"/>
    <text x="92" y="533" fill="#3fb950" font-size="16" font-weight="700">⑤ 结果分析与迭代 Analysis Loop</text>
    <text x="92" y="559" fill="#8fe0a8" font-size="12.5">实验输出/图表反馈给 agent · v2 用 VLM 评图 · 组织为树搜索的扩展与剪枝</text>

    <!-- L6 writing review -->
    <rect x="70" y="598" width="760" height="86" rx="10" fill="#33260a" stroke="#d29922" stroke-width="1.6"/>
    <text x="92" y="628" fill="#d29922" font-size="16" font-weight="700">⑥ 写作与自动评审 Writing &amp; Review</text>
    <text x="92" y="654" fill="#e8c98a" font-size="12.5">自动生成论文全文 · Automated Reviewer 打分｜厂商口径平衡准确率≈69%</text>
    <text x="92" y="674" fill="#f0a8a0" font-size="12">但真实撤稿论文检测率仅约 16% · prompt injection 50 篇仅检出 8 篇</text>
  </g>

  <!-- down arrows between layers -->
  <g stroke="#6e7681" stroke-width="2.5" fill="#6e7681">
    <path d="M450,208 L450,220" marker-end="url(#ad)"/>
    <path d="M450,302 L450,314" marker-end="url(#ad)"/>
    <path d="M450,396 L450,408" marker-end="url(#ad)"/>
    <path d="M450,490 L450,502" marker-end="url(#ad)"/>
    <path d="M450,584 L450,596" marker-end="url(#ad)"/>
  </g>

  <!-- inner loop arrow L5 -> L3 -->
  <path d="M830,543 C910,543 910,355 836,355" fill="none" stroke="#3fb950" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ag)"/>
  <text x="925" y="455" fill="#3fb950" font-size="12.5" font-weight="700" writing-mode="tb">内循环：执行—观察—修正（树搜索）</text>

  <!-- outer loop L6 -> L1 -->
  <path d="M60,641 C24,641 24,163 66,163" fill="none" stroke="#d29922" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#aa)"/>
  <text x="20" y="420" fill="#d29922" font-size="12.5" font-weight="700" writing-mode="tb">外循环：评审—改进（作者/评审）</text>

  <!-- right verifier gradient panel -->
  <rect x="980" y="120" width="160" height="564" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="1060" y="150" fill="#e6edf3" font-size="14" font-weight="700" text-anchor="middle">验证器依赖</text>
  <text x="1060" y="176" fill="#f85149" font-size="12.5" text-anchor="middle">弱 ↑</text>
  <text x="1060" y="200" fill="#8b949e" font-size="11.5" text-anchor="middle">品味 / 新颖性</text>
  <text x="1060" y="218" fill="#8b949e" font-size="11.5" text-anchor="middle">范式判断</text>
  <rect x="1010" y="236" width="100" height="300" rx="6" fill="url(#grad)"/>
  <text x="1060" y="560" fill="#3fb950" font-size="12.5" text-anchor="middle">强 ↓</text>
  <text x="1060" y="586" fill="#8b949e" font-size="11.5" text-anchor="middle">测试 / 形式检查</text>
  <text x="1060" y="604" fill="#8b949e" font-size="11.5" text-anchor="middle">仪器表征</text>
  <text x="1060" y="652" fill="#c9d1d9" font-size="11" text-anchor="middle">能力边界≈</text>
  <text x="1060" y="668" fill="#c9d1d9" font-size="11" text-anchor="middle">「有无验证器」</text>

  <!-- bottom cross-cutting bar -->
  <rect x="70" y="720" width="1070" height="60" rx="10" fill="#161b22" stroke="#39c5cf" stroke-width="1.6"/>
  <text x="92" y="746" fill="#39c5cf" font-size="14" font-weight="700">横切机制</text>
  <text x="92" y="768" fill="#9cd8dd" font-size="12.5">多智能体编排（生成/反思/排序/演化/邻近/元综述 + Supervisor）　·　计算预算与搜索治理（test-time compute 的分配与剪枝）</text>

  <defs>
    <marker id="ad" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3fb950"/></marker>
    <marker id="aa" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d29922"/></marker>
    <linearGradient id="grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f85149" stop-opacity="0.55"/><stop offset="1" stop-color="#3fb950" stop-opacity="0.55"/></linearGradient>
  </defs>
</svg>
</body></html>
