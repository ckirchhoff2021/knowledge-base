    <text x="250" y="368" fill="#8bb8e0" text-anchor="middle" font-size="11">ART · 费马（本轮已直读 200）</text>
    <polygon points="100,400 400,400 440,500 60,500" fill="#33260a" stroke="#d29922" stroke-width="1.6"/>

  </g>
  <text x="250" y="632" fill="#8b949e" font-size="11.5" text-anchor="middle">原则：能读一手不引二手；受控 benchmark 不外推；厂商数字标口径</text>

  <text x="800" y="128" fill="#e6edf3" font-size="16" font-weight="700" text-anchor="middle">声明 × 证据状态矩阵</text>
  <g font-size="12">
    <!-- header -->

    <text x="1050" y="170" fill="#58a6ff" font-weight="700">结论</text>
  </g>

    <text x="512" y="228" fill="#8b949e" font-size="10.5">约950 agents·21h·210M tok</text>
    <text x="512" y="246" fill="#8b949e" font-size="10.5">200k RT·3.5k 候选·20 入围</text>
    <text x="800" y="232" fill="#7ee787" text-anchor="middle">✅ 200</text>
    <text x="930" y="232" fill="#d29922" text-anchor="middle">✗ 预印本</text>
    <text x="1050" y="222" fill="#e8c98a" text-anchor="middle">官方口径</text>
    <text x="1050" y="242" fill="#f0a8a0" text-anchor="middle" font-size="10">功能未知</text>

    <!-- Fermat -->
    <rect x="500" y="270" width="600" height="84" fill="#161b22" stroke="#30363d"/>
    <text x="512" y="294" fill="#c9d1d9" font-weight="700">费马大定理 Lean 形式化</text>
    <text x="512" y="314" fill="#8b949e" font-size="10.5">1300万行·29.5k定理·11天</text>

    <text x="800" y="318" fill="#7ee787" text-anchor="middle">✅ 200</text>
    <text x="930" y="318" fill="#d29922" text-anchor="middle">✗ 研究帖</text>
    <text x="1050" y="308" fill="#e8c98a" text-anchor="middle">官方口径</text>

    <rect x="500" y="356" width="600" height="84" fill="#1a1518" stroke="#f85149" stroke-width="1.4"/>
    <text x="512" y="380" fill="#c9d1d9" font-weight="700">Navier-Stokes 奇点解</text>

    <rect x="500" y="442" width="600" height="84" fill="#161b22" stroke="#30363d"/>

  <rect x="500" y="548" width="600" height="190" rx="10" fill="#161b22" stroke="#39c5cf" stroke-width="1.6"/>
  <text x="520" y="578" fill="#39c5cf" font-size="14.5" font-weight="700">审计要点</text>
  <g font-size="12" fill="#c9d1d9">
    <text x="520" y="606">① ART / 费马：官方页可直读 → 采信为「官方口径」，但均未经同行评审</text>
    <text x="520" y="632">② ART 功能未知、人类做湿实验；费马是形式化已有证明——宣传须打折</text>
    <text x="520" y="658">③ Navier-Stokes：官方 403 + 未评审 + 署名争议 → 明确「待独立验证」</text>
    <text x="520" y="684">④ N=4 九圈：数学玩具模型、已知方法 + 更多算力，非真实粒子物理发现</text>
    <text x="520" y="710">⑤ 共同点：算力与编排已能「规模化产出」，但科学把关仍由人类与时间完成</text>
  </g>
  <text x="60" y="830" fill="#8b949e" font-size="12.5">结论：2026-09 标志「科研产出的自动化」跑通，而非「科学发现的可靠性」跑通——二者不可混为一谈</text>
